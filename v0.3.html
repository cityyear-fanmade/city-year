<title>도시의 한 해</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;900&display=swap">
<style>
/* 레이아웃: 한 열짜리 텍스트 어드벤처. 전투는 적 / 주사위 무대 / 나 / 기록 / 손패 순서. 적과 나는 각자의 색으로 구분한다. */
:root{
  --bg:#0c0e13; --panel:#131722; --panel2:#1a1f2d; --line:#262c3b; --line2:#3a4256;
  --fg:#e7e2d7; --dim:#8d93a3; --gold:#c8a35a; --gold-ink:#1a1405;
  --bleed:#d1686b; --rupture:#7ba6dc; --breath:#79c2b3; --good:#8fbf7a;
  --serif:"Noto Serif KR","Nanum Myeongjo",serif;
  --sans:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.65 var(--sans);padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}
h1{font:900 clamp(34px,10vw,48px)/1.1 var(--serif);letter-spacing:-.01em;text-wrap:balance}
h2{font:600 22px/1.35 var(--serif);text-wrap:balance}
.serif{font-family:var(--serif)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.small{font-size:12.5px}
.eyebrow{font:500 11.5px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:12px 14px;min-height:46px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;width:100%}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700;align-items:center;justify-content:center;text-align:center}
.btn.quiet{background:transparent}
.btn b{font-weight:700}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bar{height:8px;background:#222836;border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12px/1 var(--mono);padding:5px 7px;border:1px solid var(--line2);border-radius:3px;color:var(--fg);white-space:nowrap}
.swatch{width:12px;height:12px;border-radius:2px;flex:none}
.lead{color:var(--dim);text-wrap:pretty}
.roll{display:grid;grid-template-columns:64px 44px minmax(0,1fr);gap:10px;align-items:baseline;padding-block:10px;border-top:1px solid var(--line)}
.roll:first-of-type{border-top:0}
.roll .v{font:500 20px/1 var(--mono);color:var(--gold)}
.roll .n{display:flex;flex-direction:column;gap:2px}
.roll .n span{color:var(--dim);font-size:13px}
.log{font:400 12.5px/1.7 var(--mono);max-height:200px;overflow-y:auto;background:#0f1219;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.log div{padding-block:1px;overflow-wrap:anywhere}
.log .head{color:var(--gold);padding-top:6px}
.log .sys{color:var(--dim)}
.log .hit{color:var(--fg)}
.log .miss{color:var(--dim)}
.log .dmg{color:var(--bleed)}
.log .kw{color:var(--rupture)}
.hand{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{position:relative;font:inherit;color:var(--fg);text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:10px 10px 10px 42px;min-height:84px;display:flex;flex-direction:column;gap:5px;cursor:pointer}
.card:disabled{opacity:.38;cursor:default}
.card.sel{border-color:var(--gold);background:#231f15}
.card .cost{position:absolute;left:9px;top:10px;width:24px;height:24px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font:500 13px/1 var(--mono)}
.card .ord{position:absolute;right:8px;top:8px;font:500 12px/1 var(--mono);color:var(--gold-ink);background:var(--gold);border-radius:3px;padding:3px 5px;font-style:normal}
.card .nm{font-weight:700;font-size:14px;line-height:1.3;padding-right:20px}
.card .cd{font:400 11.5px/1.5 var(--mono);color:var(--dim)}
.card .chips{gap:4px}
.card .chip{font-size:11px;padding:3px 5px}
.stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.stat div{background:var(--panel2);border-radius:4px;padding:8px 4px}
.stat b{display:block;font:500 17px/1.2 var(--mono);color:var(--gold)}
.stat span{font-size:11.5px;color:var(--dim)}
details{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--panel)}
summary{cursor:pointer;font-weight:700}
details ul{margin:10px 0 0;padding-left:18px;color:var(--dim);font-size:13.5px}
details li{margin-block:3px}
table{width:100%;border-collapse:collapse;font:400 13px/1.5 var(--mono)}
th,td{padding:8px 6px;border-top:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left;font-family:var(--sans)}
th{color:var(--dim);font-weight:400;border-top:0}
.tbl{overflow-x:auto}
.check{font:400 13px/1.6 var(--mono);color:var(--dim);border-left:2px solid var(--gold);padding-left:10px}
.good{color:var(--good)}.bad{color:var(--bleed)}

/* 색 고르기 / 연출 설정 */
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--fg);outline:2px solid var(--bg);outline-offset:-4px}
.seg{display:flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:13px;padding:10px 6px;background:transparent;color:var(--dim);border:0;border-left:1px solid var(--line2);cursor:pointer;min-height:42px}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--gold);color:var(--gold-ink);font-weight:700}

/* 전투 무대 */
.ent{position:relative}
.arena{background:#0f1219;border:1px solid var(--line);border-radius:6px;padding:12px;min-height:76px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}
.alabel{font:500 13px/1.4 var(--mono);color:var(--dim);text-align:center;min-height:18px}
.dice{display:flex;gap:12px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.dwrap{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:76px}
.dcap{font:500 11px/1 var(--mono);letter-spacing:.1em;color:var(--dim)}
.die{width:64px;height:64px;border:2px solid var(--line2);border-radius:12px;display:grid;place-items:center;background:var(--panel2)}
.die.big{width:72px;height:72px}
.die b{font:500 26px/1 var(--mono);font-variant-numeric:tabular-nums}
.die.rolling{animation:wob .24s linear infinite}
.die.win{box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 55%,transparent)}
.die.lose{opacity:.6}
.dsum{font:400 12px/1.4 var(--mono);color:var(--dim);min-height:17px;text-align:center;max-width:150px}
.vs{align-self:center;font:500 12px/1 var(--mono);color:var(--dim);padding-top:14px}
.d6s{display:flex;gap:6px;min-height:64px;align-items:center}
.d6{width:42px;height:42px;border-radius:9px;border:2px solid var(--gold);display:grid;place-items:center;background:var(--panel2)}
.d6 b{font:500 20px/1 var(--mono)}
.float{position:absolute;right:14px;top:8px;font:700 22px/1 var(--mono);pointer-events:none;animation:flt .95s ease-out forwards;text-shadow:0 1px 6px #000}
@keyframes wob{0%{transform:rotate(-8deg) translateY(0)}25%{transform:rotate(6deg) translateY(-4px)}50%{transform:rotate(-5deg)}75%{transform:rotate(8deg) translateY(-3px)}100%{transform:rotate(-8deg)}}
@keyframes settle{0%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes lungeUp{0%{transform:translateY(0)}35%{transform:translateY(-18px)}100%{transform:translateY(0)}}
@keyframes lungeDown{0%{transform:translateY(0)}35%{transform:translateY(18px)}100%{transform:translateY(0)}}
@keyframes hurt{0%{transform:translateX(0);box-shadow:inset 0 0 0 0 transparent}15%{transform:translateX(-9px);box-shadow:inset 0 0 0 2px var(--bleed)}35%{transform:translateX(8px)}55%{transform:translateX(-5px);box-shadow:inset 0 0 0 2px var(--bleed)}80%{transform:translateX(3px)}100%{transform:translateX(0);box-shadow:inset 0 0 0 0 transparent}}
@keyframes dodge{0%{transform:translateX(0);opacity:1}35%{transform:translateX(24px) skewX(-8deg);opacity:.5}100%{transform:translateX(0);opacity:1}}
@keyframes guard{0%{box-shadow:0 0 0 0 var(--rupture)}50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--rupture) 70%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes flt{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-36px)}}
.settle{animation:settle .3s ease-out}
.lunge-up{animation:lungeUp .45s ease-out}
.lunge-down{animation:lungeDown .45s ease-out}
.hurt{animation:hurt .5s ease-out}
.dodge{animation:dodge .55s ease-out}
.guard{animation:guard .7s ease-out}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<div id="app"></div>

<script>

const REWARDS = ['cog','echo','noon','shard','brand','ripple','fissure','rustblade','breathe','lunge','flurry','shadowstep','bloodlet','tremor','lantern','rend','finale'];
const ENEMIES = {
  lamp:{n:'웃는 가로등',color:'#e3b341',hp:26,atk:0,eva:0,spd:0,deck:['lamp','lamp','glare'],
    intro:'골목 끝의 가로등이 고개를 돌린다. 불빛이 웃는 모양으로 일그러진다.'},
  lullaby:{n:'녹슨 자장가',color:'#c0693a',hp:32,atk:2,eva:2,spd:2,deck:['rustnote','rustnote','drawl','guard'],

  guest:{n:'열두 번째 손님',color:'#9a84c4',hp:40,atk:3,eva:3,spd:3,deck:['tknife','tknife','supper','guard'],

  echo:{n:'꺼진 메아리',color:'#6b7388',hp:30,atk:1,eva:4,spd:1,deck:['faint','faint','hollow','guard'],

};
const FIGHT = {3:'lamp',6:'lullaby',7:'guest'};

/* 색: 플레이어가 고르거나 무작위. 해결사가 되면 색 + 가장 높은 능력치로 특색 칭호가 정해진다 */

  {adj:'푸른',hex:'#6f9bd1'},{adj:'붉은',hex:'#d1686b'},{adj:'잿빛',hex:'#9a948c'},
  {adj:'검은',hex:'#7a8298'},{adj:'보랏빛',hex:'#9a84c4'},{adj:'금빛',hex:'#c8a35a'},
  {adj:'은빛',hex:'#b9c2cf'},{adj:'창백한',hex:'#cfd8d4'},{adj:'주홍',hex:'#d9784a'},{adj:'옥빛',hex:'#79c2b3'}
];
const TITLE_WORDS = {
  atk:['정오','낙인'], eva:['서리','그림자'], spd:['여명','잔향'], hp:['적막','침묵']
};

const ORIGINS = [
  {max:25,n:'뒷골목 태생',t:'빛이 닿지 않는 골목에서 눈치로 자랐다.',e:'회피 +3 · 카드 균열 보행',fx:{eva:3},card:'fissure'},
  {max:50,n:'둥지 노동자',t:'공장 소음 속에서 몸으로 먹고살았다.',e:'최대 HP +10 · 카드 녹슨 칼날',fx:{maxHp:10},card:'rustblade'},
  {max:75,n:'날개의 하급직',t:'규칙과 서류 사이에서 버티는 법을 안다.',e:'공격 +1 · 회피 +1 · 카드 호흡 고르기',fx:{atk:1,eva:1},card:'breathe'},

];
const TALENTS = [

];
const FLAWS = [

  {max:40,n:'불면',t:'잠든 기억이 없다.',e:'속도 -2',fx:{spd:-2}},
  {max:60,n:'낙인',t:'이름 위에 지워지지 않는 표시가 있다.',e:'사건 판정 -5',fx:{check:-5}},
  {max:80,n:'광기',t:'가끔 자신이 두 명처럼 느껴진다.',e:'전투 시작: 출혈 2, 호흡 3',fx:{startBleed:2,startBreath:3}},
  {max:100,n:'추적자',t:'누군가 계속 따라온다.',e:'적 HP +5',fx:{enemyHp:5}}
];

/* 사건: c = 선택지, check = 1d100 + 능력치 + 판정보정 ≥ dc */
const EVENTS = [

/* ===== 유틸 ===== */
const d = n => 1 + Math.floor(Math.random()*n);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const sg = n => n>=0 ? '+'+n : '−'+Math.abs(n);
const STAT = {atk:'공격',eva:'회피',spd:'속도'};
function sample(arr,k){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,k)}
const pick = (tbl,r) => tbl.find(x=>r<=x.max);

/* ===== 캐릭터 ===== */
function newChar(){
  const r={o:d(100),t:d(100),f:d(100),n:d(100)};
  const o=pick(ORIGINS,r.o),t=pick(TALENTS,r.t),f=pick(FLAWS,r.f),ci=Math.floor((r.n-1)/10);
  const s={maxHp:CFG.baseHp,atk:0,eva:0,spd:0,check:0,startBleed:0,startBreath:0,enemyHp:0};
  for(const x of [o,t,f]) for(const k in x.fx) s[k]+=x.fx[k];
  return {r,o,t,f,ci,color:COLORS[ci].hex,fixer:false,title:null,stats:s,hp:s.maxHp,deck:['slash','thrust','smash','guard',o.card]};
}
/* 해결사 등록: 색 + 가장 높은 능력치의 단어 = 특색 칭호 */
function becomeFixer(ch){
  if(ch.fixer)return null;
  const s=ch.stats;
  const c=sample([['atk',s.atk],['eva',s.eva],['spd',s.spd],['hp',(s.maxHp-CFG.baseHp)/4]],4);
  let best=c[0];for(const x of c)if(x[1]>best[1])best=x;
  const words=TITLE_WORDS[best[0]];
  ch.fixer=true;ch.rank=9;ch.dom=best[0];
  ch.title=COLORS[ch.ci].adj+' '+words[Math.floor(Math.random()*words.length)];
  return ch.title;
}
/* 승급: 급수가 2 오르고 가장 높은 능력치가 한 단계 자란다 */
function promote(ch){
  ch.rank=Math.max(3,ch.rank-2);
  const k=ch.dom,s=ch.stats,chips=['승급 · '+ch.rank+'급'];
  if(k==='hp'){s.maxHp+=4;ch.hp+=4;chips.push('최대 HP +4')}else{s[k]+=1;chips.push(STAT[k]+' +1')}
  return chips;
}
const rankLabel=ch=>ch.fixer?`${ch.title} · ${ch.rank}급`:'무명';

/* ===== 전투 엔진 (화면과 무관, 연출용 이벤트를 함께 기록) ===== */
function mkEntity(o){return Object.assign({bleed:0,rupture:0,breath:0,evaB:0,fs:false},o)}
function snap(C){
  const f=X=>({hp:Math.max(0,X.hp),bleed:X.bleed,rupture:X.rupture,breath:X.breath});
  return {P:f(C.P),E:f(C.E)};
}
function mkCombat(ch,id,quiet){
  const s=ch.stats,e=ENEMIES[id];
  const P=mkEntity({name:'당신',color:ch.color,hp:ch.hp,maxHp:s.maxHp,atk:s.atk,eva:s.eva,spd:s.spd,bleed:s.startBleed,breath:s.startBreath,deck:ch.deck,isP:true});
  const eh=e.hp+s.enemyHp;
  const E=mkEntity({name:e.n,color:e.color,hp:eh,maxHp:eh,atk:e.atk,eva:e.eva,spd:e.spd,deck:e.deck,isP:false});
  const C={P,E,id,round:0,log:[],cur:[],evs:[],logBefore:0,catchup:null,over:null,hand:[],sel:[],order:null,light:{P:0,E:0},quiet:!!quiet};
  newRound(C);
  return C;
}
function newRound(C){
  C.round++;
  const {P,E}=C;
  const rp=d(100),re=d(100);
  const tp=rp+P.spd+(C.catchup==='P'?CFG.catchupBonus:0);
  const te=re+E.spd+(C.catchup==='E'?CFG.catchupBonus:0);
  const first=tp>te?'P':te>tp?'E':(P.spd>=E.spd?'P':'E');
  const gap=Math.abs(tp-te);
  C.order={rp,re,tp,te,first,gap,cp:C.catchup==='P',ce:C.catchup==='E',fs:gap>=CFG.gapFirst};
  C.catchup=first==='P'?'E':'P';
  C.light={P:CFG.light,E:CFG.light};
  C.light[first]=Math.min(CFG.lightMax,C.light[first]+CFG.orderBonusLight);
  P.fs=E.fs=false;
  if(C.order.fs)(first==='P'?P:E).fs=true;
  C.hand=sample(P.deck,CFG.hand);
  C.sel=[];
}
function autoPlay(hand,light){
  const plays=[];let l=light;
  for(const id of sample(hand,hand.length)){const c=CARDS[id];if(c.c<=l){plays.push(c);l-=c.c}}
  return plays;
}
const aiPlan=(E,light)=>autoPlay(sample(E.deck,CFG.hand),light);

function applyKw(A,D,c,L){
  for(const [k,n,to] of (c.kw||[])){
    const X=to==='s'?A:D;
    X[k]=Math.min(CFG.stackCap,X[k]+n);
    L('kw',`${X.name} ${KW[k].n} +${n} (${X[k]})`);
  }
}
function act(C,A,D,c,L,push){
  const sideA=A.isP?'P':'E',sideD=D.isP?'P':'E';
  if(c.t==='buff'){L('sys',`${A.name} · ${c.n}`);applyKw(A,D,c,L);push({k:'buff',side:sideA,card:c});return}
  for(let h=0;h<c.hits;h++){
    if(A.hp<=0||D.hp<=0)return;
    const ra=d(100),rd=d(100);
    const fsb=A.fs?CFG.firstHit:0;A.fs=false;
    const am=A.atk+c.hit+fsb,dm=D.eva+D.evaB;
    const sa=ra+am,sd=rd+dm;
    const base={k:'atk',att:sideA,def:sideD,card:c,ra,rd,am,dm,sa,sd,b:c.b};
    if(sa<=sd){
      L('miss',`${A.name} · ${c.n}  ${sa} ≤ ${sd}  빗나감`);
      push(Object.assign(base,{hit:false,rolls:[],dmg:0,note:''}));
      continue;
    }
    const rolls=[];for(let i=0;i<c.dice;i++)rolls.push(d(6));
    let dmg=rolls.reduce((a,b)=>a+b,0)+c.b,note=fsb?' 선제':'';
    if(A.breath>0){
      if(d(100)<=A.breath*CFG.breathCritPer){dmg=Math.ceil(dmg*CFG.critMult);note+=' 치명'}
      A.breath--;
    }
    if(D.rupture>0){dmg+=D.rupture;note+=` 파열+${D.rupture}`;D.rupture--}
    D.hp-=dmg;
    L('hit',`${A.name} · ${c.n}  ${sa} > ${sd}  명중 [${rolls.join(',')}]${c.b?sg(c.b):''}${note} = ${dmg}`);
    applyKw(A,D,c,L);
    push(Object.assign(base,{hit:true,rolls,dmg,note}));
  }
}
function resolveRound(C,pp,ep){
  const {P,E}=C;
  C.cur=[];C.evs=[];
  const L=(t,s)=>{if(C.quiet)return;C.log.push({t,s});C.cur.push({t,s})};
  const push=ev=>{if(C.quiet)return;ev.lines=C.cur;C.cur=[];ev.snap=snap(C);C.evs.push(ev)};
  const o=C.order;
  L('head',`— ${C.round}라운드 · ${o.first==='P'?'당신':E.name} 선공 —`);
  push({k:'head'});
  P.evaB=E.evaB=0;
  const plays={P:pp,E:ep};
  for(const side of ['P','E']){
    const X=side==='P'?P:E;
    for(const c of plays[side])if(c.t==='def'){
      const ev=c.eva||CFG.defBonus;X.evaB+=ev;L('sys',`${X.name} · ${c.n} (회피 +${ev})`);push({k:'def',side,card:c});
    }
  }
  const f=o.first,s=f==='P'?'E':'P';
  const q={P:pp.filter(c=>c.t!=='def'),E:ep.filter(c=>c.t!=='def')};
  const n=Math.max(q.P.length,q.E.length);
  for(let i=0;i<n;i++){
    for(const side of [f,s]){
      const c=q[side][i];if(!c)continue;
      const A=side==='P'?P:E,D=side==='P'?E:P;
      if(P.hp<=0||E.hp<=0)continue;
      act(C,A,D,c,L,push);
    }
  }
  for(const side of ['P','E']){
    const X=side==='P'?P:E;
    if(X.hp>0&&X.bleed>0){
      const dmg=X.bleed;X.hp-=dmg;L('dmg',`${X.name} 출혈 ${dmg} 피해`);X.bleed=Math.floor(X.bleed/2);
      push({k:'bleed',side,dmg});
    }
  }
  P.hp=Math.max(0,P.hp);E.hp=Math.max(0,E.hp);
  if(P.hp<=0)C.over='lose';else if(E.hp<=0)C.over='win';
}
function fightAuto(ch,id){
  const C=mkCombat(ch,id,true);let g=0;
  while(!C.over&&g++<80){
    resolveRound(C,autoPlay(C.hand,C.light.P),aiPlan(C.E,C.light.E));
    if(!C.over)newRound(C);
  }
  return C;
}
function simAll(n){
  const rows=[];
  for(const id of Object.keys(ENEMIES)){
    let w=0,rs=0,hl=0;
    for(let i=0;i<n;i++){
      const C=fightAuto(newChar(),id);rs+=C.round;
      if(C.over==='win'){w++;hl+=C.P.hp}
    }
    rows.push({n:ENEMIES[id].n,win:w/n,rounds:rs/n,left:w?hl/w:0});
  }
  let clear=0;
  for(let i=0;i<n;i++){
    const ch=newChar();let hp=ch.stats.maxHp,ok=true;
    for(const id of ['lamp','lullaby','guest']){
      const C=fightAuto(Object.assign({},ch,{hp}),id);
      if(C.over!=='win'){ok=false;break}
      hp=Math.min(ch.stats.maxHp,C.P.hp+CFG.chainHeal);
    }
    if(ok)clear++;
  }
  return {rows,chain:clear/n};
}

async function playEvent(e){
  const nmOf=s=>s==='P'?'당신':C.E.name;
  if(e.k==='head'){setLabel(e.lines[0]?e.lines[0].s:'');appendLog(e.lines);await wait(500);return}
  if(e.k==='def'){setLabel(`${nmOf(e.side)} · ${e.card.n}`);anim($('ent-'+e.side),'guard',700);appendLog(e.lines);await wait(450);return}
  if(e.k==='buff'){setLabel(`${nmOf(e.side)} · ${e.card.n}`);anim($('ent-'+e.side),'guard',700);appendLog(e.lines);applySnap(e.snap);await wait(500);return}
  if(e.k==='bleed'){
    setLabel(`${nmOf(e.side)} · 출혈`);anim($('ent-'+e.side),'hurt',500);
    floatTxt(e.side,'−'+e.dmg,'var(--bleed)');appendLog(e.lines);applySnap(e.snap);await wait(550);return;
  }
  const X=e.att==='P'?C.P:C.E,Y=e.def==='P'?C.P:C.E;
  const dA=$('dA'),dD=$('dD');
  if(!dA||!dD)return;
  setLabel(`${nmOf(e.att)} · ${e.card.n}`);
  dA.className='die rolling';dD.className='die rolling';
  dA.style.borderColor=X.color;dD.style.borderColor=Y.color;
  $('dmgw').hidden=true;$('sA').textContent='';$('sD').textContent='';
  await Promise.all([
    rollNum(dA.firstElementChild,e.ra,650,100).then(()=>{dA.classList.remove('rolling');anim(dA,'settle',320)}),
    rollNum(dD.firstElementChild,e.rd,900,100).then(()=>{dD.classList.remove('rolling');anim(dD,'settle',320)})
  ]);
  $('sA').textContent=`${e.ra}${e.am?sg(e.am):''} = ${e.sa}`;
  $('sD').textContent=`${e.rd}${e.dm?sg(e.dm):''} = ${e.sd}`;
  dA.classList.add(e.hit?'win':'lose');dD.classList.add(e.hit?'lose':'win');
  await wait(350);
  anim($('ent-'+e.att),e.att==='P'?'lunge-up':'lunge-down',500);
  await wait(200);
  if(e.hit){
    anim($('ent-'+e.def),'hurt',520);
    const box=$('dmgd');$('dmgw').hidden=false;
    box.innerHTML=e.rolls.map(()=>'<div class="d6"><b>–</b></div>').join('');
    await Promise.all([...box.children].map((el,i)=>rollNum(el.firstElementChild,e.rolls[i],500+i*130,6)));
    $('sM').textContent=`${e.rolls.join('+')}${e.b?sg(e.b):''}${e.note} = ${e.dmg}`;
    floatTxt(e.def,'−'+e.dmg,'var(--bleed)');
    applySnap(e.snap);appendLog(e.lines);
    await wait(600);
  }else{
    anim($('ent-'+e.def),'dodge',600);floatTxt(e.def,'회피','var(--rupture)');
    appendLog(e.lines);applySnap(e.snap);
    await wait(500);
  }
}

    return `<button class="card ${si>=0?'sel':''}" data-a="pick" data-i="${i}" ${dis?'disabled':''}>
      <span class="cost">${c.c}</span>${si>=0?`<em class="ord">${si+1}</em>`:''}
      <span class="nm">${c.n}</span><span class="cd">${cardLine(c)}</span>
      ${c.kw?`<span class="chips">${kwChips(c)}</span>`:''}</button>`;
  }).join('');
  return `${entHtml('E',E,E)}${arenaHtml(false)}${entHtml('P',P,P)}${ord}${log}
    <div class="row between"><span class="eyebrow">손패 · 선택한 순서대로 발동</span><span class="mono" style="color:var(--gold)">빛 ${left}/${C.light.P}</span></div>
    <div class="hand">${cards}</div>
    <button class="btn primary" data-a="go">${C.sel.length?'행동 개시':'아무것도 내지 않고 넘긴다'}</button>${vMode()}`;
}
function vEnd(){
  const c=G.ch,w=UI.endWin;
  return `<div class="stack" style="gap:8px;padding-top:12px"><div class="eyebrow">${w?'일곱 해를 살아냈다':'도시는 당신을 기억하지 않는다'}</div>
    <h1 style="color:${c.color}">${c.fixer?rankLabel(c):'이름 없는 사람'}</h1>
    <p class="lead">${w?'도시는 여전히 그 자리에 있고, 당신은 한 해를 더 살 수 있다.':'이름을 부르는 사람은 없었다. 가로등만 계속 깜빡였다.'}</p></div>
    <div class="panel stack"><div class="stat"><div><b>${G.year}</b><span>도달 연차</span></div><div><b>${sg(c.stats.atk)}</b><span>공격</span></div><div><b>${sg(c.stats.eva)}</b><span>회피</span></div><div><b>${sg(c.stats.spd)}</b><span>속도</span></div></div>
    <div class="chips">${c.deck.map(id=>`<span class="chip">${CARDS[id].n}</span>`).join('')}</div>
    <div class="mono small dim">${c.o.n} · ${c.t.n} · ${c.f.n}${c.office?' · '+c.office:c.fixer?' · 해결사':''}</div></div>
    <button class="btn primary" data-a="start">다시 태어난다</button><button class="btn quiet" data-a="title">처음 화면</button>`;
}
function vSim(){
  const s=SIM,pc=x=>Math.round(x*100)+'%';
  return `<div class="stack" style="gap:6px"><div class="eyebrow">밸런스 측정 · 각 ${s.n}회</div><h2>자동 전투 결과</h2></div>
    <div class="panel tbl"><table><thead><tr><th>적</th><th>승률</th><th>평균 라운드</th><th>승리 시 잔여 HP</th></tr></thead><tbody>
    ${s.r.rows.map(r=>`<tr><td>${r.n}</td><td>${pc(r.win)}</td><td>${r.rounds.toFixed(1)}</td><td>${r.left.toFixed(0)}</td></tr>`).join('')}</tbody></table></div>
    <div class="panel"><div class="row between"><span>연속 3전 클리어</span><b class="mono" style="color:var(--gold)">${pc(s.r.chain)}</b></div>
    <p class="small dim" style="margin-top:6px">무작위 캐릭터, 카드는 손패에서 무작위로 낸다. 전투 사이 HP ${CFG.chainHeal} 회복. 보상 카드와 사건 효과는 반영하지 않은 보수적인 값이다.</p></div>
    <button class="btn primary" data-a="sim">다시 측정</button><button class="btn quiet" data-a="title">돌아가기</button>`;
}
function render(){
  const s=UI.screen;
  const h={title:vTitle,birth:vBirth,event:vEvent,result:vResult,combat:vCombat,end:vEnd,sim:vSim}[s]();
  app.innerHTML=`<div class="wrap">${h}</div>`;
  const lg=$('log');if(lg)lg.scrollTop=lg.scrollHeight;
  if(s!==lastScreen){window.scrollTo(0,0);lastScreen=s}
  if(s==='birth'&&BC.fresh&&MODE!=='off'){BC.fresh=false;birthAnim()}
  if(s==='result'&&UI.res.anim&&UI.res.roll){UI.res.anim=false;resultAnim()}
}

/* ===== 진행 ===== */
function applyFx(fx){
  const ch=G.ch,s=ch.stats,chips=[];
  if(fx.maxHp){s.maxHp+=fx.maxHp;ch.hp+=fx.maxHp;chips.push('최대 HP '+sg(fx.maxHp))}
  if(fx.hp){ch.hp=clamp(ch.hp+fx.hp,1,s.maxHp);chips.push('HP '+sg(fx.hp))}
  for(const k of ['atk','eva','spd'])if(fx[k]){s[k]+=fx[k];chips.push(STAT[k]+' '+sg(fx[k]))}
  const cid=fx.card||(fx.reward?rewardCard():null);
  if(cid){ch.deck.push(cid);chips.push('카드 · '+CARDS[cid].n)}
  if(fx.office){ch.office=fx.office;chips.push('소속 · '+fx.office)}
  let title=null;
  if(fx.fixer){title=becomeFixer(ch);if(title)chips.push('해결사 등록')}
  return {chips,title};
}
function rewardCard(){
  const pool=REWARDS.filter(id=>!G.ch.deck.includes(id));
  return pool.length?pool[Math.floor(Math.random()*pool.length)]:null;
}
/* 해결사가 된 4년차에는 소속 선택, 그 밖에는 조건에 맞는 사건을 뽑는다 */
function nextEvent(){
  const ch=G.ch;
  if(G.year===4&&ch.fixer&&!ch.office)return OFFICE_EVENT;
  while(G.pool.length){
    const ev=EVENTS[G.pool.pop()];
    if(ev.req==='fixer'&&!ch.fixer)continue;
    if(ev.req==='nofixer'&&ch.fixer)continue;
    return ev;
  }
  return EVENTS[6];
}
function advanceYear(){
  G.year++;
  if(G.year>CFG.years){G.year=CFG.years;UI.endWin=true;UI.screen='end';render();return}
  if(G.year>1)G.ch.hp=Math.min(G.ch.stats.maxHp,G.ch.hp+CFG.yearHeal);
  const f=FIGHT[G.year];
  UI.ev=f?{t:ENEMIES[f].n,x:ENEMIES[f].intro,c:[{l:'맞선다',ok:{t:'',fx:{combat:f}}}]}:nextEvent();
  UI.screen='event';render();
}
function startCombat(id){C=mkCombat(G.ch,id);PLAYING=false;UI.screen='combat';render()}

const ACT={
  title(){UI.screen='title';render()},
  mode(i){MODE=i;try{localStorage.setItem('cityYearMode',i)}catch(e){}render()},
  start(){BC=newChar();BC.fresh=true;UI.screen='birth';render()},
  reroll(){BC=newChar();BC.fresh=true;render()},
  color(i){BC.ci=+i;BC.color=COLORS[+i].hex;BC.fresh=false;render()},
  live(){G={ch:BC,year:0,pool:sample(EVENTS.map((_,i)=>i),EVENTS.length)};advanceYear()},
  choose(i){
    const c=UI.ev.c[i];let res=c.ok,roll=null;
    if(c.check){
      const st=G.ch.stats,mod=(c.check.s?st[c.check.s]:0)+st.check,r=d(100),tot=r+mod,ok=tot>=c.check.dc;
      roll={r,mod,tot,dc:c.check.dc,ok};res=ok?c.ok:c.fail;
    }
    const fx=res.fx||{};
    const {chips,title}=applyFx(fx);
    if(fx.combat&&!res.t){startCombat(fx.combat);return}
    UI.res={t:res.t,chips,roll,title:title?rankLabel(G.ch):null,anim:!!roll&&MODE!=='off',next:fx.combat?{l:'맞선다',combat:fx.combat}:{l:'다음 해로'}};
    UI.screen='result';render();
  },
  next(){UI.res.next.combat?startCombat(UI.res.next.combat):advanceYear()},
  pick(i){
    i=+i;const at=C.sel.indexOf(i);
    if(at>=0)C.sel.splice(at,1);else C.sel.push(i);
    render();
  },
  go(){
    const pp=C.sel.map(i=>CARDS[C.hand[i]]);
    const lb=C.log.length;PRE=snap(C);
    resolveRound(C,pp,aiPlan(C.E,C.light.E));
    if(MODE==='off'){if(!C.over)newRound(C);render();return}
    C.logBefore=lb;PLAYING=true;render();runPlayback(C.evs);
  },
  skip(){SKIP=true;if(wake)wake()},
  fin(){
    if(C.over==='lose'){UI.endWin=false;UI.screen='end';render();return}
    const ch=G.ch;
    ch.hp=clamp(C.P.hp+CFG.winHeal,1,ch.stats.maxHp);
    const chips=['HP +'+CFG.winHeal],cid=rewardCard();
    if(cid){ch.deck.push(cid);chips.push('카드 · '+CARDS[cid].n)}
    let title=null,tlabel=null,extra='';
    if(!ch.fixer){
      if(becomeFixer(ch)){chips.push('해결사 등록');title=rankLabel(ch);tlabel='특색 칭호';extra=' 소문을 들은 사무소가 해결사로 등록해 주었다.'}
    }else if(FIGHT[G.year]&&ch.rank>3){
      chips.push(...promote(ch));title=rankLabel(ch);tlabel='승급';extra=' 사무소가 급수를 올려 주었다.';
    }
    UI.res={t:`${C.E.name}의 잔해 속에서 쓸 만한 것을 주웠다.${extra}`,chips,roll:null,title,tlabel,next:{l:G.year>=CFG.years?'결말을 본다':'다음 해로'}};
    UI.screen='result';render();
  },
  sim(){SIM={n:300,r:simAll(300)};UI.screen='sim';render()}
};
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(!b||b.disabled)return;
  ACT[b.dataset.a](b.dataset.i);
});
render();
</script>
