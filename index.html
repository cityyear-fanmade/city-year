        <div class="row between"><span class="eyebrow">${CFG.startAge-1}세의 능력치</span></div>
        <div class="stat"><div><b>${s.maxHp}</b><span>HP</span></div><div><b>${sg(s.atk)}</b><span>공격</span></div><div><b>${sg(s.eva)}</b><span>회피</span></div><div><b>${sg(s.spd)}</b><span>속도</span></div></div>
        <div class="chips">${b.deck.map(id=>`<span class="chip">${D.cards[id].n}</span>`).join('')}</div></div>
      ${b.relicPick?`<div class="panel stack" style="gap:8px"><span class="eyebrow">유물 적성 · 하나를 고른다</span><p class="small dim">적성은 가지고 있으나 온전히 다루기 어렵다.</p>${Object.entries(D.relics).map(([k,r])=>`<button class="btn${UI.relic===k?' primary':''}" data-a="relic" data-i="${k}"><b>${esc(r.n)}</b><span class="mono small" style="color:var(--gold)">${esc(r.e)}</span></button>`).join('')}</div>`:''}
      ${vJobRoll()}${vJobPick()}
      ${b.fateChoices&&!b.fated?`<div class="panel stack" style="gap:8px;border-color:var(--gold)"><span class="eyebrow" style="color:var(--gold)">운명이 찾아왔다 · 하나를 고르거나 거절한다</span><span class="small">아무것도 쥐지 않고 태어났지만, 이름 없는 존재에게도 길이 두 갈래로 놓였다.</span>${b.fateChoices.map(r_=>{const h=D.hiddenOrigins.find(x=>x.roll===r_);return `<button class="btn" data-a="fate" data-i="${r_}"><b>${esc(h.n)}</b><span class="small">${esc(h.t)}</span><span class="mono small" style="color:var(--gold)">${esc(h.e)}</span></button>`}).join('')}<button class="btn" data-a="nofate"><b>운명을 거절한다</b><span class="small">아무것도 쥐지 않은 채 그대로 시작한다. 이름 없는 삶, 솔로 엔딩을 노리는 길이다.</span></button></div>`:''}
      <div class="stack"><button class="btn primary" data-a="live" ${(b.relicPick&&!UI.relic)||(b.fateChoices&&!b.fated)?'disabled':''}>${b.fateChoices&&!b.fated?'운명을 먼저 고른다':b.relicPick&&!UI.relic?'유물을 먼저 고른다':'이 삶을 산다'}</button>
      ${b.blank||UI.job?'':'<button class="btn quiet" data-a="blank">어떤 출생 보정도 없이 시작한다</button>'}<button class="btn quiet" data-a="title"><b>첫 화면으로</b><span class="dim small">출생 굴림을 접고 처음으로 돌아간다</span></button></div>${vSettings()}`;
  }
  /* 6시즌: 출생 규칙 설명 + 표 전체 (이번에 나온 칸 표시) */
  function vBirthHelp(b){
    const tbl=(name,list,r,sel)=>{let lo=1;return `<div class="stack" style="gap:2px"><span class="eyebrow">${name} 표 · 1d100${Array.isArray(r)?' · '+r.length+'번':''}</span>${list.map(x=>{const a=lo;lo=x.max+1;const hit=Array.isArray(r)?r.some(v=>v>=a&&v<=x.max):r>=a&&r<=x.max;
      const sec=a===x.max&&(a===1||a===100)&&!hit;
      return `<div class="trow${hit?' hit':''}"><span class="mono">${a===x.max?a:a+'~'+x.max}</span><b>${sec?'???':esc(x.n)}</b><span class="mono small">${sec?'':esc(x.e||'')}</span></div>`}).join('')}</div>`};
    const kidR=b.kid.map(k=>k.r);
    return `<details class="panel bhelp"${UI.helpOpen?' open':''}><summary><b>출생 규칙 · 어떻게 정해지나</b></summary>
      <ul class="small" style="margin:10px 0 0;padding-left:18px;display:grid;gap:6px">
        <li><b>굴림</b> 출신·재능·결점·무기·색을 1d100으로 한 번씩 굴려, 표에서 그 숫자가 들어가는 칸이 정해진다. 숫자는 칸의 위치일 뿐이라 크다고 좋은 것이 아니다.</li>
        <li><b>출신</b> 어디서 태어났는지. 능력치 보정, 시작 카드 1장, 시작 자산이 정해진다. '진로 +'가 붙은 출신은 그 길(해결사·날개·협회·손가락)을 권하는 사건이 더 자주 온다.</li>
        <li><b>재능</b> 타고난 장점 하나. <b>결점</b> 타고난 약점 하나. 둘 다 평생 그대로다.</li>
        <li><b>무기</b> 처음 쥔 무기. 무기 칸 장비라서, 공방에서 더 좋은 무기를 사면 바꿀 수 있다 (바꾼 무기는 보관함으로).</li>
        <li><b>성장기</b> ${D.childhood.stages.map(x=>x.age+'세').join('·')}에 성장표를 1d100으로 굴려, 나온 칸의 능력치가 하나씩 자란다. 같은 칸이 여러 번 나오면 그만큼 쌓인다.</li>
        <li><b>색</b> 1d100을 10칸으로 나눈다. 직접 바꿀 수 있고, 훗날 특색 이름의 앞말이 된다.</li>
        <li><b>다시 태어난다</b>는 전부 새로 굴린다. 시드 번호가 같으면 굴림도 똑같이 나온다.</li></ul>
      <div class="stack" style="gap:12px;margin-top:12px">${b.job?'':tbl('출신',D.origins,b.r.o)}${tbl('재능',D.talents,b.r.t)}${tbl('결점',D.flaws,b.r.f)}${tbl('무기',D.weapons,b.r.w)}${tbl('성장기',D.childhood.table,kidR)}</div>
      <p class="small dim" style="margin-top:8px">밝게 표시된 칸이 이번에 나온 칸이다.</p></details>`;
  }
  /* 히든 직업: 이 브라우저에서 해금한 직업만 고를 수 있다 */
  /* 해금한 사람이 평범하게 굴려 출신 1(발톱)·100(조율자)이 나오면 원래 출신과 히든 직업 중 고른다 */
  function vJobRoll(){
    const b=BC,u=loadUnlocks();if(UI.job&&!UI.jobAuto)return '';
    const k=Object.keys(D.hiddenJobs).find(j=>u.includes(j)&&D.hiddenJobs[j].roll===(UI.jobAuto?D.hiddenJobs[UI.job].roll:b.r.o));if(!k)return '';
    const J=D.hiddenJobs[k],base=UI.jobAuto?UI.jobBase:b.o.n;
    return `<div class="panel stack" style="gap:8px;border-color:var(--gold)"><span class="eyebrow">출신 ${J.roll} · 히든 직업을 고를 수 있다</span>
      <div class="row" style="gap:8px"><button class="btn${!UI.jobAuto?' primary':''}" style="flex:1" data-a="jobroll" data-i="">${esc(base)}</button><button class="btn${UI.jobAuto?' primary':''}" style="flex:1" data-a="jobroll" data-i="${k}">${esc(J.n)}</button></div></div>`;
  }
  function vJobPick(){
    const u=loadUnlocks().filter(k=>D.hiddenJobs[k]);if(!u.length)return '';
    const cur=UI.job&&!UI.jobAuto&&u.includes(UI.job)?UI.job:null;
    return `<div class="panel stack" style="gap:8px;border-color:var(--gold)"><span class="eyebrow">히든 직업 · 해금됨</span>
      <p class="small dim">머리 소속으로 시작한다. 승급과 해결사 등록은 없고, 전용 의뢰가 찾아온다.</p>
      <button class="btn${!cur?' primary':''}" data-a="job" data-i="">평범하게 태어난다</button>
      ${u.map(k=>{const J=D.hiddenJobs[k];return `<button class="btn${cur===k?' primary':''}" data-a="job" data-i="${k}"><b>${esc(J.n)}</b><span class="small">${esc(J.t)}</span><span class="mono small" style="color:var(--gold)">${esc(J.e)}</span></button>`}).join('')}</div>`;
  }
  function vEvent(){
    if(UI.omen)return vOmen();
    if(UI.fight){
      const e=D.enemies[UI.fight];
      const rule=(D.hiddenBosses||[]).find(h=>h.id===UI.fight),pen=rule&&rule.penalty&&!(G.ch.licensed&&G.ch.rank<=rule.penalty.fullRank)?rule.penalty:null;
      const enc=UI.enc&&UI.enc.hidden?`<div class="check"><b>${UI.enc.rift?'균열 너머의 운명':T.hiddenBoss}</b>${pen?` · <span class="bad">${pen.label} · 명중 ${sg(pen.atk)} · 회피 ${sg(pen.eva)} (${pen.fullRank}${T.rankUnit}이면 보정 없음)</span>`:''}</div>`:UI.enc&&UI.enc.roll?`<div class="check">${UI.enc.label} · 1d100 ${UI.enc.roll} → <b>${e.n}</b></div>`:'';
      const avoid=UI.avoidText?`<p class="small dim">${UI.avoidText}</p>`:'';UI.avoidText=null;
      return `${vHud()}<div class="stack" style="gap:8px"><div class="eyebrow">${yearTag()}${E.age(G)}세의 해 · 전투</div>${avoid}${enc}<h2 style="color:${e.color}">${ulName(e.n,e.ul)}</h2>${e.trait&&D.traits&&D.traits[e.trait]?`<div class="check"><b>특성 · ${esc(D.traits[e.trait].n)}</b> · ${esc(D.traits[e.trait].d)}</div>`:''}${e.abno?`<div class="check" style="border-color:#8a7fb8"><b style="color:#8a7fb8">환상체</b> · 마주치면 정신력이 2d3 깎인다${G.ch.ego?` (E.G.O 하한 ${CFG.mind.ego[G.ch.ego.type].floor})`:''}</div>`:''}<p class="lead">${UI.enc&&UI.enc.rift?`갈라진 틈 너머에서 ${esc(e.n)}이(가) 흘러들었다. 이 세계의 사건과는 이어지지 않은 채 다른 운명에서 건너온 존재다. 만날 수 없던 상대가 지금 눈앞에 서 있다.`:e.intro}</p></div>
        <button class="btn primary" data-a="fight">맞선다</button>`;
    }
    const ev=UI.ev,ch=G.ch;
    const lockBtns=E.lockedOptions(G,ev).map(({c,i})=>({i,html:`<button class="btn" disabled><b>🔒 ${c.l}</b><span class="mono small dim">${c.lock}</span></button>`}));
    const btns=E.options(G,ev).map(({c,i})=>{
      let hint=c.h||'판정 없음 · 결과 확정';
      if(c.ok&&c.ok.fx&&c.ok.fx.relicRoll)hint=`1d100 · ${E.relicChance(ch)} 이하가 나오면 유물을 고른다${ch.relicBase?' (출신 보정 '+ch.relicBase+'%)':''}${(ch.stats.relicApt||0)>0?' (유물 적성 +'+ch.stats.relicApt+')':''}`;
      if(c.check){const pm=E.pathMod(ch,c.check);hint=`${c.check.s?STAT[c.check.s]+' 판정':'운 판정'} · 1d${c.check.pure?100:E.checkDie(ch)} ${sg(E.checkMod(ch,c.check))} ≥ ${E.checkDc(ch,c.check)}${pm?` (출신 ${T.paths[c.check.path]} 보정 +${pm})`:''}${c.h?' · '+c.h:''}`}
      return {i,html:`<button class="btn" data-a="choose" data-i="${i}"><b>${c.l}</b><span class="mono small dim">${hint}</span></button>`};
    }).concat(lockBtns).sort((a,b)=>a.i-b.i).map(x=>x.html).join('');
    return `${vHud()}<div class="stack" style="gap:8px"><div class="eyebrow">${yearTag()}${E.age(G)}세의 해</div><h2>${ev.t}</h2><p class="lead">${ev.x}</p></div><div class="stack">${btns}</div>`;
  }
  function nextLabel(){
    if(G.ch.lvPend>0)return '성장 굴림';

  function vResult(){

      ${G.ch.relicPickLate?vLateRelic():G.ch.namePend?vNamePend():G.ch.pillPick?vPillPick():G.ch.singPick?vSingPick():G.ch.bondPick?vBondPick():G.ch.kidPick?vKidPick():G.ch.wingPick?vWingPick():G.ch.orgPick?vOrgPick():G.ch.fingerPick?vFingerPick():G.ch.seongPick?vSeongPick():G.ch.starPick?vStarPick():G.ch.officePick?vOfficePick():G.ch.distPick?vDistPick():G.ch.egoPick?vEgoPick():G.ch.titlePick?vTitlePick():`<button class="btn primary" data-a="flow">${nextLabel()}</button>`}</div>`;
  }
  /* 특색 이름: 색은 고정, 뒤 단어(2~12글자)를 직접 적는다 */
  function vLateRelic(){
    const ks=E.relicChoices(G.ch);
    return `<div class="panel stack" style="gap:8px;border-color:var(--gold)"><span class="eyebrow">잊힌 유물 · 하나를 고른다</span><p class="small dim">이미 가진 유물은 고를 수 없다.</p>
      ${ks.map(k=>{const r=D.relics[k];return `<button class="btn" data-a="lrelic" data-i="${k}"><b>${esc(r.n)}</b><span class="mono small" style="color:var(--gold)">${esc(r.e)}</span></button>`}).join('')}</div>`;
  }
  /* 6시즌: 내 사무소 이름(1~12글자 + 사무소)과 전문 분야 */

  function vFamily(){
    const ch=G.ch,b=ch.bond,BDc=CFG.bond;if(!b)return '<p class="small dim">가족 없음</p>';
    const R=E.bondData(ch)||{who:''},st=b.st;

    const rows=[];
    if(R.look)rows.push(['특징',R.look]);
    if(st==='married'){
      rows.push(['결혼한 해',b.since+'년차']);
      rows.push(['배우자 등급',`${9-E.spouseLevel(b,G.year)}급 (결혼 ${BDc.hunt.spouseYears}년마다 한 단계)`]);

      rows.push(['가족의 목소리',b.saved?'이미 한 번 붙잡아 주었다':`정신력이 1이 되면 한 번 붙잡아 준다 (정신력 ${BDc.saveMind})`]);
      if(ch.distForm)rows.push(['뒤틀린 뒤','이름을 불러도 대답하지 않는다']);

      rows.push(['단계',`${Math.min(b.step,BDc.steps)}/${BDc.steps}${b.step>=BDc.steps?' · 다음은 청혼':''}`]);

  function entHtml(side,X,v,compact){

  function arenaHtml(play){

  function vOrder(compact){
    const li=!compact?`<ol class="order">${C.order.map((X,i)=>`<li><span class="swatch" style="background:${X.color}"></span><b>${i+1}. ${esc(X.name)}</b>

    if(compact){

  /* 이번 라운드에 실제로 발동하는 순서. 적 카드는 미리 공개된 의도, 내 카드는 고른 대로 */

      const kw=(c.kw||[]).map(([k,n,to])=>`<span style="color:${kwc(k)}">${to==='s'?'자신 ':''}${D.keywords[k].n} +${n}</span>`).join(' · ');
      return `${who(st.side)}의 <b>${esc(c.n)}</b> → ${who(other(st.side))} <span class="dim">· ${cardLine(c)}${kw?' · 명중 시 '+kw:''}</span>`};
    const items=q.map((st,i)=>`<li data-i="${i}" class="${st.side==='E'?'foe':''}"><span class="qn">${i+1}</span><span>${what(st)}</span></li>`).join('');
    const g=CFG.guard;

    return `<span class="eyebrow" style="margin-top:6px">이번 라운드 행동 순서 · ${who('E')}의 의도 공개</span><ol class="queue" id="queue">${items}${hint}</ol>`;

  function vCombat(){
    const {P,E:X}=C;

    if(PLAYING){

        :`${entHtml('E',X,PRE.E)}${arenaHtml(true)}${entHtml('P',P,PRE.P)}${vOrder()}${lg}<button class="btn quiet" data-a="skip">연출 건너뛰기</button>${autoOff}`;
    }
    const log=logBox(logLines(C.log.slice(-60))||'<div class="sys">전투가 시작되었다.</div>');
    if(C.over){
      const w=C.over==='win';
      return `${M?duo({E:X,P}):entHtml('E',X,X)+entHtml('P',P,P)}<div class="panel stack"><h2 class="${w?'good':'bad'}">${w?esc(X.name)+'이(가) 쓰러졌다':'당신은 쓰러졌다'}</h2>
        <button class="btn primary" data-a="fin">${w?'전리품을 챙긴다':'결말을 본다'}</button></div>${log}`;
    }
    /* 빛 회복 카드(gain)는 내는 순간 빛이 그만큼 늘어난다 */
    const cost=UI.sel.reduce((a,i)=>a+D.cards[P.hand[i]].c-(D.cards[P.hand[i]].gain||0),0),left=P.light-cost;
    const cards=P.hand.map((id,i)=>{
      const c=D.cards[id],si=UI.sel.indexOf(i),lk=i===P.locked,dis=lk||(si<0&&c.c>left)||(c.needBlack&&!P.black)||(c.needLow&&X.hp>X.maxHp*CFG.raven.low);
      return `<button class="card ${si>=0?'sel':''}${P.index&&i===P.starSlot?' presc':''}" data-a="pick" data-i="${i}" ${dis?'disabled':''}>
        <span class="cost">${c.c}</span>${si>=0?`<em class="ord">${si+1}</em>`:''}${P.index&&i===P.starSlot?'<span class="prescTag">📜 지령</span>':''}
        <span class="nm">${kindBadge(c)} ${c.n}${c.t==='atk'&&P.cg&&P.cg.n?` <b style="color:var(--gold)">${P.cg.n}</b>`:''}${lk?` <span class="bad small">잠김 · ${esc(C.E.passive.n)}</span>`:''}</span>${c.t==='atk'?`<span class="mono small" style="color:var(--gold)">최종 명중 ${sg(P.atk+c.hit+(P.passHit||0)+(P.cg?P.cg.hit:0))}${P.fsOn&&P.fs?' (+선제 '+CFG.firstHit+')':''}</span>`:''}<span class="cd">${cardLine(c,c.t==='atk'?P.cg:null,P.wx)}</span>
        ${c.kw?`<span class="chips">${kwChips(c)}</span>`:''}</button>`;
    }).join('');
    return `${M?duo({E:X,P})+vOrder(true):entHtml('E',X,X)+arenaHtml(false)+entHtml('P',P,P)+vOrder()+log}
      ${P.index&&P.starId?`<div class="prescBar"><b>📜 이번 라운드 지령</b> · <b>${esc(D.cards[P.starId].n)}</b>을(를) 내라 <span class="small">→ 지령 수행 +1 (지금 ${P.presc||0}/5) · 호흡 +4 · 받는 피해 −5%씩</span>${UI.sel.some(j=>j===P.starSlot)?' <b class="good">✔ 지령 카드를 골랐다</b>':''}</div>`:''}
      ${triBar(P)}
      ${egoBar(C.ch)}
      <div class="row between"><span class="eyebrow">손패 · 고른 순서대로 위 순서에 들어간다</span><span class="mono" style="color:var(--gold)">${P.distorted?'빛 없음':`빛 ${left}/${P.light}`}</span></div>
      <div class="hand">${cards}</div>
      ${FIGHT==='auto'?`<div class="check">${UI.paused?'일시정지 · 다음 라운드를 기다린다':'자동 전투 중 · 카드를 알아서 고르고 진행한다'}</div><div class="row" style="gap:8px"><button class="btn${UI.paused?' primary':''}" style="flex:1" data-a="pause"><b>${UI.paused?'이어서 진행':'일시정지'}</b></button><button class="btn quiet" style="flex:1" data-a="fightmode" data-i="pick">직접 고르기로 바꾸기</button></div>`
        :`<button class="btn primary" data-a="go">${UI.sel.length?'행동 개시':'카드 없이 방어 자세'}</button><button class="btn quiet" data-a="fightmode" data-i="auto">자동 전투로 바꾸기</button>`}
      ${M?`${log}<details class="logbox"><summary>설정 (테마 · 연출 · 전투 진행)</summary><div class="stack" style="margin-top:10px">${vSettings()}</div></details>`:vSettings()}`;

  /* 하나 협회 패시브: 카드 위에서 매 라운드 한 가지를 고른다 */
  const TRI_E={gun:'공격 피해 +'+CFG.tri.gun,gon:'받는 피해 −'+CFG.tri.gon+'%',gam:'빛 +'+CFG.tri.gam,ri:'HP +'+CFG.tri.ri.heal+' · 호흡 +'+CFG.tri.ri.breath};
  function triBar(P){
    if(!E.triOk(C))return '';
    const used=C.triRound===C.round&&!PLAYING,off=PLAYING||FIGHT==='auto';
    return `<div class="triBar"><div class="small dim">하나 협회 · 이번 라운드 한 가지를 고른다 (같은 괘는 연속으로 못 고른다)${used?' · <b class="good">'+esc(CFG.tri.names[C.tri])+' 선택</b>':''}</div><div class="row" style="gap:6px">${Object.keys(CFG.tri.names).map(k=>`<button class="btn quiet${C.tri===k?' primary':''}" style="flex:1;padding:8px 4px" data-a="tri" data-i="${k}" ${off||C.triRound===C.round||C.triPrev===k?'disabled':''}><b>${esc(CFG.tri.names[k])}</b><br><span class="small">${C.triPrev===k&&C.triRound!==C.round?'직전에 고른 괘':esc(TRI_E[k])}</span></button>`).join('')}</div></div>`;
  }
  /* 엔딩: 진로별 최종 자리와 칭호, 사망이면 원인 */
  /* 내가 세운 날개가 있으면 소속 이름은 그 날개로 보인다 (승진해도 입사한 회사 이름으로 되돌아가지 않는다) */
  const affName=c=>c.aff?(c.corp&&c.corp.wing?c.corp.wing:c.aff.name):'';
  /* 보스를 쓰러뜨려 얻은 추가 칭호(피의 왈츠 등)는 직급 칭호와 따로 쌓인다 */
  const extraT=c=>(c.titles||[]).map(t=>' · '+esc(t)).join('');
  const careerLine=c=>careerLine0(c)+extraT(c);
  function careerLine0(c){
    if(c.job)return T.jobs[c.job]+(c.title?' · '+esc(c.title):'');
    if(c.aff&&c.corp&&c.corp.wing)return `${esc(c.corp.wing)} · 대표${c.title?' · '+esc(c.title):''}`;
    if(c.aff&&c.fr)return `${esc(affName(c))} · ${esc(c.fr.n)}${c.oracle?' · 신탁대행자':''}${c.title?' · '+esc(c.title):''}`;
    if(c.licensed)return E.rankLabel(c)+(c.aff?' · '+esc(affName(c)):'');

  function endLead(c,w){
    if(c.job)return w?'머리의 명령은 끝까지 집행되었다. 당신이 지나간 자리마다 도시는 조금 더 조용해졌다.':'집행자 하나가 돌아오지 않았다. 머리는 다음 이름을 부른다.';
    const k=E.career(c);
    if(!w)return c.title?'칭호는 남았지만, 그 이름을 부를 사람은 이제 없다.'
      :{fixer:'의뢰서 한 장이 주인 없이 사무소 책상에 남았다.',assoc:'협회 명부에서 이름 하나에 줄이 그어졌다.',wing:'담장 안의 자리는 다음 날 다른 사람으로 채워졌다.',finger:'조직은 빈자리를 오래 두지 않는다.'}[k]
      ||'이름을 부르는 사람은 없었다. 가로등만 계속 깜빡였다.';
    if(c.title)return {fixer:`도시는 이제 당신을 "${esc(c.title)}"(이)라고 부른다. 뒷골목 아이들이 그 색을 흉내 낸다.`,assoc:'본부의 결재 서류 맨 위에 당신의 도장이 찍힌다.',wing:'담장 가장 안쪽 문이 당신의 출입증으로 열린다.',finger:'조직의 누구도 당신 앞에서 고개를 들지 않는다.'}[k]||'도시는 당신의 이름을 기억한다.';
    return {fixer:'은퇴 서류에 마지막 급수를 적었다. 도시는 여전히 그 자리에 있다.',assoc:'협회 명부에 근속 기록이 길게 남았다.',wing:'날개의 둥지에서 마지막 출근을 마쳤다.',finger:'조직을 떠나지 않고 끝까지 버텼다. 그것만으로도 드문 일이다.'}[k]
      ||'도시는 여전히 그 자리에 있고, 당신은 한 해를 더 살 수 있다.';
  }
  /* 엔딩 덱: 종류별로 묶어 접을 수 있게, 카드 등급·장수를 함께 */
  function endDeck(c){
    const g=E.cardGrade(c.year,c),cnt={};c.deck.forEach(id=>cnt[id]=(cnt[id]||0)+1);
    const groups={};for(const id of Object.keys(cnt)){const k=cardKind(D.cards[id]);(groups[k]=groups[k]||[]).push(id)}
    return Object.keys(KIND).filter(k=>groups[k]).map(k=>`<details class="endgrp" open style="--kc:${KIND[k][1]}"><summary><span class="kb" style="--kc:${KIND[k][1]}">${KIND[k][0]}</span> <span class="mono small dim">${groups[k].reduce((a,id)=>a+cnt[id],0)}장</span></summary>
      <div class="chips">${groups[k].map(id=>{const x=D.cards[id];return `<span class="chip" style="border-color:color-mix(in srgb,${KIND[k][1]} 55%,var(--line2))">${esc(x.n)}${x.t==='atk'&&g.n?` <b style="color:var(--gold)">${g.n}</b>`:''}${cnt[id]>1?` <span class="dim">×${cnt[id]}</span>`:''}${isDebuff(x)?` <span style="color:${KIND.debuff[1]}">디버프</span>`:''}</span>`}).join('')}</div></details>`).join('')
      +`<div class="mono small dim">덱 ${c.deck.length}장${(c.side||[]).length?` · 카드함 ${c.side.length}장`:''}</div>`;
  }
  /* 육신 뒤틀림 상태로 맞은 엔딩: 전용 문구 */
  const distEyebrow=(w,tr,dt)=>!w&&dt&&dt.hunt?'사랑하던 이의 손에':tr?'뒤틀린 채 발톱과 조율자를 넘어섰다':w?`뒤틀린 채 ${CFG.years}년을 살아냈다`:'뒤틀림이 쓰러졌다';
  function distLead(c,w,tr,dt){

 그런데도 소매를 걷고 상처를 싸매 주며 말했다. 이게 일상이면 좋겠다고.","a":"손을 맡긴다","b":"손을 뺀다","at":"상처를 싸매는 손길이 믿기지 않게 조심스러웠다. 붕대 끝의 매듭이 작은 나비 모양이었다.","bt":"손을 뺐지만 {n}은 붕대를 다 감을 때까지 기다려 주었다. 이게 일상이면 좋겠다는 말이 다시 들렸다."},{"t":"1급의 의뢰","x":"{n}이 마지막 의뢰라며 서류를 내밀었다. 서명란에는 두 사람의 이름이 나란히 적혀 있다.","a":"함께 서명한다","b":"서류를 돌려준다","at":"두 이름이 나란히 적힌 서류를 {n}이 오래 쓰다듬었다. 마지막 의뢰가 마지막이 아니길 바라는 얼굴이었다.","bt":"서류를 돌려주자 {n}이 알겠다며 접어 넣었다. 접으면서 이 이름 옆자리는 비워 두겠다고 속삭였다."}],"propose":{"t":"칼을 내려놓고","x":"{n}이 칼을 내려놓고 당신 앞에 섰다. 1급 해결사가 이런 얼굴을 한 건 처음 본다."},"married":"파란 머리를 풀어 내린 해결사가 가족이 되었다. 칼은 벽에 걸렸다.","lost":"{n}의 마지막 의뢰서가 돌아왔다. 서명란 옆에는 부고만 적혀 있다.","left":"{n}의 의뢰서는 다른 도시로 향했다. 파란 머리는 더 이상 이 골목에서 보이지 않았다.","look":"파란 머리를 하나로 묶은 1급 해결사."},{"who":"1권속 혈귀 장로","meet":{"t":"오래된 의자","x":"라만차랜드의 가장 오래된 의자에 앉은 혈귀가 당신을 불렀다. 같은 피를 나눈 또 다른 1권속, 장로다. 수백 번의 밤을 지나온 눈이 당신을 본다."},"steps":[{"t":"장로의 다과","x":"{n}이 잔을 내밀었다. 피가 아니라 차였다. 오랜만에 누군가에게 차를 대접해 본다고 했다.","a":"차를 마신다","b":"잔을 밀어 둔다","at":"오랜만에 마시는 차가 이렇게 따뜻한 줄 몰랐다. {n}이 잔을 내려놓으며 고맙다고 했다.","bt":"잔을 밀어 두자 {n}이 아무 말 없이 따뜻한 물을 새로 따랐다."},{"t":"오래된 이야기","x":"{n}은 밤새 지난 시절의 이야기를 했다. 이름을 잃은 혈귀들, 사라진 의자들. 마지막에 {n}이 당신의 이름을 불렀다.","a":"끝까지 듣는다","b":"먼저 일어선다","at":"밤새 이야기를 들은 뒤 이름이 불리는 순간 심장이 한 번 크게 뛰었다. 오래전 의자들이 둘을 지켜보는 것 같았다.","bt":"먼저 일어섰지만 {n}이 문 앞까지 따라와 외투를 걸쳐 주었다. 외투에서 오래된 향 냄새가 났다."},{"t":"피의 약속","x":"1권속은 피로 약속을 맺는다. {n}이 손목을 내밀었다. 강요는 아니고, 그저 기다린다.","a":"약속을 받아들인다","b":"시간을 달라고 한다","at":"손목에 닿은 입술이 의외로 따뜻했다. 오랜 의자 하나가 비로소 채워지는 소리가 들렸다.","bt":"시간을 달라고 하자 {n}은 몇 백 년을 기다렸는데 몇 달쯤이야 하며 웃었다."}],"propose":{"t":"긴 밤의 끝","x":"{n}은 수백 번의 밤 끝에서 처음으로 망설이는 얼굴이 되었다. 대답이 필요하다."},"married":"오래된 의자 곁에 새 의자가 놓였다. 두 혈귀는 같은 밤을 오래도록 살았다.","lost":"{n}의 의자 위에 붉은 안개만 남았다. 오랜 밤이 끝났다.","left":"{n}은 오랜 잠을 택해 지하로 내려갔다. 붉은 안개만 한동안 골목에 남았다.","look":"수백 번의 밤을 지나온 눈을 가진 1권속 장로."}]},"east":{"variants":[{"who":"금발의 장신","meet":{"t":"철문 앞의 장신","x":"동부 외곽 철문 앞에 키가 큰 금발의 사람이 서 있다. 외곽에서 같이 자란 얼굴처럼 낯익다. 눈이 마주치자 먼저 웃었다."},"steps":[{"t":"외곽의 아침","x":"{n}이 아침마다 문 앞에 물을 길어다 놓는다. 이유는 묻지 않았고, 대답도 없었다.","a":"같이 길어 나른다","b":"모른 척한다 려 있다. 눈이 마주치자 해결사는 피곤하게 웃으며 먼저 인사를 건넸다."},"steps":[{"t":"같은 현장","x":"{n}과 같은 현장에 배치되었다. 일은 순식간에 끝났다. 장갑 낀 손으로 서류를 접으며 {n}이 말했다. 오래 하다 보면 몸이 먼저 안다고. 별일 아니라는 투였다.","a":"같이 돌아간다","b":"먼저 간다","at":"나란히 걷는 동안 {n}이 장갑 낀 손으로 서류를 건넸다. 닿지 않았지만 손등이 따뜻했다.","bt":"먼저 가면서 돌아봤더니 {n}이 장갑을 가볍게 들어 인사했다."},{"t":"젖은 머리","x":"비 오는 날 {n}이 우산도 없이 나타났다. 깔끔하게 빗어 넘긴 머리가 젖어 흘러내렸다. 조금 피곤하다고, 조금만 곁에 있어도 되겠냐고 물었다.","a":"우산을 내민다","b":"문을 닫는다","at":"젖은 머리를 닦아 주는 손이 서툴렀다. {n}이 눈을 감고 가만히 있어 주었다.","bt":"문을 닫았다가 다시 열자 {n}은 아직 거기에 서 있었다. 비를 맞으며 웃고 있었다."},{"t":"검은 장갑","x":"{n}이 장갑을 벗어 책상에 올려 두었다. 한 번도 벗는 걸 본 적 없는 장갑이다. 누군가의 유품이라고만 했다. 당신에게 처음으로 맨손을 보여 준 셈이다.","a":"그 손을 잡는다","b":"장갑을 돌려준다","at":"벗은 손은 생각보다 작고 따뜻했다. 유품이라던 장갑 위에 두 사람의 손이 포개졌다.","bt":"장갑을 돌려주자 {n}이 가슴에 안았다. 다음에는 장갑 없이 와도 되겠느냐고 물었다."}],"propose":{"t":"맨손","x":"{n}이 장갑 없이 당신 앞에 섰다. 2급 해결사가 이렇게 가벼운 얼굴을 한 건 처음 본다."},"married":"검은 정장이 옷장에 한 벌 더 걸렸다. 깔끔하게 빗어 넘기던 머리는 이제 아침마다 헝클어져 있다.","lost":"{n}의 장갑이 현관에 놓여 있었다. 돌아오지 않은 손이 아직 그 안에 있는 것 같았다.","left":"{n}은 다른 사무소의 일감과 함께 떠났다. 복도 끝에는 서류만 남았다.","look":"검은 정장에 넥타이를 맨, 처진 눈매의 2급 해결사. 늘 장갑을 끼고 있다."},{"who":"백발 장발의 특색 1급 해결사","lv":8,"meet":{"t":"백발의 해결사","x":"골목의 소음이 한순간 사라졌다. 흰 장발에 연파란 눈을 가진 해결사가 검은 터틀넥 차림으로 서 있다. 1급 중에서도 이름이 붙은, 특색을 가진 사람이다. 가녀려 보이는 어깨와 달리 걸음에 흔들림이 없다. 검은 가죽장갑을 낀 손이 당신을 가리켰다."},"steps":[{"t":"소리 없는 현장","x":"{n}과 같은 현장에서 아무 소리도 나지 않았다. 적이 쓰러지고서야 소음이 돌아왔다. {n}은 장갑을 고쳐 끼며 조용히 말했다. 시끄러운 건 질색이라고.","a":"조용히 곁에 선다","b":"먼저 자리를 뜬다","at":"아무 소리 없는 현장에서 곁에 선 것만으로 충분했다. {n}의 숨소리가 가까웠다.","bt":"먼저 자리를 떴지만 어깨 위로 시선이 느껴졌다. 따뜻한 시선이었다."},{"t":"검은 옷","x":"{n}은 늘 검은 옷을 입는다. 이유를 묻자 어디서든 지워지기 쉬워서라고 했다. 그런데 당신 앞에서는 지워지지 않으려는 얼굴이었다.","a":"이름을 묻는다","b":"묻지 않는다","at":"이름을 묻자 {n}이 한참 있다가 작게 대답했다. 아무도 부르지 않는 이름이라고 했다.","bt":"묻지 않자 {n}이 더 가까이 다가왔다. 지워지기 쉬운 사람이 오늘은 또렷했다."},{"t":"맑은 눈","x":"{n}이 처음으로 장갑 낀 손을 내밀었다. 무엇이든 꺼낼 수 있는 손이다. 이번에는 아무것도 꺼내지 않고 당신의 손만 쥐었다.","a":"손을 맞잡는다","b":"손을 거둔다","at":"아무것도 꺼내지 않은 손이 가장 따뜻했다. 맞잡은 손가락 사이로 {n}이 웃었다.","bt":"손을 거두자 {n}이 장갑을 다시 끼며 웃었다. 기다리는 것도 괜찮다고 했다."}],"propose":{"t":"고요","x":"{n}이 장갑을 벗지 않은 채로 당신의 손을 잡았다. 주위의 모든 소리가 가라앉고, 한 사람의 목소리만 남았다."},"married":"백발이 아침 햇살에 풀려 있다. 검은 옷만 입던 사람의 옷장에 색이 하나 생겼다.","lost":"{n}의 장갑이 식탁 위에 놓여 있었다. 집 안의 모든 소리를 삼키던 장갑이 처음으로 아무것도 삼키지 못했다.","left":"{n}의 자리는 조용히 비었다. 소리 하나 없이 떠나는 일에는 그 사람이 누구보다 익숙했다.","look":"백발 장발에 연파란 눈, 검은 터틀넥과 검은 가죽장갑의 특색 1급 해결사."}]},"kuro":{"who":"우산을 든 사람","meet":{"t":"피보라 속의 우산","x":"골목에 피보라가 내려앉던 날, 검은 우산 하나가 당신 머리 위로 기울었다. 우산 끝에서는 마르지 않는 빗물이 떨어진다. 흑운회 사람은 아닌 듯한데, 조직의 구역을 제집처럼 걷는다."},"steps":[{"t":"같은 우산 아래","x":"{n}이 우산 하나를 같이 쓰자고 했다. 돌아오는 길 내내 빗물 소리 말고는 아무 말도 없었다.","a":"우산 아래로 들어간다","b":"비를 맞고 간다","at":"빗물 소리만 들리는 길이 이렇게 포근할 줄 몰랐다. 우산 끝에서 떨어지는 물방울이 박자 같았다.","bt":"비를 맞으며 걷자 {n}이 우산을 기울여 따라왔다. 끝내 반쯤 젖은 채 나란히 걸었다."},{"t":"젖은 장부","x":"와카슈에게 넘길 장부가 비에 젖자 {n}이 우산 안쪽에 감싸 말려 주었다. 이유는 묻지 않았다.","a":"고맙다고 말한다","b":"아무 말도 하지 않는다","at":"고맙다는 말에 {n}이 우산을 한 번 털며 웃었다. 마른 장부가 가슴에 따뜻했다.","bt":"말없이 장부를 받아 들었다. {n}도 아무 말 없이 우산을 가볍게 흔들었다."},{"t":"구름이 걷히는 밤","x":"조직 일이 끝난 밤, {n}이 우산을 접었다. 하늘은 그날따라 개어 있었다. 우산 없이도 곁에 서 있는 사람은 처음이었다.","a":"곁에 선다","b":"먼저 걸음을 뗀다","at":"우산 없이 곁에 서는 일이 이렇게 가까운 일이었다. 구름 사이로 달이 둘을 비췄다.","bt":"먼저 걸음을 뗐지만 우산 소리가 바로 뒤에서 따라왔다. 거리는 한 걸음도 벌어지지 않았다."}],"propose":{"t":"우산을 접는 날","x":"{n}이 우산을 내밀었다. 손잡이에는 당신 이름이 새겨져 있다. 대답에 따라 이 길의 모양이 달라질 것이다."},"married":"검은 우산 하나가 둘의 것이 되었다. 흑운회의 구름 아래에서도 둘이 서는 자리는 마르게 남았다.","lost":"{n}의 우산이 구름 아래에 펼쳐진 채 남았다. 빗물은 한동안 마르지 않았다.","left":"{n}은 우산을 두고 떠났다. 손잡이에는 아직 당신 이름이 새겨져 있다.","look":"검은 우산을 늘 들고 다니고, 우산 끝에서 마르지 않는 빗물이 떨어진다."},"blade":{"who":"흉터투성이의 망명자","meet":{"t":"마당 한쪽의 칼 닦는 사람","x":"검계 마당 한쪽에서 혼자 칼을 닦는 사람이 있다. 얼굴에서 목, 소매 안쪽까지 칼자국이 겹겹이 나 있다. S사에서 도망쳐 온 사람이라고들 한다. 눈이 마주치자 칼날로 먼저 시선을 돌렸다."},"steps":[{"t":"본국의 말씨","x":"{n}이 처음으로 본국의 말씨로 혼잣말을 했다. 알아듣지 못했지만 뜻은 알 것 같았다.","a":"되묻지 않고 곁에 앉는다","b":"못 들은 척한다","at":"뜻은 몰라도 말투의 온기는 알 것 같았다. {n}이 말을 마치고 작게 웃었다.","bt":"못 들은 척했지만 칼 닦는 소리가 조금 부드러워졌다."},{"t":"흉터의 사연","x":"{n}이 소매를 걷자 흉터마다 사연이 있었다. 하나씩 손가락으로 짚으며 말해 주었지만, 가장 깊은 것만 건너뛰었다.","a":"깊은 흉터를 묻는다","b":"더 묻지 않는다","at":"{n}이 깊은 흉터를 짚으며 입술을 깨물다 이야기했다. 끝까지 들어 주자 눈가가 젖었다.","bt":"묻지 않자 {n}이 소매를 내렸다. 고맙다는 말이 눈빛으로 건너왔다."},{"t":"쫓아온 그림자","x":"S사의 추적자가 검계 근처까지 쫓아왔다는 소문이 돌았다. {n}이 밤새 칼을 쥔 채 문 앞에 앉아 있었다.","a":"함께 밤을 샌다","b":"먼저 들어가 잔다","at":"밤새 나란히 앉아 서로의 숨소리를 세었다. 새벽빛이 밝아 올 때 {n}이 어깨에 기댔다.","bt":"먼저 들어가 누웠지만 문 앞 칼 소리가 자장가처럼 들렸다. 그 밤은 이상하게 편하게 잤다."}],"propose":{"t":"칼을 내려놓는 날","x":"{n}이 칼을 처음으로 바닥에 내려놓고 당신 앞에 앉았다. 흉터 하나가 더 늘기 전에 할 말이 있다고 한다. 대답에 따라 이 길의 모양이 달라질 것이다."},"married":"흉터투성이의 망명자가 칼을 내려놓고 안으로 들어왔다. 본국의 밤은 더 이상 쫓아오지 않았다.","lost":"{n}의 칼이 마당 한쪽에 꽂혀 있었다. 칼집에는 오래 손때가 남아 있었다.","left":"{n}은 마당 한쪽에 칼집만 남기고 떠났다. 본국으로 돌아갔다고도, 더 멀리 갔다고도 한다.","look":"얼굴과 목, 소매 안쪽까지 칼자국과 수많은 흉터가 있다."},"awl":{"who":"야간 정찰을 도는 사람","meet":{"t":"골목 지붕 위의 그림자","x":"밤의 송곳 부대에서 야간 정찰을 도는 사람이 있다. 손끝에서 가는 송곳을 굴리며 지붕 위에서 아래를 내려다본다. 먼저 움직이는 법을 아는 사람이라 눈이 마주치자마자 웃었다."},"steps":[{"t":"선수를 나누는 법","x":"{n}이 지붕 위에서 신호를 보냈다. 먼저 움직이는 쪽이 이긴다는 말을 둘이 거의 동시에 꺼냈다.","a":"신호에 맞춰 움직인다","b":"신호를 무시한다","at":"신호와 발소리가 한 박자로 맞았다. 지붕 위에서 {n}이 엄지를 들어 보였다.","bt":"무시했는데도 {n}은 박자를 맞춰 따라왔다. 정말로 통하는 사이였다."},{"t":"손끝의 송곳","x":"{n}이 송곳을 손가락 사이로 돌리다 당신에게 던졌다. 받자 손잡이가 아직 따뜻했다.","a":"도로 던져 준다","b":"주머니에 넣는다","at":"던진 송곳이 {n}의 손에 정확히 꽂혔다. {n}이 웃음을 터뜨렸다.","bt":"주머니 속 송곳이 하루 종일 따뜻했다. 손잡이를 쥘 때마다 {n}이 떠올랐다."},{"t":"새벽의 귀환","x":"정찰에서 돌아온 {n}의 옷에 피가 묻어 있었다. 본인 피는 아니라고 했지만 손이 조금 떨렸다.","a":"붕대를 감아 준다","b":"물만 건넨다","at":"손이 떨리던 {n}이 붕대를 다 감을 때쯤 고요해졌다. 고맙다는 말이 숨결로 닿았다.","bt":"물만 건넸는데 {n}이 컵을 두 손으로 감싸 쥐었다. 컵 너머로 눈이 마주쳤다."}],"propose":{"t":"먼저 움직이는 쪽","x":"{n}이 오늘은 먼저 말을 걸었다. 선수를 뺏기기 싫은 사람이 오늘만큼은 당신의 대답을 기다린다. 대답에 따라 이 길의 모양이 달라질 것이다."},"married":"먼저 움직이던 사람이 처음으로 발을 멈췄다. 밤의 송곳 부대의 지붕 위에는 이제 두 사람이 앉는다.","lost":"{n}의 송곳이 지붕 위에 꽂혀 있었다. 돌려 줄 사람은 더 이상 없었다.","left":"{n}은 정찰을 나간 채 돌아오지 않았다. 지붕 위에는 송곳 하나만 남아 있다.","look":"손끝에서 가는 송곳을 굴리고, 걸음이 소리 없이 빠르다."},"thumb":{"who":"흰 장갑의 사람","meet":{"t":"만찬 끝의 흰 장갑","x":"엄지의 만찬 자리 끝에서 늘 접시를 먼저 치우는 사람이 있다. 흰 장갑을 한 번도 벗은 적이 없고, 윗사람에게 인사하는 각도가 흠잡을 데 없다. 눈이 마주치자 고개만 한 번 숙였다."},"steps":[{"t":"예의의 거리","x":"{n}이 카포 앞에서 끝까지 서 있었다. 만찬이 파한 뒤에야 의자에 앉았고, 앉은 채로 당신에게 물을 건넸다.","a":"같이 앉아 물을 받는다","b":"서열이 다르다며 사양한다","at":"서열을 잊은 채 마주 앉았다. 건넨 물이 달았다.","bt":"사양하자 {n}이 장갑 낀 손을 가슴에 얹고 고개를 숙였다. 예의 뒤의 마음이 보였다."},{"t":"하얀 차의 밤","x":"{n}이 하얀 차 문을 열어 주었다. 문이 닫힐 때까지 눈을 마주치지 않았다. 규칙은 규칙이고, 마음은 다른 문제라는 얼굴이었다.","a":"차에 오른다","b":"다음 차를 기다린다","at":"차 문이 닫히는 소리가 조용했다. 눈은 마주치지 않았지만 무릎이 가까웠다.","bt":"다음 차를 기다리는 동안 {n}이 우산을 들고 곁에 서 있었다."},{"t":"장갑을 벗는 날","x":"{n}이 처음으로 장갑을 벗고 악수를 청했다. 손바닥에 오래된 화약 자국이 남아 있었다. 예의 뒤에 숨긴 것이 무엇인지 보였다.","a":"맨손으로 손을 잡는다","b":"장갑 낀 악수로 돌려보낸다","at":"화약 자국 위로 맨손이 겹쳤다. {n}의 손은 떨고 있었다.","bt":"장갑 낀 악수에도 {n}은 환하게 웃었다. 맨손은 다음에 잡자고 했다."}],"propose":{"t":"서열 위의 약속","x":"{n}이 대부의 허락을 받지 않은 약속을 꺼냈다. 윗사람에게 복종하는 사람이 처음으로 규칙을 어긴 것이다. 대답에 따라 이 길의 모양이 달라질 것이다."},"married":"서열 위에 놓인 약속이 가족이 되었다. 대부는 보지 못한 척 잔을 들었다.","lost":"{n}의 부고에는 가장 높은 예의가 갖춰졌다. 흰 장갑 한 켤레가 관 위에 놓였다.","left":"{n}은 인사 한 번 남기고 만찬 자리를 떠났다. 흰 장갑 한 짝이 의자에 남아 있다.","look":"흰 장갑을 한 번도 벗지 않고, 윗사람 앞에서는 끝까지 서 있다."},"pointer":{"who":"봉투를 전하는 사람","meet":{"t":"문틈의 봉투","x":"지령 봉투를 문틈으로 넣고 가는 사람이 있다. 얼굴을 보여 준 적이 없는데, 봉투 접는 모양이 늘 같아 누구인지 안다. 어느 날 처음으로 봉투 없이 문을 두드렸다."},"steps":[{"t":"지령 없는 날","x":"{n}이 봉투 없이 찾아왔다. 이유는 묻지 말라고 했다. 지령이 없는 날 얼굴을 마주한 것은 처음이었다.","a":"들어오라고 한다","b":"문턱에서 돌려보낸다","at":"지령 없는 날의 {n}은 평소보다 훨씬 부드러웠다. 차를 마시는 소리만 방 안에 들렸다.","bt":"문턱에서 돌려보냈지만 문틈으로 쪽지가 하나 들어왔다. 내일 또 오겠다는 한 줄이었다."},{"t":"이유를 묻지 않는 사람","x":"{n}이 지령 한 장을 건네며 말했다. 이번에는 이유를 알려 줄 수 있다고. 검지에게는 있을 수 없는 일이었다.","a":"이유를 듣는다","b":"듣지 않겠다고 한다","at":"이유를 듣고 나니 지령이 한결 가벼워졌다. 비밀을 나눈다는 것이 이렇게 가까운 일이었다.","bt":"듣지 않겠다고 하자 {n}이 안도의 한숨을 쉬었다. 모르는 채로 곁에 있어도 된다고 했다."},{"t":"태우는 편지","x":"{n}이 봉투를 태웠다. 당신 이름이 적힌 지령이었다. 재가 되기 전에 마지막 줄이 보였다. 살려 두라고.","a":"재를 쓸어 담는다","b":"못 본 척한다","at":"재를 손수건에 싸서 품에 넣었다. 살려 두라는 마지막 줄이 가슴에 남았다.","bt":"못 본 척하자 {n}이 한쪽 눈을 감아 보였다. 둘만 아는 비밀이 하나 생겼다."}],"propose":{"t":"지령 바깥의 이름","x":"{n}이 처음으로 지령이 아니라 자기 말을 꺼냈다. 이름 하나, 그리고 이유 하나. 대답에 따라 이 길의 모양이 달라질 것이다."},"married":"지령에도 없는 이름이 서로의 것이 되었다. 봉투는 더 오지 않았다.","lost":"{n}의 마지막 지령은 당신에게 도착하지 않았다. 문틈에는 접히다 만 봉투 하나가 남아 있었다.","left":"{n}은 지령을 어기고 사라졌다. 문틈에는 이제 아무것도 들어오지 않는다.","look":"문틈 사이로 봉투를 밀어 넣는 손에 늘 같은 접는 선이 남아 있다."},"middle":{"who":"장부를 든 사람","meet":{"t":"장부 위의 이름","x":"장부 정리를 하다 보면 늘 같은 줄에서 손이 멈추는 사람이 있다. 빚을 대신 갚아 준 줄이다. 소매 끝에는 사슬 자국이 희미하게 남아 있다. 눈이 마주치자 장부를 덮고 웃었다."},"steps":[{"t":"대신 받은 빚","x":"{n}이 막내가 진 빚을 대신 받아 왔다. 맞은 자국이 얼굴에 남았는데도 장부에는 이자까지 정확히 적혀 있었다.","a":"약을 발라 준다","b":"장부만 확인한다","at":"약을 바르는 손끝이 조심스러웠다. {n}이 아프다고 하면서도 웃었다.","bt":"장부를 확인하는 사이 {n}이 옆에서 찜질을 직접 했다. 형제들이 보면 놀릴 얼굴이었다."},{"t":"형님들의 밥상","x":"형님들의 밥상에서 {n}이 당신 몫의 국을 먼저 떠 놓았다. 가족이 먼저라는 말을, 행동으로 보여 주는 사람이었다.","a":"밥상에 같이 앉는다","b":"내 몫은 알아서 먹겠다고 한다","at":"같은 상에서 국을 떠먹었다. 가족이라는 말이 처음으로 따뜻하게 들렸다.","bt":"알아서 먹겠다고 했는데 국그릇이 내 앞에 먼저 놓여 있었다."},{"t":"갚지 못한 줄","x":"{n}의 이름이 적힌 줄이 장부에 있다. 아직 갚지 못한 빚이다. {n}이 말했다. 중지는 받은 만큼 돌려주는 사람이라고.","a":"대신 갚겠다고 한다","b":"장부는 건드리지 않는다","at":"대신 갚겠다는 말에 {n}이 눈을 크게 떴다가 천천히 웃었다. 줄 하나가 따뜻하게 지워졌다.","bt":"장부를 건드리지 않자 {n}이 받은 만큼 돌려주는 사람이라며 가볍게 웃었다. 갚는 날이 기다려지는 빚이었다."}],"propose":{"t":"장부에 새기는 이름","x":"{n}이 장부의 맨 마지막 줄에 당신 이름과 자기 이름을 나란히 적었다. 이건 빚이 아니라 약속이라고 했다. 대답에 따라 이 길의 모양이 달라질 것이다."},"married":"장부 한 줄에 두 이름이 나란히 적혔다. 형님들은 그 줄만은 지우지 않았다.","lost":"{n}의 줄은 장부에서 지워지지 않았다. 갚지 못한 마지막 빚은 당신 몫이 되었다.","left":"{n}은 빚을 다 갚고 떠났다. 장부의 줄에는 줄이 그어져 있다.","look":"소매 끝에 사슬 자국이 희미하고, 장부를 늘 품에 안고 다닌다."},"ring":{"who":"물감 묻은 사람","meet":{"t":"캔버스 뒤의 사람","x":"화실마다 서로 경쟁하는 거리에서, 캔버스 뒤에 숨어 그림을 그리는 사람이 있다. 손톱 밑에 늘 물감이 끼어 있다. 당신의 작품을 한참 보더니 한 가지만 물었다. 그 총성은 몇 번째 붓질이냐고."},"steps":[{"t":"붓과 총","x":"{n}이 화실 구석에서 붓 대신 총을 닦고 있었다. 작품과 폭력을 분리하지 않는 사람이었다.","a":"같이 닦는다","b":"못 본 척한다","at":"총을 닦던 손이 붓을 쥘 때처럼 부드러웠다. 둘이 나란히 앉아 같은 쪽을 보았다.","bt":"못 본 척 지나쳤지만 {n}이 총신에 붓으로 작은 꽃을 그려 보여 주었다."},{"t":"경쟁하는 화실","x":"다른 화실이 당신의 작품을 모욕했다. {n}이 말없이 붓을 쥐고 그 화실 문에 한 줄을 그었다. 경쟁이 아니라 선전포고였다.","a":"같이 그린다","b":"말린다","at":"한 줄씩 번갈아 그린 선이 하나의 그림이 되었다. 선전포고가 사랑의 낙서가 되었다.","bt":"말리자 {n}이 붓을 내렸다. 대신 붓 끝에 물감을 찍어 내 코끝에 콕 찍었다."},{"t":"미완성의 전시","x":"{n}이 전시를 열었다. 중앙에는 빈 캔버스 하나. 작품명은 당신의 이름이었다. 아직 완성되지 않았다고 했다.","a":"캔버스에 붓을 얹는다","b":"완성은 나중에 하라고 한다","at":"빈 캔버스에 첫 획을 그었다. {n}이 뒤에서 팔을 겹쳐 붓을 같이 쥐었다.","bt":"완성은 나중에 하자고 하자 {n}이 약속이라며 캔버스 뒤에 날짜를 적었다."}],"propose":{"t":"마지막 한 점","x":"{n}이 마지막 한 점을 남겨 두었다. 이것만큼은 둘이 같이 그려야 한다고. 대답에 따라 이 길의 모양이 달라질 것이다."},"married":"마지막 한 점이 둘의 이름으로 완성되었다. 화실 사람들은 그 그림에 제목을 붙이지 못했다.","lost":"{n}의 마지막 작품은 미완성으로 남았다. 빈 곳은 당신이 채우지 못했다.","left":"{n}은 전시를 접고 떠났다. 벽에는 이름이 지워진 액자만 남았다.","look":"손톱 밑에 늘 물감이 끼어 있고, 총을 붓처럼 다룬다."},"rcorp":{"who":"같은 회수 대상","meet":{"t":"같은 회수 대상","x":"일을 마치고 돌아가는 길에 한 사람이 말을 걸었다. 이름도 내력도 묻지 않고, 대뜸 밥은 먹었느냐고만 물었다. 손목에 번호표를 뜯어낸 자국이 있었다. 같은 곳에서 나온 사람이다. 서로 그 말은 꺼내지 않았다."},"steps":[{"t":"같은 식탁","x":"{n}은 오늘도 이름을 묻지 않았다. 대신 국그릇을 하나 더 놓았다. 같은 얼굴이 열둘이던 방에서는 한 번도 받아 본 적 없는 대접이다. 이 사람도 R사의 회수 대상이라는 걸 서로 알고 있다.","a":"앉아서 먹는다","b":"밥은 됐다며 일어선다","at":"국그릇을 비웠다. 같은 곳에서 나온 사람과 밥을 먹는 일이 이렇게 조용할 줄은 몰랐다. {n}은 설거지를 하며 콧노래를 흥얼거렸다.","bt":"일어서자 {n}은 굳이 붙잡지 않았다. 문이 닫힌 뒤에도 식탁의 그릇은 하나 더 놓여 있었다."},{"t":"거울","x":"{n}이 작은 거울을 사 왔다. 부화장에는 거울이 없었다. 비친 얼굴을 한참 들여다보는 사이 {n}이 말했다. \"나도 내 얼굴이 하나인 줄 몰랐어. 지금은 하나야.\"","a":"거울을 본다","b":"거울을 엎어 둔다","at":"거울 속의 얼굴과 한참 눈을 맞췄다. 열두 개가 아니라 하나뿐인 얼굴이다. {n}이 곁에서 같이 거울을 보았다.","bt":"거울을 엎어 두었다. {n}은 아무 말 없이 거울을 다시 세우지 않았다. 대신 어깨에 담요를 걸쳐 주었다."},{"t":"서랍 속 번호표","x":"{n}의 서랍 속에도 지워진 번호표가 있었다. 우연히 본 것이 아니라 일부러 보여 준 것이다. 둘 다 아무 말도 하지 않고 서랍을 닫았다. 같은 장부에 적힌 이름 없는 두 개체다.","a":"사실을 털어놓는다","b":"서랍을 잠가 둔다","at":"털어놓았다. 부화장과 열두 개의 번호표와 지워진 숫자를. {n}은 한참 말이 없다가 같은 숫자가 지워진 자신의 번호표를 꺼내 놓았다.","bt":"서랍을 잠갔다. {n}도 서랍을 열지 않았다. 아직은 서로의 서랍이 열릴 때가 아니라는 것을 알고 있었다."}],"propose":{"t":"같은 장부의 두 사람","x":"{n}이 말했다. 번호도 이름도 필요 없다고. R사가 회수하러 오는 날까지, 아니 그 뒤에도 곁에 있어도 되겠느냐고. 본체인지 복제체인지는 한 번도 묻지 않은 사람이다."},"married":"같은 장부에 적혀 있던 두 사람이 한 지붕 아래 살게 되었다. 서랍 속 재는 더 이상 열어 볼 일이 없다.","lost":"{n}의 부고가 문틈으로 들어왔다. 같은 회수 대상이던 사람이 먼저 떠났다. 거울은 아직 벽에 걸려 있다.","left":"{n}은 어느 날부터 오지 않았다. 회수 대상이 하나 줄었는지 늘었는지는 알 수 없다. 식탁에는 그릇 하나가 더 놓인 채 식어 갔다.","look":"이름을 묻지 않고 밥부터 챙긴다. 손목에 번호표를 뜯어낸 자국이 있고, 작은 거울을 늘 가지고 다닌다."},"hcorp":{"who":"가문의 호위","meet":{"t":"그림자 호위","x":"독이 든 찻잔 일이 있고 얼마 뒤부터 방 앞에 한 사람이 서 있다. 가문이 붙인 호위라고 하지만, 후보도 아닌 사람을 지키라는 명령을 받았을 리 없다. 눈이 마주치면 고개만 숙이고 말이 없다."},"steps":[{"t":"문 앞의 밤샘","x":"{n}이 문 앞에서 밤새 서 있었다. 새벽에 보니 어깨에 이슬이 앉아 있다. 교대 시간이 지났는데도 자리를 뜨지 않았다.","a":"안으로 들인다","b":"교대를 보낸다","at":"문을 열어 안으로 들였다. {n}은 문턱에 한참 서 있다가 방 안쪽 의자 끝에 앉았다. 방이 이렇게 조용한 줄 처음 알았다.","bt":"교대자를 보냈다. 새벽까지 문 밖에서 칼 소리 하나 나지 않았다. 문 앞의 이슬은 여전히 마르지 않았다."},{"t":"대신 마신 찻잔","x":"{n}이 먼저 찻잔에 입을 댔다. 이번에는 독이 없었다. 다음에도 없으리라는 보장은 없다. 호위는 아무 일도 아니라는 얼굴이다.","a":"그러지 말라고 말한다","b":"아무 말도 하지 않는다","at":"다시는 그러지 말라고 말했다. {n}은 고개를 숙이고 대답하지 않았다. 다음 날에도 찻잔은 {n}이 먼저 들었다.","bt":"아무 말도 하지 않았다. {n}은 아무 일 아니라는 얼굴로 다음 찻잔을 들었다. 손끝이 아주 조금 떨렸다."},{"t":"문장 없는 칼","x":"{n}의 칼집에서 가문의 문장이 지워져 있다. 가문이 아니라 당신의 호위라는 뜻이다. 문장 자리에는 아무것도 새겨져 있지 않다.","a":"문장을 새로 새겨 준다","b":"모른 척한다","at":"문장 자리에 칼끝으로 이름을 새겼다. {n}은 한참을 내려다보다가 칼집을 가슴에 안았다. 가문의 문장보다 오래 남을 모양이었다.","bt":"모른 척했다. {n}은 칼집을 도로 허리에 찼다. 문장 없는 칼집은 오늘도 문 앞에 서 있었다."}],"propose":{"t":"그림자가 앞에 서다","x":"{n}이 처음으로 앞에 섰다. 호위는 언제나 뒤에 서는 사람인데. 가문의 서열도 후계의 자리도 상관없다고, 곁에 서도 되겠느냐고 물었다."},"married":"가문의 식탁 맨 끝자리에 두 사람이 나란히 앉게 되었다. 이 집에서 처음으로 서열을 따지지 않는 자리다.","lost":"{n}의 칼이 문 앞에 세워진 채 돌아오지 않았다. 호위가 끝내 서 있던 자리에는 이슬만 남았다.","left":"{n}은 어느 날부터 문 앞에 서지 않았다. 교대자도 오지 않았다. 문장 없는 칼집만 문 옆에 걸려 있다.","look":"말수가 적고 늘 한 걸음 뒤에 선다. 칼집의 문장이 지워져 있다."}},"meetYes":"인연을 맺는다","meetNo":"지나친다","meetYesT":"이름을 불러 보았다. 한 번도 불러 본 적 없는 이름처럼 낯설었다.","meetNoT":"고개를 돌렸다. 이 도시에서는 흔한 일이다.","stepA":"함께 시간을 보낸다","stepB":"일에 집중한다","stepAT":"시간은 천천히 흘렀고, 방은 덜 조용해졌다.","stepBT":"오늘은 일이 먼저였다. 그래도 {n}은 기다려 준다.","proposeYes":"마음을 전한다","proposeWait":"용기가 나지 않는다","proposeWaitOk":"이번에는 말하지 못했지만, 아직 때가 지나지 않았다.","proposeWaitFail":"망설이는 사이 기회가 한 번 지나갔다.","proposeOk":"{n}은 오래 숨을 고르다가 고개를 끄덕였다.","proposeNo":"{n}은 잠시 눈을 감았다가 천천히 고개를 저었다. 아직 때가 아니다.","deathT":"배우자의 죽음","deathA":"보낸다","deathAT":"오래 앉아 있었다. 이 도시에서 사람이 사라지는 일은 흔하지만, 이름은 쉽게 지워지지 않았다.","kidNames":["하늘","이슬","보람","다온","새롬","가온","나래","한결","온유","소담","해든","아름"],"kidBirth":{"t":"아이","x":"집에 새 소리가 늘었다. 이 도시에서 아이가 자란다는 것은 매일 조금씩 이기고 있다는 뜻이다.","a":"이름을 지어 준다","at":"아이가 처음 울던 밤, 도시는 평소보다 조금 조용했다. 이제 이름을 지어 줄 차례다."},"kidJobs":[{"k":"office","l":"사무소 직원","t":"자식의 진로","x":"{k}은 스무 살이 되었다. 어느 사무소의 문을 두드렸고, 첫 의뢰서에 이름을 적었다.","a":"지켜본다"},{"k":"fixer","l":"해결사","t":"자식의 진로","x":"{k}은 스무 살이 되었다. 해결사 면허를 받아 왔다. 어깨에 멘 가방은 당신이 쓰던 것과 닮아 있었다.","a":"지켜본다"},{"k":"assoc","l":"협회 소속","t":"자식의 진로","x":"{k}은 스무 살이 되었다. 협회의 제복을 입고 첫 인사를 하러 왔다. 소매 끝이 아직 조금 길었다.","a":"지켜본다"}],"kidAT":"{k}의 뒷모습이 골목 모퉁이를 돌아 사라질 때까지 보았다. 시간이 같이 흘렀다.","ending":{"forgotten":{"act1":"도시의 누구도 그것이 누구였는지 기억하지 못했다. 불순물에게 그랬듯 이름은 장부에서 지워졌다. 그래도 {k}은 항상 그리워했다. 해마다 그날이 오면 골목 끝에 나가 서 있었다.","act2":"위협의 등급이 오르는 동안 도시는 그 이름을 잊었다. 불순물에게 그랬듯 어느 장부에도 남지 않았다. 그래도 {k}은 항상 그리워했다. 아무도 부르지 않는 이름을 혼자 불렀다.","inf":"세월이 지나도 도시의 누구도 기억하지 못했다. 불순물에게 그랬듯 이름은 지워졌다. 그래도 {k}은 항상 그리워했다. 끝없이 이어지는 도시에서 그 기억만이 끝났다."},"death":{"act1":"쓰러진 소식은 사무소의 게시판에 하루 걸렸다 내려갔다. {k}은 남은 물건을 정리하고, 그 이름을 오래 입에 올렸다.","act2":"위협이 오르는 도시에서 당신의 이름은 곧 다른 이름 아래 묻혔다. {k}은 그 이름이 묻힌 자리를 오래 찾아다녔다.","inf":"끝없는 도시는 쓰러진 사람을 오래 기억하지 않는다. {k}은 그래도 해마다 당신이 쓰러진 날을 거르지 않았다."},"win":{"act1":"당신이 살아낸 해들은 {k}의 이야기가 되었다. 사람들은 {k}에게 그 이름의 뒷이야기를 묻곤 했다.","act2":"불순물을 넘어선 뒤에도 {k}은 당신의 곁에 있었다. 도시가 모르는 이름이어도, 가족은 알았다.","inf":"끝없는 시간을 함께 걸어 온 {k}에게, 당신은 가장 오래 곁에 있어 준 사람이었다.","old":"백 살이 넘은 당신 곁에서 {k}도 함께 늙었다. 이 도시에서 늙는다는 것은 누군가를 끝까지 지켜본다는 뜻이다."}},"hunt":{"intro":"토벌 의뢰서에는 뒤틀림의 위치와 의뢰인의 서명이 적혀 있다. 의뢰인은 {k}, {j}. 서명은 떨리지 않았다. {k}이 골목 끝에서 칼을 뽑았다.","jobs":{"office":"사무소 직원","fixer":"해결사","assoc":"협회 소속"},"win":"{k}이 쓰러졌다. 의뢰서는 바닥에 떨어졌고, 뒤틀림은 한참 그 자리에 서 있었다.","ending":{"act1":"토벌 의뢰서에는 {k}의 서명이 있었다. 도시의 누구도 그 뒤틀림이 누구였는지 기억하지 못했지만, {k}만은 칼끝이 닿던 순간 그것이 부르던 이름을 알아들었다.","act2":"위협의 등급이 오르는 도시에서 {k}은 토벌 의뢰를 끝까지 맡았다. 뒤틀림은 이름을 잃었고, {k}은 그 이름을 오래 놓지 못했다.","inf":"끝없는 도시에서 {k}은 토벌 의뢰를 끝냈다. 도시의 누구도 기억하지 못하는 이름을 {k}은 평생 그리워했다."},"introSpouse":"토벌 의뢰서에는 뒤틀림의 위치와 의뢰인의 서명이 적혀 있다. 의뢰인은 {k}, {j}. 가장 가까이 있던 사람의 서명이었다. {k}이 문 앞에서 숨을 고른다.","winSpouse":"{k}이 쓰러졌다. 의뢰서는 바닥에 떨어졌고, 뒤틀림은 그 곁에서 오래 움직이지 않았다."},"sweet":{"items":[{"t":"아침의 국물","x":"새벽에 눈을 뜨니 {n}이 먼저 일어나 국을 데우고 있다. 도시의 소음이 잠시 문 밖에 머문다.","a":"옆에 서서 파를 썬다","at":"{n}의 옆에 서서 파를 썰었다. 칼 소리가 규칙적으로 이어졌다. 오늘 국은 평소보다 조금 짰고, 둘 다 말하지 않았다.","b":"국물을 먼저 맛본다","bt":"한 숟가락 떠 마셨다. {n}이 맛이 어떠냐고 묻기도 전에 웃음이 먼저 나왔다."},{"t":"같은 우산","x":"갑작스러운 비가 골목을 적신다. 우산은 하나뿐이다.","a":"어깨를 붙이고 걷는다","at":"한쪽 어깨가 젖었지만 어느 쪽도 우산을 더 기울이지 않았다. 집에 닿을 때까지 걸음이 같았다.","b":"우산을 {n} 쪽으로 기울인다","bt":"우산을 기울이자 {n}이 다시 반대로 밀어 넣었다. 둘 다 웃으며 어깨를 붙였다."},{"t":"창가의 오후","x":"할 일이 끝난 오후, {n}이 창가에서 졸고 있다. 햇살이 천천히 방 안쪽으로 밀려 들어온다.","a":"담요를 덮어 준다","at":"담요를 덮자 {n}이 눈을 감은 채 손을 잡았다. 그 손이 놓이지 않아서 한참 그대로 앉아 있었다.","b":"옆에 앉아 지켜본다","bt":"{n}이 숨 쉬는 소리를 한참 들었다. 오늘 일은 내일 해도 괜찮을 것 같았다."},{"t":"하찮은 내기","x":"{n}이 오늘 저녁 반찬을 걸고 내기를 하자고 한다. 내기의 이유는 하찮고, 둘 다 진지하다.","a":"받아들인다","at":"결과가 어땠는지는 둘 다 끝까지 말하지 않았다. 반찬은 두 사람이 나눠 먹었다.","b":"져 주는 척한다","bt":"져 주려는 것을 {n}이 먼저 알아챘다. 결국 반찬은 둘이 나눠 먹었다."},{"t":"오래된 노래","x":"어디선가 흘러나온 노래를 {n}이 따라 흥얼거린다. 가사는 모두 틀렸다.","a":"같이 따라 부른다","at":"틀린 가사를 맞춰 가며 불렀다. 마지막 소절에서 둘이 동시에 틀렸고, 한참을 웃었다.","b":"가만히 듣는다","bt":"틀린 가사가 오히려 좋았다. 한 곡이 끝나도 아무도 자리를 뜨지 않았다."},{"t":"현관의 불빛","x":"늦게 돌아온 밤, 현관에 불이 켜져 있다. {n}이 의자에 앉아 졸다가 인기척에 눈을 뜬다.","a":"다녀왔다고 말한다","at":"{n}이 다녀왔냐고 대답했다. 그뿐인데도 하루의 피로가 한꺼번에 내려앉았다.","b":"{n}의 어깨를 두드린다","bt":"어깨를 두드리자 {n}이 눈을 비비며 웃었다. 불은 한참 더 켜져 있었다."},{"t":"작은 선물","x":"{n}이 주머니에서 무언가를 꺼낸다. 값은 얼마 하지 않을 것이다. 이름 모를 시장에서 오래 골랐다는 것은 알 수 있다.","a":"받아서 주머니에 넣는다","at":"손에 쥐어 보니 따뜻했다. 오래 가지고 다닐 것 같다고 생각했다.","b":"{n}에게 같은 것을 하나 더 고른다","bt":"다음 날 같은 것을 하나 더 사 왔다. {n}이 말없이 하나를 되돌려주었다. 둘 다 같은 것을 갖게 되었다."},{"t":"밤 산책","x":"잠이 오지 않는 밤, {n}이 밖에 나가자고 한다. 도시는 낮보다 조용하다.","a":"나란히 걷는다","at":"가로등 몇 개를 지나는 동안 말이 없었다. 말이 필요하지 않다는 것을 둘 다 알았다.","b":"손을 잡는다","bt":"손을 잡자 {n}이 걸음을 늦췄다. 길이 평소보다 조금 길게 느껴졌다."},{"t":"서로의 습관","x":"{n}이 당신의 오래된 습관을 따라 한다. 정작 본인은 모르고 있다.","a":"모른 척한다","at":"모른 척하며 {n}의 습관도 따라 해 보았다. 이 집에는 같은 버릇이 둘이 되었다.","b":"먼저 말해 준다","bt":"말해 주자 {n}이 한참 웃다가 얼굴을 붉혔다. 그 습관은 그대로 남았다."},{"t":"부엌의 불빛","x":"저녁 준비를 하던 {n}이 갑자기 손을 멈춘다. 이유 없이 당신 쪽을 바라본다.","a":"같이 바라본다","at":"한동안 둘 다 아무 말도 하지 않았다. 냄비 끓는 소리만 방 안에 남았다.","b":"이름을 불러 본다","bt":"이름을 부르자 {n}이 대답 대신 웃었다. 냄비가 넘치기 직전에야 둘 다 정신이 들었다."},{"route":"office","t":"접힌 우산","x":"젖은 우산을 접는 {n}의 손이 오늘도 조심스럽다. 우산 끝에서 떨어진 물방울이 현관 바닥에 작은 원을 그린다.","a":"마른 수건을 건넨다","at":"수건을 받은 {n}이 우산 손잡이부터 먼저 닦았다. 그러고 나서야 자기 소매를 닦았다.","b":"같이 우산을 말린다","bt":"나란히 우산을 펴서 말렸다. 두 우산이 같은 방향으로 기울어 있다."},{"route":"office","t":"소매 끝","x":"{n}의 외투 소매 끝이 또 닳아 있다. 본인은 모르는 척하지만 자꾸 그쪽으로 손이 간다.","a":"바늘과 실을 꺼낸다","at":"소매 끝을 꿰매는 동안 {n}이 숨을 죽이고 지켜보았다. 마지막 매듭을 짓자 작게 고맙다고 했다.","b":"새 외투를 슬쩍 걸어 둔다","bt":"다음 날 걸려 있는 외투를 보고 {n}이 한참을 말없이 서 있었다. 그러더니 조심스럽게 소매에 팔을 끼웠다."},{"route":"assoc","t":"보고서 귀퉁이","x":"{n}이 마감을 앞둔 보고서 귀퉁이에 작은 글씨를 적어 두었다. 다음 장으로 넘기려다 그 글자가 눈에 들어온다.","a":"소리 내어 읽는다","at":"읽어 주자 {n}이 단정하게 묶은 머리를 만지며 눈을 피했다. 귀퉁이의 글씨는 오늘도 한 줄 더 늘었다.","b":"같은 자리에 답을 적는다","bt":"답을 적어 두자 {n}이 그것을 보고 조용히 웃었다. 협회의 서류에는 이제 두 사람의 글씨가 섞여 있다."},{"route":"assoc","t":"여민 깃","x":"{n}이 제복 깃을 끝까지 여민 채 문을 나서려 한다. 오늘따라 그 깃이 조금 비뚤다.","a":"깃을 바로잡아 준다","at":"손끝이 깃을 스치자 {n}의 어깨가 잠시 굳었다가 천천히 풀렸다. 단정한 사람이 가끔 보여 주는 순간이다.","b":"깃을 그대로 둔다","bt":"비뚤어진 깃을 그대로 둔 채 배웅했다. 문 앞에서 {n}이 한 번 돌아보고 스스로 깃을 매만졌다."},{"route":"wing","t":"식은 차","x":"연구 노트를 붙잡고 있는 {n}의 옆에 차가 놓여 있다. 이미 식었다. 눈 밑이 평소보다 어둡다.","a":"새 차를 내려놓는다","at":"따뜻한 차를 놓자 {n}이 안경을 올리고 한 모금 마셨다. 오랜만에 숨이 길어진 것 같다.","b":"노트를 덮어 준다","bt":"노트를 덮자 {n}이 반사적으로 손을 뻗다가 멈추었다. 오늘은 여기까지라고 둘 다 알고 있었다."},{"route":"wing","t":"잉크 자국","x":"{n}의 흰 가운 소매에 번진 잉크 자국이 또 늘었다. 지우려 해도 이미 오래된 자국이다.","a":"손수건으로 닦아 준다","at":"닦아도 지워지지 않았지만 {n}은 그냥 웃었다. 이 자국이 하루의 증거라고 했다.","b":"같은 자리에 잉크를 묻힌다","bt":"일부러 소매에 잉크를 묻히자 {n}이 한숨을 쉬었다. 그리고 그 옆에 자신의 자국을 하나 더 찍었다."},{"route":"finger","t":"한쪽 장갑","x":"{n}이 오늘도 검은 장갑을 한쪽만 끼고 있다. 맨손이 드러난 쪽에 오래된 흉터가 보인다.","a":"맨손을 먼저 잡는다","at":"맨손을 잡자 {n}의 굳은 손가락이 천천히 풀렸다. 장갑 낀 쪽은 주머니에 넣어 두었다.","b":"남은 한쪽 장갑을 빌려 낀다","bt":"장갑 한 짝을 나눠 끼고 나란히 걸었다. 둘 사이에 한 켤레가 완성되었다."},{"route":"finger","t":"흉터의 내력","x":"{n}이 손등의 흉터를 무심히 문지른다. 언제 어디서 생겼는지 한 번도 말하지 않았다.","a":"그냥 곁에 앉는다","at":"묻지 않고 곁에 앉아 있었다. {n}이 한참 뒤에 흉터에 대해 한 줄을 말했다. 그뿐이었다.","b":"같은 곳을 살짝 짚는다","bt":"손끝으로 흉터를 짚자 {n}이 눈을 감았다. 오래된 상처는 이제 아프지 않다고 했다."},{"route":"hyeolgwi","t":"머리끈","x":"{n}이 파란 머리를 하나로 묶으려다 끈을 놓쳤다. 끈이 바닥을 굴러 당신 발치에 닿는다.","a":"묶어 준다","at":"단단하게 묶어 주자 {n}이 거울을 보다 고개를 끄덕였다. 파란 머리가 햇빛에 한 번 흔들렸다.","b":"끈을 쥔 채 놀린다","bt":"끈을 높이 들자 {n}이 눈살을 찌푸리면서도 입가는 올라갔다. 잡으려는 손과 피하는 손이 한참 이어졌다."},{"route":"hyeolgwi","t":"의뢰를 마친 밤","x":"1급 해결사로서 하루를 마친 {n}이 문을 닫자마자 의자에 주저앉는다. 어깨의 긴장이 한꺼번에 풀리는 소리가 들린다.","a":"어깨를 주물러 준다","at":"어깨가 풀리는 동안 {n}은 오늘 의뢰의 이야기를 한 마디도 꺼내지 않았다. 그게 이 집의 규칙이다.","b":"말없이 국을 내민다","bt":"{n}이 국을 받아 한 숟가락 뜨고 눈을 감았다. 오늘의 의뢰는 여기서 끝났다."},{"route":"east","t":"높은 선반","x":"가장 높은 선반의 그릇을 꺼내려는 {n}이 여유롭게 팔을 뻗는다. 키가 큰 사람에게는 모든 것이 손닿는 곳이다.","a":"발끝을 들고 흉내 낸다","at":"발끝을 세워 흉내를 내자 {n}이 웃음을 참지 못했다. 그릇은 {n}이 대신 내려 주었다.","b":"필요한 것을 말해 본다","bt":"필요한 것을 말하자 {n}이 한 번에 꺼내 주었다. 당신이 닿지 못하는 곳은 이 집에 없다."},{"route":"east","t":"같은 눈높이","x":"{n}이 소파에 앉아 책을 읽다가 문득 고개를 든다. 서 있는 당신과 앉은 {n}의 눈높이가 오늘만 같다.","a":"옆에 앉는다","at":"옆에 앉자 {n}이 책을 덮고 어깨를 기울였다. 한 페이지도 읽지 못한 채 시간이 흘렀다.","b":"책을 빼앗아 덮는다","bt":"책을 덮자 {n}이 항의하는 척하다 웃고 말았다. 어느 쪽 이야기가 더 재미있을지는 알 수 없다."},{"route":"highfixer","t":"넥타이","x":"{n}이 현관에서 넥타이를 매다가 한숨을 쉰다. 처진 눈매가 오늘따라 조금 더 졸려 보인다.","a":"매 준다","at":"매듭을 맞추는 동안 {n}이 눈을 감고 서 있었다. 장갑 낀 손이 가볍게 어깨를 잡았다.","b":"다녀오라 말한다","bt":"다녀오라고 하자 {n}이 눈을 뜨고 잠깐 웃었다. 피곤함이 반쯤 걷힌 얼굴이었다."},{"route":"highfixer","t":"장갑 한 짝","x":"늘 장갑을 끼고 있는 {n}이 오늘은 한 짝을 식탁에 벗어 두었다. 벗은 손이 낯설게 가볍다.","a":"장갑을 대신 보관한다","at":"장갑을 소중히 쥐고 있으니 {n}이 조금 쑥스러워했다. 자리를 비운 장갑이 식탁 위에서 온기를 남겼다.","b":"맨손에 손을 겹친다","bt":"손을 겹치자 {n}이 처진 눈매를 풀었다. 이 사람에게도 장갑 없이 쉬는 시간이 있다."},{"route":"kuro","t":"마르지 않는 우산","x":"{n}의 검은 우산 끝에서 오늘도 마르지 않는 빗물이 떨어진다. 현관에 둔 우산 아래에 작은 웅덩이가 생겼다.","a":"웅덩이를 닦아 준다","at":"닦아도 우산은 금방 새로운 물방울을 떨어뜨렸다. 그 모습을 보던 {n}이 처음으로 소리 내어 웃었다.","b":"우산 아래에 들어선다","bt":"우산 아래에서 어깨를 붙이자 {n}이 걸음을 맞췄다. 이 비는 이상하게 따뜻했다."},{"route":"kuro","t":"우산 끝의 물방울","x":"{n}이 우산을 접어 현관에 세워 두고 소매에서 빗물 자국을 턴다. 방 안에서만 비가 그친 것 같다.","a":"수건을 건넨다","at":"수건을 받은 {n}이 소매부터 닦았다. 마르지 않는 비도 이 집에서는 잠시 쉬어 간다.","b":"차를 데운다","bt":"따뜻한 차를 앞에 두고 {n}이 조용히 앉았다. 우산 끝에서 물방울이 한 번 더 떨어졌다."},{"route":"blade","t":"흉터 위의 약","x":"{n}의 소매 안쪽에서 흉터 하나가 붉게 올라와 있다. 오래된 상처가 가끔 이렇게 존재를 알린다.","a":"약을 발라 준다","at":"약을 바르는 동안 {n}이 가만히 팔을 내밀었다. 망명자에게는 누군가에게 팔을 맡기는 일이 아직 낯선 일이다.","b":"흉터 하나를 세어 본다","bt":"흉터를 하나씩 세다 {n}이 그만하라고 하면서도 팔은 빼지 않았다. 이름 없는 상처에 이 집에서만 이름이 붙었다."},{"route":"blade","t":"처음 맞는 평온","x":"{n}이 칼을 풀어 벽에 걸어 두고 의자에 앉는다. 이 집에서는 칼을 풀어도 된다는 것을 아직 신기해하는 얼굴이다.","a":"칼 옆에 외투를 걸어 둔다","at":"칼 옆에 나란히 걸린 외투를 보고 {n}이 한참 말이 없었다. 벽에 걸린 것이 이제 둘이다.","b":"따뜻한 물을 내민다","bt":"컵을 감싼 {n}의 손에서 힘이 빠졌다. 칼자국투성이 손도 따뜻한 것을 쥐면 부드러워진다."},{"route":"awl","t":"소리 없는 귀가","x":"야간 정찰을 마친 {n}이 아무 소리도 없이 문을 열고 들어온다. 인기척을 알아챈 순간 이미 방 안에 서 있다.","a":"알고 있었다는 듯 불을 켠다","at":"불을 켜자 {n}이 놀란 표정을 지었다. 소리 없이 다니는 사람을 알아보는 사람은 이 도시에 한 명뿐이다.","b":"일부러 놀란 척한다","bt":"놀란 척하자 {n}이 입가를 올렸다. 잡을 수 없는 사람이 이 집에서는 가끔 장난을 친다."},{"route":"awl","t":"굴러가는 송곳","x":"{n}이 손끝에서 가는 송곳을 굴리며 앉아 있다. 말을 걸어도 시선은 송곳에 있지만 한쪽 귀는 분명히 당신에게 열려 있다.","a":"송곳 돌리는 법을 묻는다","at":"방법을 가르쳐 주는 {n}의 손길이 평소보다 느렸다. 송곳은 한참 만에 당신 손끝에서 한 바퀴 굴렀다.","b":"송곳을 가만히 받아 든다","bt":"송곳을 받아 들자 {n}의 손이 허공에서 잠깐 멈추었다. 빈 손이 조용히 당신 손 위에 놓였다."},{"route":"thumb","t":"앉으라는 권유","x":"윗사람 앞에서는 끝까지 서 있는 {n}이 이 집에서도 문 앞에서 한동안 서 있다. 의자는 바로 옆에 있다.","a":"의자를 당겨 준다","at":"의자를 당기자 {n}이 흰 장갑을 한 번 만지고 천천히 앉았다. 이 집에서는 서 있지 않아도 된다는 것을 한 번 더 배웠다.","b":"옆에 나란히 선다","bt":"옆에 서 있자 {n}이 조금 놀라다가 곧 어깨를 나란히 했다. 서 있는 시간이 길어도 둘이라면 괜찮았다."},{"route":"thumb","t":"흰 장갑 한 올","x":"{n}의 흰 장갑 손끝에 실밥이 한 올 풀려 있다. 한 번도 벗지 않은 장갑이라 본인도 모르는 것 같다.","a":"실밥을 정리해 준다","at":"실밥을 조심스레 가위로 잘라 내자 {n}이 숨을 죽였다. 장갑은 다시 새것처럼 반듯해졌다.","b":"장갑 위에 손을 얹는다","bt":"장갑 위에 손을 얹자 {n}이 눈을 감았다. 흰 천 너머로도 온기는 전해졌다."},{"route":"pointer","t":"봉투 한 장","x":"현관 문틈으로 봉투가 한 장 밀려 들어와 있다. 늘 같은 접는 선이 남아 있는 것을 보니 {n}의 것이다. 안에는 짧은 한 줄이 들어 있다.","a":"답장을 써서 문틈에 밀어 넣는다","at":"답장을 밀어 넣자 문 너머에서 {n}이 낮게 웃는 소리가 났다. 같은 집 안에서 주고받는 편지는 이상하게 특별하다.","b":"봉투를 가슴에 넣어 둔다","bt":"봉투를 품에 넣자 {n}이 못 본 척하며 차를 따랐다. 한 줄의 글은 하루 종일 따뜻했다."},{"route":"pointer","t":"접는 선","x":"{n}이 종이를 반으로 접는 손놀림은 언제나 같다. 접는 선이 이 집의 모든 서랍 안에 남아 있다.","a":"같이 접어 본다","at":"{n}에게서 배운 대로 접어 보니 선이 어긋났다. {n}이 말없이 바로잡아 주었다.","b":"접은 종이를 펼쳐 본다","bt":"펼쳐 보니 안에는 아무 글도 없이 작은 그림 하나가 있었다. 오늘은 말이 필요 없는 날이다."},{"route":"middle","t":"장부의 빈 줄","x":"{n}이 품에 안은 장부의 한쪽 끝에 빈 줄이 하나 남아 있다. 빚도 이름도 적히지 않은 줄이다.","a":"오늘의 일을 한 줄 적는다","at":"오늘 있었던 일을 적자 {n}이 그 줄을 오래 바라보았다. 갚을 것이 아니라 간직할 것이 장부에 처음 적혔다.","b":"빈 줄을 그대로 남겨 둔다","bt":"빈 줄을 남겨 두자 {n}이 장부를 덮고 가슴에 안았다. 비어 있는 줄이 오히려 든든했다."},{"route":"middle","t":"사슬 자국","x":"{n}의 소매 끝에 희미한 사슬 자국이 보인다. 오늘은 그 위에 따뜻한 손자국이 겹쳐 있다.","a":"자국을 손으로 덮는다","at":"자국 위에 손을 얹자 {n}이 고개를 숙였다. 사슬도 장부도 이 순간만큼은 무겁지 않았다.","b":"소매를 걷어 올려 준다","bt":"소매를 걷자 자국이 선명하게 드러났다. {n}이 잠시 움찔하다 곧 그대로 두었다."},{"route":"ring","t":"손톱 밑 물감","x":"{n}의 손톱 밑에 오늘도 물감이 끼어 있다. 씻어도 지워지지 않는 색이 이 집 곳곳에 번져 있다.","a":"같은 색을 손끝에 묻힌다","at":"손끝에 물감을 묻히자 {n}이 눈을 크게 떴다. 이 집에는 이제 같은 색의 지문이 둘이다.","b":"붓을 대신 건넨다","bt":"붓을 건네자 {n}이 한참 바라보다 받았다. 총보다 붓이 더 어울리는 손이다."},{"route":"ring","t":"벽의 그림","x":"{n}이 벽 한쪽에 몰래 작은 그림 하나를 그려 두었다. 어디에도 서명이 없지만 누구의 것인지는 분명하다.","a":"그림 옆에 한 줄 덧붙인다","at":"한 줄을 덧붙이자 {n}이 그림 앞에 한참 서 있었다. 그림은 이제 둘이 완성한 것이 되었다.","b":"모른 척 오래 바라본다","bt":"오래 바라보는 것이 가장 큰 칭찬인 것을 {n}은 알고 있었다. 입가가 슬며시 올라갔다."}],"old":["해가 쌓여도 이 시간은 달라지지 않는다.","도시는 변해도 이 자리는 그대로다.","긴 시간을 함께 지나온 사이라 말이 짧아도 충분하다."]},"escort":{"kinds":{"fighter":{"tag":"협공","t":"외곽 동행 의뢰 · 나란히","x":"{n}이 외곽 의뢰서를 들고 왔다. 의뢰서 한쪽에 두 사람의 이름이 나란히 적혀 있다. \"이번에는 같이 가죠.\"","a":"함께 나선다","h":"동행 의뢰 · 협공 (매 라운드 {n}의 고정 피해) · 이기면 보수","at":"두 사람이 외곽의 경계를 넘었다. 등 뒤에서 칼 뽑는 소리가 같은 박자로 울렸다.","b":"이번에는 혼자 다녀온다","bt":"{n}이 고개를 끄덕였다. 문 앞의 불은 밤새 꺼지지 않았다."},"support":{"tag":"지원","t":"외곽 동행 의뢰 · 뒤에서","x":"{n}이 외곽 의뢰서 옆에 작은 가방을 챙겨 두었다. 싸움에는 서툴지만, 뒤에서 할 수 있는 일은 많다고 한다.","a":"가방을 들고 함께 간다","h":"동행 의뢰 · 지원 (매 라운드 보호막 · HP 회복) · 이기면 보수","at":"가방에서 붕대와 차가 차례로 나왔다. 외곽의 밤은 평소보다 덜 차가웠다.","b":"이번에는 혼자 다녀온다","bt":"{n}이 가방을 다시 정리해 두었다. 돌아올 때까지 불을 켜 두겠다고 했다."},"guard":{"tag":"수비","t":"외곽 동행 의뢰 · 앞에 서서","x":"{n}이 말없이 의뢰서에 서명하고 문 쪽에 먼저 섰다. 등을 맡기는 일도, 앞을 맡는 일도 이 사람에게는 같은 일이다.","a":"뒤를 맡기고 함께 간다","h":"동행 의뢰 · 수비 (매 라운드 첫 피격을 막아서고 반격) · 이기면 보수","at":"{n}이 반 걸음 앞에서 걸었다. 외곽의 어둠이 닿기 전에 그 어깨가 먼저 닿았다.","b":"이번에는 혼자 다녀온다","bt":"{n}이 문 앞에서 한동안 서 있었다. 돌아올 때까지 그 자리를 떠나지 않았다."}}},"stepATs":[["처음으로 {n}과 나란히 앉아 아무 말 없이 시간을 보냈다. 어색함이 먼저 가시고 편안함이 뒤따랐다.","{n}이 가져온 이야기를 끝까지 들었다. 별것 아닌 이야기가 오래 남았다.","같이 걷다 보니 어느새 해가 기울었다. 헤어질 때 다음 약속이 먼저 나왔다."],["{n}과 거리가 한 뼘 가까워졌다. 둘 다 모른 척했다.","함께 보낸 시간이 쌓여 이야기가 길어졌다. 이제는 말하지 않아도 되는 부분이 생겼다.","{n}이 웃는 얼굴을 처음 보았다. 그 뒤로 그 웃음이 자꾸 떠올랐다."],["{n}과 이른 아침까지 이야기를 나눴다. 날이 밝아 오는 것을 둘 다 아쉬워했다.","서로의 오래된 상처 이야기를 처음으로 꺼냈다. {n}은 고개를 끄덕이며 끝까지 들었다.","{n} 곁에 앉으니 도시의 소음이 한 겹 멀어졌다."]],"stepBTs":[["오늘은 일이 먼저였다. {n}은 아무 말 없이 기다려 주었다.","일을 마치고 돌아보니 {n}은 이미 떠난 뒤였다. 쪽지 한 장이 남아 있었다.","바쁜 하루가 끝나고서야 {n}이 생각났다. 내일은 먼저 말을 걸어야겠다."],["일이 급했다. {n}은 이해한다는 표정이었지만 눈은 잠깐 흔들렸다.","약속을 미루었다. {n}이 괜찮다고 말했지만 괜찮지 않은 목소리였다.","일에 집중하는 동안 {n}의 빈자리가 새삼 크게 느껴졌다."],["이번에도 일이 먼저였다. {n}은 말없이 문을 닫고 나갔다. 다음에는 붙잡아야 할지도 모른다.","마음은 이미 정해졌는데 입이 떨어지지 않았다. {n}은 기다리는 듯, 포기하는 듯 서 있었다.","일은 끝났지만 한 걸음이 모자랐다. {n}의 발소리가 멀어졌다."]]},"dailyLife":[{"t":"골목 산책","x":"할 일이 없는 오후, 골목을 천천히 걷는다. 도시는 오늘따라 조용하다.","o":[{"l":"몸을 푼다","h":"최대 HP +3","t":"숨이 트였다.","fx":{"maxHp":3}},{"l":"주변을 살핀다","h":"사건 판정 +1","t":"눈에 익은 길이 달리 보였다.","fx":{"check":1}},{"l":"걸음을 재촉한다","h":"속도 +1","t":"발이 가벼워졌다.","fx":{"spd":1}}]},{"t":"낡은 연습장","x":"방치된 연습장에 낡은 도구가 쌓여 있다. 먼지를 털고 한참 시간을 보낸다.","o":[{"l":"휘둘러 본다","h":"공격 +1","t":"손에 감이 붙었다.","fx":{"atk":1}},{"l":"피하는 연습을 한다","h":"회피 +1","t":"몸이 먼저 반응하기 시작했다.","fx":{"eva":1}},{"l":"호흡을 가다듬는다","h":"최대 HP +3","t":"숨이 길어졌다.","fx":{"maxHp":3}}]},{"t":"시장의 소문","x":"시장 골목에서 소문이 오간다. 쓸모 있는 것과 없는 것이 뒤섞여 있다.","o":[{"l":"귀를 기울인다","h":"사건 판정 +1","t":"한 줄의 소문이 도움이 될 것 같다.","fx":{"check":1}},{"l":"흥정을 배운다","h":"속도 +1","t":"말보다 발이 빨라졌다.","fx":{"spd":1}},{"l":"먹을 것을 사 먹는다","h":"최대 HP +3","t":"든든하게 먹었다.","fx":{"maxHp":3}}]},{"t":"옥상의 저녁","x":"옥상에 올라 도시를 내려다본다. 불빛이 하나씩 켜진다.","o":[{"l":"조용히 앉아 있는다","h":"최대 HP +3","t":"마음이 가라앉았다.","fx":{"maxHp":3}},{"l":"도시를 눈에 담는다","h":"사건 판정 +1","t":"골목의 지도가 머릿속에 남았다.","fx":{"check":1}},{"l":"난간 위를 걷는다","h":"회피 +1","t":"균형이 잡혔다.","fx":{"eva":1}}]},{"t":"오래된 도서 대여점","x":"구석의 대여점에서 낡은 책을 빌려 본다. 읽는 사이 하루가 갔다.","o":[{"l":"실용서를 읽는다","h":"공격 +1","t":"한 줄의 요령이 몸에 붙었다.","fx":{"atk":1}},{"l":"이야기책을 읽는다","h":"최대 HP +3","t":"마음이 놓였다.","fx":{"maxHp":3}},{"l":"지도책을 펼친다","h":"속도 +1","t":"길이 한눈에 보였다.","fx":{"spd":1}}]},{"t":"이웃의 부탁","x":"이웃이 무거운 짐을 옮겨 달라고 한다. 대가는 따뜻한 국 한 그릇이다.","o":[{"l":"짐을 대신 든다","h":"최대 HP +3","t":"팔에 힘이 붙었다.","fx":{"maxHp":3}},{"l":"잔심부름을 한다","h":"속도 +1","t":"발걸음이 빨라졌다.","fx":{"spd":1}},{"l":"이야기를 들어 준다","h":"사건 판정 +1","t":"사람 보는 눈이 늘었다.","fx":{"check":1}}]},{"t":"비 오는 날","x":"하루 종일 비가 내린다. 처마 밑에서 할 일을 정한다.","o":[{"l":"칼날을 손질한다","h":"공격 +1","t":"날이 서서 마음도 서늘해졌다.","fx":{"atk":1}},{"l":"젖은 길을 달린다","h":"회피 +1","t":"미끄러운 길에서 균형을 배웠다.","fx":{"eva":1}},{"l":"쉰다","h":"최대 HP +3","t":"깊이 잠들었다.","fx":{"maxHp":3}}]},{"t":"동네 아이들","x":"골목 아이들이 놀자고 매달린다. 한참을 같이 뛰었다.","o":[{"l":"술래를 한다","h":"속도 +1","t":"숨이 차도록 뛰었다.","fx":{"spd":1}},{"l":"피하는 놀이를 한다","h":"회피 +1","t":"아이들의 눈을 따돌렸다.","fx":{"eva":1}},{"l":"이야기를 해 준다","h":"사건 판정 +1","t":"말하다 보니 생각이 정리됐다.","fx":{"check":1}}]},{"t":"낡은 대장간","x":"대장간 주인이 일을 거들어 달라고 한다. 쇠 두드리는 소리가 하루를 채운다.","o":[{"l":"망치를 잡는다","h":"공격 +1","t":"손목에 힘이 붙었다.","fx":{"atk":1}},{"l":"풀무를 돌린다","h":"최대 HP +3","t":"땀이 개운했다.","fx":{"maxHp":3}},{"l":"쇠를 식힌다","h":"속도 +1","t":"손이 빨라졌다.","fx":{"spd":1}}]},{"t":"조용한 밤","x":"잠이 오지 않는 밤, 창가에 앉는다. 도시는 낮은 숨을 쉰다.","o":[{"l":"생각을 정리한다","h":"사건 판정 +1","t":"복잡하던 일이 정리됐다.","fx":{"check":1}},{"l":"명상한다","h":"최대 HP +3","t":"마음이 맑아졌다.","fx":{"maxHp":3}},{"l":"창밖을 지켜본다","h":"회피 +1","t":"어둠 속의 움직임이 보이기 시작했다.","fx":{"eva":1}}]}],"eastScout":{"t":"N사의 제안","x":"환도를 허리에 찬 당신의 이름이 어느새 서류 밖으로 흘러나갔다. 검은 옷의 사람이 사무소 문 앞에 서 있다. \"해결사 일을 계속해도 좋습니다. 우리 쪽 직급 하나와 함께. 금기를 쫓는 일은 당신 같은 사람이 맡아야 합니다.\"","yes":"제안을 받아들인다","yesT":"서류에 이름을 적었다. 해결사의 급수는 그대로 남았고, 그 위에 N사의 직급이 하나 더 얹혔다. 오늘부터 금기를 쫓는다.","no":"해결사로 남는다","noT":"고개를 저었다. 검은 옷의 사람은 명함만 두고 돌아갔다. 길은 닫히지 않았다."},"synRoute":{"offer":{"t":"엄지의 제안","kuro":"흑운회의 조장이 된 당신 앞에 검은 우산을 든 사람이 선다. 엄지의 사자다. \"흑운회는 원래 엄지의 산하였소. 조장 자리를 내려놓고 돌아오면 소토카포로 맞겠소. 대부 바로 밑이오.\"","awl":"밤의 송곳의 카피타노가 된 당신 앞에 금장 단추 정장을 입은 사람이 선다. 엄지의 사자다. \"송곳은 원래 엄지의 칼이었소. 카피타노 직함을 반납하고 돌아오면 소토카포로 맞겠소. 대부
