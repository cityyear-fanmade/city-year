<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noai, noimageai">
<title>도시의 한 해</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;900&display=swap">
<style>
/* 레이아웃: 한 열짜리 텍스트 어드벤처. 전투는 적 / 주사위 무대 / 파티 / 순서 / 기록 / 손패 순서. 각자의 색으로 구분한다. */
:root{
  --bg:#0c0e13; --panel:#131722; --panel2:#1a1f2d; --line:#262c3b; --line2:#3a4256;
  --fg:#e7e2d7; --dim:#8d93a3; --gold:#c8a35a; --gold-ink:#1a1405;
  --bleed:#d1686b; --rupture:#7ba6dc; --breath:#79c2b3; --good:#8fbf7a;
  --serif:"Noto Serif KR","Nanum Myeongjo",serif;
  --sans:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.65 var(--sans);padding-inline:16px;padding-block:20px 40px}
/* 프레임 크기는 모든 테마가 같다: 테두리 두께(--bw)가 달라도 테두리+여백 합은 고정 → 테마를 바꿔도 내용이 밀리지 않는다 */
.wrap{--bw:0px;position:relative;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  border:var(--bw) solid transparent;padding:calc(18px - var(--bw)) calc(14px - var(--bw)) calc(16px - var(--bw))}
h1,h2,h3,p{margin:0}
h1{font:900 clamp(34px,10vw,48px)/1.1 var(--serif);letter-spacing:-.01em;text-wrap:balance}
h2{font:600 22px/1.35 var(--serif);text-wrap:balance}
.serif{font-family:var(--serif)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.small{font-size:12.5px}
.eyebrow{font:500 11.5px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:12px 14px;min-height:46px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;width:100%}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700;align-items:center;justify-content:center;text-align:center}
/* 선택된(밝은 금색) 버튼 안의 보조 글씨는 금색이라 묻힌다 → 어두운 글씨로 */
html:not([data-skin="ruina"]) .btn.primary .mono,html:not([data-skin="ruina"]) .btn.primary .small,html:not([data-skin="ruina"]) .btn.primary .dim{color:var(--gold-ink)!important}
.btn.quiet{background:transparent}
.btn b{font-weight:700}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bar{height:8px;background:#222836;border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12px/1.35 var(--mono);padding:5px 7px;border:1px solid var(--line2);border-radius:3px;color:var(--fg);white-space:normal;max-width:100%;overflow-wrap:anywhere;word-break:keep-all}
.swatch{width:12px;height:12px;border-radius:2px;flex:none}
.lead{color:var(--dim);text-wrap:pretty}
.roll{display:grid;grid-template-columns:64px 44px minmax(0,1fr);gap:10px;align-items:baseline;padding-block:10px;border-top:1px solid var(--line)}
.roll:first-of-type{border-top:0}
.roll .v{font:500 20px/1 var(--mono);color:var(--gold)}
.roll .n{display:flex;flex-direction:column;gap:2px}
.roll .n span{color:var(--dim);font-size:13px}
.log{font:400 12.5px/1.7 var(--mono);max-height:200px;overflow-y:auto;background:#0f1219;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.log div{padding-block:1px;overflow-wrap:anywhere}
.log .head{color:var(--gold);padding-top:6px}
.log .sys{color:var(--dim)}
.log .hit{color:var(--fg)}
.log .miss{color:var(--dim)}
.log .dmg{color:var(--bleed)}
.log .kw{color:var(--rupture)}
.hand{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{position:relative;font:inherit;color:var(--fg);text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:10px 10px 10px 42px;min-height:84px;display:flex;flex-direction:column;gap:5px;cursor:pointer}
.card:disabled{opacity:.38;cursor:default}
.card.sel{border-color:var(--gold);background:#231f15}
.card .cost{position:absolute;left:9px;top:10px;width:24px;height:24px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font:500 13px/1 var(--mono)}
.card .ord{position:absolute;right:8px;top:8px;font:500 12px/1 var(--mono);color:var(--gold-ink);background:var(--gold);border-radius:3px;padding:3px 5px;font-style:normal}
.card .nm{font-weight:700;font-size:14px;line-height:1.3;padding-right:20px}
.card .cd{font:400 11.5px/1.5 var(--mono);color:var(--dim)}
.card .chips{gap:4px}
.card .chip{font-size:11px;padding:3px 5px}
.stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.stat div{background:var(--panel2);border-radius:4px;padding:8px 4px}
.stat b{display:block;font:500 17px/1.2 var(--mono);color:var(--gold)}
.stat span{font-size:11.5px;color:var(--dim)}
details{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--panel)}
summary{cursor:pointer;font-weight:700}
details ul{margin:10px 0 0;padding-left:18px;color:var(--dim);font-size:13.5px}
details li{margin-block:3px}
table{width:100%;border-collapse:collapse;font:400 13px/1.5 var(--mono)}
th,td{padding:8px 6px;border-top:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left;font-family:var(--sans)}
th{color:var(--dim);font-weight:400;border-top:0}
.tbl{overflow-x:auto}
.check{font:400 13px/1.6 var(--mono);color:var(--dim);border-left:2px solid var(--gold);padding-left:10px}
.good{color:var(--good)}.bad{color:var(--bleed)}

/* 색 고르기 / 연출 설정 */
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--fg);outline:2px solid var(--bg);outline-offset:-4px}
.seg{display:flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:13px;padding:10px 6px;background:transparent;color:var(--dim);border:0;border-left:1px solid var(--line2);cursor:pointer;min-height:42px}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--gold);color:var(--gold-ink);font-weight:700}

/* 전투 무대 */
.ent{position:relative}
.arena{background:#0f1219;border:1px solid var(--line);border-radius:6px;padding:12px;min-height:76px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}
.alabel{font:500 13px/1.4 var(--mono);color:var(--dim);text-align:center;min-height:18px}
.dice{display:flex;gap:12px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.dwrap{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:76px}
.dcap{font:500 11px/1 var(--mono);letter-spacing:.1em;color:var(--dim)}
.die{width:64px;height:64px;border:2px solid var(--line2);border-radius:12px;display:grid;place-items:center;background:var(--panel2)}
.die.big{width:72px;height:72px}
.die b{font:500 26px/1 var(--mono);font-variant-numeric:tabular-nums}
.die.rolling{animation:wob .24s linear infinite}
.die.win{box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 55%,transparent)}
.die.lose{opacity:.6}
.dsum{font:400 12px/1.4 var(--mono);color:var(--dim);min-height:17px;text-align:center;max-width:150px}
.vs{align-self:center;font:500 12px/1 var(--mono);color:var(--dim);padding-top:14px}
.d6s{display:flex;gap:6px;min-height:64px;align-items:center}
.d6{width:42px;height:42px;border-radius:9px;border:2px solid var(--gold);display:grid;place-items:center;background:var(--panel2)}
.d6 b{font:500 20px/1 var(--mono)}
.float{position:absolute;right:14px;top:8px;font:700 22px/1 var(--mono);pointer-events:none;animation:flt .95s ease-out forwards;text-shadow:0 1px 6px #000}
@keyframes wob{0%{transform:rotate(-8deg) translateY(0)}25%{transform:rotate(6deg) translateY(-4px)}50%{transform:rotate(-5deg)}75%{transform:rotate(8deg) translateY(-3px)}100%{transform:rotate(-8deg)}}
@keyframes settle{0%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes lungeUp{0%{transform:translateY(0)}35%{transform:translateY(-18px)}100%{transform:translateY(0)}}
@keyframes lungeDown{0%{transform:translateY(0)}35%{transform:translateY(18px)}100%{transform:translateY(0)}}
@keyframes hurt{0%{transform:translateX(0);box-shadow:inset 0 0 0 0 transparent}15%{transform:translateX(-9px);box-shadow:inset 0 0 0 2px var(--bleed)}35%{transform:translateX(8px)}55%{transform:translateX(-5px);box-shadow:inset 0 0 0 2px var(--bleed)}80%{transform:translateX(3px)}100%{transform:translateX(0);box-shadow:inset 0 0 0 0 transparent}}
@keyframes dodge{0%{transform:translateX(0);opacity:1}35%{transform:translateX(24px) skewX(-8deg);opacity:.5}100%{transform:translateX(0);opacity:1}}
@keyframes guard{0%{box-shadow:0 0 0 0 var(--rupture)}50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--rupture) 70%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes flt{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-36px)}}
.settle{animation:settle .3s ease-out}
.lunge-up{animation:lungeUp .45s ease-out}
.lunge-down{animation:lungeDown .45s ease-out}
.hurt{animation:hurt .5s ease-out}
.dodge{animation:dodge .55s ease-out}
.guard{animation:guard .7s ease-out}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}


/* ===== 배경 테마: html[data-skin] = base | dante | library =====
   단테의 노트: 녹슨 적갈색 금속 프레임, 깎인 모서리, 주황 탭 제목.
   도서관: 오래된 종이와 나무 서가 색, 금박 제목. 둘 다 이미지 없이 CSS로만 그린다. */
html{background:var(--bg)}
.skin-tab{display:inline-flex;align-items:center;align-self:center;height:26px;padding:0 18px;font:500 11.5px/1 var(--mono);letter-spacing:.14em;color:var(--dim);border:1px solid var(--line)}
html[data-skin="dante"]{
  --bg:#0d0807; --panel:#1a100d; --panel2:#24150f; --line:#4a2418; --line2:#7a3a22;
  --fg:#efe1cf; --dim:#a68b78; --gold:#f0a23b; --gold-ink:#1d0d04;
  --frame:#5b2618; --frame2:#8e4325; --rivet:#c8743a;
}
html[data-skin="dante"] body{
  background:
    radial-gradient(ellipse at 50% 0%,rgba(142,67,37,.18),transparent 60%),
    repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 2px,transparent 2px 9px),
    var(--bg);
  background-attachment:fixed;
}
html[data-skin="dante"] .wrap{
  --bw:3px;
  background:linear-gradient(180deg,#160c09,#100806);
  border-color:var(--frame);
  box-shadow:inset 0 0 0 1px #2a120b,inset 0 0 0 4px #120806,inset 0 0 0 5px var(--frame2),0 10px 30px rgba(0,0,0,.6);
  clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px);
}
html[data-skin="dante"] .wrap::before,html[data-skin="dante"] .wrap::after{
  content:"";position:absolute;top:8px;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#f3b27a,var(--rivet) 45%,#4d1d0f);
}
html[data-skin="dante"] .wrap::before{left:22px}
html[data-skin="dante"] .wrap::after{right:22px}
html[data-skin="dante"] .skin-tab{
  font-family:var(--sans);font-weight:700;letter-spacing:.08em;color:var(--fg);padding:0 26px;
  background:linear-gradient(180deg,#3a1a10,#24110a);border-color:var(--frame2);
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%);
}
html[data-skin="dante"] .panel,html[data-skin="dante"] details,html[data-skin="dante"] .log,html[data-skin="dante"] .arena{
  border:1px solid var(--line2);border-radius:0;
  box-shadow:inset 0 0 0 1px #0c0504,inset 0 0 0 3px var(--line);
  clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 9px,100% calc(100% - 9px),calc(100% - 9px) 100%,9px 100%,0 calc(100% - 9px),0 9px);
}
html[data-skin="dante"] .btn,html[data-skin="dante"] .card{border-radius:0;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
html[data-skin="dante"] .btn.primary{background:linear-gradient(180deg,#f3b04d,#d9822a);border-color:#ffcf7a;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
html[data-skin="dante"] .eyebrow{color:var(--gold)}
html[data-skin="dante"] h1,html[data-skin="dante"] h2{text-shadow:0 1px 0 #000,0 0 14px rgba(240,162,59,.18)}
html[data-skin="dante"] .chip{border-radius:0}
html[data-skin="dante"] .card.sel{background:#3a1d0e}
html[data-skin="dante"] .arena,html[data-skin="dante"] .log{background:#110907}
html[data-skin="dante"] .die,html[data-skin="dante"] .d6{border-radius:4px}

html[data-skin="terminal"]{
  --bg:#050607; --panel:#04080c; --panel2:#071019; --line:#12324a; --line2:#1d5a82;
  --fg:#c9e4f1; --dim:#7fa3b8; --gold:#5cc3f2; --gold-ink:#02121c;
  --bleed:#ff6b7a; --rupture:#8fb4ff; --breath:#6ff0d2; --good:#7dffb0;
  --shell:#e9edf0; --shell2:#aeb6bd; --shell3:#6d767e;
}
html[data-skin="terminal"] body{background:radial-gradient(ellipse at 50% 30%,#0b1117,#020304 70%);background-attachment:fixed}
/* 흰 금속 외곽(단말기 몸체) + 안쪽 검은 화면 */
html[data-skin="terminal"] .wrap{
  --bw:8px;
  background:linear-gradient(180deg,#03070b,#010304);
  border-color:var(--shell);
  border-image:linear-gradient(160deg,#ffffff,var(--shell) 30%,var(--shell2) 60%,var(--shell3)) 1;
  box-shadow:0 0 0 2px #2a2f34,0 0 0 4px var(--shell2),0 14px 40px rgba(0,0,0,.8),inset 0 0 40px rgba(89,200,255,.07);
  clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 22px,100% calc(100% - 22px),calc(100% - 22px) 100%,22px 100%,0 calc(100% - 22px),0 22px);
}
/* 화면 주사선 */
html[data-skin="terminal"] .wrap::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(127,214,255,.018) 0 1px,transparent 1px 4px)}
html[data-skin="terminal"] .skin-tab{align-self:flex-start;letter-spacing:.2em;color:var(--gold-ink);background:var(--shell);border-color:var(--shell);padding:0 12px}
/* 빛 번짐은 제목과 큰 숫자에만 약하게. 본문은 번짐 없이 또렷하게 */
html[data-skin="terminal"] h1,html[data-skin="terminal"] h2,html[data-skin="terminal"] .roll .v,html[data-skin="terminal"] .stat b{
  text-shadow:0 0 8px rgba(92,195,242,.28)}
html[data-skin="terminal"] .panel,html[data-skin="terminal"] details,html[data-skin="terminal"] .log,html[data-skin="terminal"] .arena{background:rgba(5,14,22,.85);border-color:var(--line2);border-radius:2px}
html[data-skin="terminal"] .btn,html[data-skin="terminal"] .card,html[data-skin="terminal"] .die,html[data-skin="terminal"] .d6{border-radius:2px;background:#061220}
html[data-skin="terminal"] .btn.primary{background:var(--gold);color:var(--gold-ink);text-shadow:none}
html[data-skin="terminal"] .btn.primary b{text-shadow:none}
html[data-skin="terminal"] .bar{background:#0a1a26}

/* 행동 순서표, 성장 */
.ent.down{opacity:.45;filter:grayscale(.7)}
.ent.turn{outline:2px solid var(--gold);outline-offset:2px}
.order{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.order li{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px}
.order li .mono{margin-left:auto}
.grow .v{font:500 18px/1 var(--mono);color:var(--gold);min-width:34px}
/* 칩 모양 버튼(공방에 들른다 등): 브라우저 기본 회색 대신 테마 색 */
button.chip{background:transparent;color:var(--gold);border-color:var(--gold);cursor:pointer}
button.chip:hover{background:color-mix(in srgb,var(--gold) 14%,transparent)}
/* 전투: 행동 순서표, 공격하는 쪽/맞는 쪽, 판정 결과 */
.queue{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.queue li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:baseline;font-size:13.5px;padding:5px 6px;border-radius:4px;border-left:3px solid transparent}
.queue li.foe{background:color-mix(in srgb,var(--bleed) 7%,transparent)}
.queue li.now{border-left-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent)}
.queue li.done{opacity:.45}
.queue .qn{font:500 12px/1.4 var(--mono);color:var(--dim);text-align:right}
.ent.acting{box-shadow:0 0 0 2px var(--gold)}
.ent.target{box-shadow:0 0 0 2px var(--bleed)}
.alabel b{font-weight:700}
.verdict{font:700 16px/1.3 var(--sans);min-height:21px;text-align:center}
.verdict.bad{color:var(--bleed)}.verdict.miss{color:var(--rupture)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,#seedIn,#tw{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:10px 12px;min-height:44px;width:100%}
.dfinal{font:700 22px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--fg);min-height:22px}
.dfinal.good{color:var(--good)}.dfinal.bad{color:var(--bleed)}
/* hidden 속성은 항상 숨김 (.btn·.dwrap의 display보다 우선) */
[hidden]{display:none!important}
/* 피해 주사위는 명중·회피 아래 줄에 따로: 나타날 때 줄이 접히며 흔들리지 않게 */
#dmgw{flex-basis:100%}
/* 휴대폰 전투(폭 600px 이하에서만 쓰는 배치): 적·나 HP를 나란히 작게, 기록·설정은 접어 둔다 */
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ent.compact{padding:8px 10px;gap:5px}
.ent.compact .entname{display:flex;align-items:center;gap:6px;min-width:0}
.ent.compact .entname b{font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent.compact .bar{height:6px}
.ent.compact .chip{font-size:10.5px;padding:3px 5px}
.ordline{font-size:13.5px;line-height:1.7}
.logbox{padding:10px 12px}.logbox summary{font-size:13.5px}.logbox .log{margin-top:8px}
/* 주사위 무대: 명중·회피 주사위를 항상 한 줄에 나란히, 피해는 아래 줄 (이름이 길어도 세로로 접히지 않게) */
.dice{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;justify-items:center;gap:8px 6px}
.dice .dwrap{min-width:0;width:100%}
.dice .dcap{white-space:normal;text-align:center;line-height:1.35;font-size:11px;letter-spacing:.04em;min-height:4.1em;display:flex;align-items:center;justify-content:center}
#dmgw{grid-column:1/-1}
@media (max-width:600px){.die{width:56px;height:56px}.die b{font-size:22px}.arena{padding:10px 8px}}
.roundbox summary{cursor:pointer;font-size:13.5px;line-height:1.6}
.roundbox .qnow{font-size:13px}
/* PC(폭 900px 이상): 같은 배치를 넓게. 본문 폭을 넓히고 손패를 한 줄에 4장 */
@media (min-width:900px){.wrap{max-width:780px}.hand{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* 걸려 있는 키워드 칩: 색을 채우고 다음 효과를 작게 붙인다 */
.chip.stk{display:inline-flex;align-items:baseline;gap:6px;color:var(--kc);border-color:var(--kc);background:color-mix(in srgb,var(--kc) 16%,transparent);font-size:13px;padding:5px 8px}
.chip.stk small{font-size:11px;opacity:.8}
.float.kwf{top:auto;bottom:10px;left:14px;right:auto;font-size:16px}
.chip.stk{flex-wrap:wrap;white-space:normal;max-width:100%}

/* 소지품 칸 */
.inv summary{cursor:pointer;font:600 13px/1.4 var(--sans,inherit);color:var(--gold)}
.invr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:5px 0;border-bottom:1px solid var(--line)}
.invr>span:last-child{grid-column:1/-1}
.invr>span:last-child:empty{display:none}
.invcards{display:grid;gap:6px;margin-top:6px}
.invc{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;padding:6px 8px;border:1px solid var(--line);border-radius:4px}
.invc .cost{width:24px;height:24px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font:500 13px/1 var(--mono)}

.invtabs{display:flex;flex-wrap:wrap;gap:4px}.invtabs button{flex:1 1 auto;font-size:12px;padding:6px 8px}

/* 도서관 초대장: 검은 바탕 + 옅은 금빛. 단테(붉은 갈색·잘린 모서리)와 달리 둥근 아치·모서리 꺾쇠·금빛 번짐 */
html[data-skin="ruina"]{
  --bg:#010101; --panel:#060504; --panel2:#0a0806; --line:#3a3020; --line2:#8c7448;
  --fg:#eadfc6; --dim:#97896f; --gold:#ecc97f; --gold-ink:#140f06;
  --g:#e2c07a; --g2:rgba(226,192,122,.45); --glow:rgba(236,201,127,.16);
}
html[data-skin="ruina"] body{
  background:
    radial-gradient(ellipse at 50% 0%,rgba(236,201,127,.05),transparent 45%),
    radial-gradient(ellipse at 50% 100%,rgba(236,201,127,.025),transparent 40%),
    conic-gradient(from 45deg at 50% 50%,rgba(226,192,122,.012) 0 25%,transparent 0 50%,rgba(226,192,122,.012) 0 75%,transparent 0) 0 0/46px 46px,
    var(--bg);
  background-attachment:fixed;
}
/* 바깥 틀: 위가 둥근 아치, 금선 두 겹 + 금빛 번짐 */
html[data-skin="ruina"] .wrap{
  --bw:1px;border-color:var(--g);border-radius:120px 120px 6px 6px/40px 40px 6px 6px;
  background:radial-gradient(ellipse at 50% 0%,#0a0805,#020202 55%);
  box-shadow:0 0 0 5px #050403,0 0 0 6px var(--g2),0 0 30px var(--glow),inset 0 0 0 6px #080604,inset 0 0 0 7px var(--g2);
}
/* 맨 위 표식: 상자 대신 양옆으로 뻗는 금선 + 가운데 마름모 */
html[data-skin="ruina"] .skin-tab{
  align-self:stretch;justify-content:center;gap:12px;border:0;height:30px;padding:0;
  font:700 14px/1 var(--serif);letter-spacing:.3em;color:var(--g);text-shadow:0 0 10px var(--glow)}
html[data-skin="ruina"] .skin-tab::before,html[data-skin="ruina"] .skin-tab::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--g) 70%,var(--g));box-shadow:0 0 6px var(--glow)}
html[data-skin="ruina"] .skin-tab::after{background:linear-gradient(270deg,transparent,var(--g) 70%,var(--g))}
/* 칸: 얇은 금선 + 네 모서리 꺾쇠 장식 */
html[data-skin="ruina"] .panel,html[data-skin="ruina"] details,html[data-skin="ruina"] .log,html[data-skin="ruina"] .arena{
  border:1px solid var(--g2);border-radius:2px;
  background:
    linear-gradient(var(--g),var(--g)) top left/14px 1px no-repeat,linear-gradient(var(--g),var(--g)) top left/1px 14px no-repeat,
    linear-gradient(var(--g),var(--g)) top right/14px 1px no-repeat,linear-gradient(var(--g),var(--g)) top right/1px 14px no-repeat,
    linear-gradient(var(--g),var(--g)) bottom left/14px 1px no-repeat,linear-gradient(var(--g),var(--g)) bottom left/1px 14px no-repeat,
    linear-gradient(var(--g),var(--g)) bottom right/14px 1px no-repeat,linear-gradient(var(--g),var(--g)) bottom right/1px 14px no-repeat,
    linear-gradient(180deg,rgba(8,7,5,.96),rgba(2,2,1,.96));
  box-shadow:inset 0 0 0 4px rgba(5,4,3,.9),inset 0 0 0 5px rgba(226,192,122,.18),0 0 12px rgba(0,0,0,.6);
}
/* 손패 카드: 위가 둥근 책 표지 */
html[data-skin="ruina"] .card{border:1px solid var(--g2);border-radius:28px 28px 3px 3px/16px 16px 3px 3px;
  background:linear-gradient(180deg,#0a0806,#030302);box-shadow:inset 0 0 0 4px #030302,inset 0 0 0 5px rgba(226,192,122,.28)}
html[data-skin="ruina"] .card.sel{border-color:var(--g);background:linear-gradient(180deg,#2a2112,#120e08);box-shadow:inset 0 0 0 4px #120e08,inset 0 0 0 5px var(--g),0 0 16px var(--glow)}
html[data-skin="ruina"] .card .cost{border-color:var(--g);color:var(--g);box-shadow:0 0 6px var(--glow)}
html[data-skin="ruina"] .btn{border-radius:2px;border-color:var(--g2);background:rgba(4,3,2,.92)}
/* 주 버튼: 양끝 뾰족한 금테 띠 + 안쪽 금선 */
html[data-skin="ruina"] .btn.primary{
  background:linear-gradient(180deg,#0e0b07,#030302);color:var(--fg);border:1px solid var(--g);border-radius:0;
  box-shadow:inset 0 0 0 3px #030302,inset 0 0 0 4px var(--g2),0 0 18px var(--glow);
  clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,18px 100%,0 50%);
  font-family:var(--serif);letter-spacing:.12em;text-shadow:0 0 8px var(--glow)}
html[data-skin="ruina"] .btn.primary b{color:var(--fg)}
html[data-skin="ruina"] .eyebrow{color:var(--g);font-family:var(--serif);letter-spacing:.16em}
html[data-skin="ruina"] h1,html[data-skin="ruina"] h2{font-family:var(--serif);color:#f6dfa6;text-shadow:0 0 14px rgba(236,201,127,.45),0 1px 0 #000}
html[data-skin="ruina"] .chip{border-radius:2px;border-color:var(--g2)}
html[data-skin="ruina"] .die,html[data-skin="ruina"] .d6{border-radius:50%;border-color:var(--g);background:#0c0a07;box-shadow:0 0 10px var(--glow)}
html[data-skin="ruina"] .seg{border-color:var(--g2);border-radius:2px}
html[data-skin="ruina"] .seg button.on{background:linear-gradient(180deg,#f0d38f,#c99a4a);color:var(--gold-ink)}

/* 결과 칩이 많으면 칸 안에서 스크롤 (휴대폰에서 화면이 길게 밀리지 않게) */
.chipscroll{max-height:38vh;overflow-y:auto;overscroll-behavior:contain;padding:2px 4px 2px 0;align-content:flex-start}
.chipscroll::-webkit-scrollbar{width:6px}.chipscroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}

/* ===== 6시즌: 가방 (앱 아이콘 칸 → 펼쳐지는 시트) ===== */
.dock{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.tile{position:relative;font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line2);border-radius:12px;width:68px;height:68px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:transform .12s,border-color .12s}
.tile svg{color:var(--gold)}
.tile span{font-size:12px;line-height:1.1}
.tile em{position:absolute;top:-6px;right:-6px;font:600 10.5px/1 var(--mono);font-style:normal;background:var(--gold);color:var(--gold-ink);border-radius:9px;padding:3px 5px;white-space:nowrap}
.tile:hover{border-color:var(--gold);transform:translateY(-2px)}
.tile:active{transform:scale(.94)}
.tile.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--panel2))}
.tile.sm{width:auto;flex:1;min-width:0;height:58px}
.bagtabs{display:flex;gap:8px;margin-top:4px}
/* 가방 타일: 좁은 화면은 HUD 안(dock-in), 넓은 화면(본문 양옆에 자리가 있을 때)은 창 오른쪽에 뜨는 별도 칸(dock-out).
   dock-out은 .wrap 밖에 그린다 — 단테·단말기 스킨은 .wrap에 clip-path가 있어 안에 두면 잘려 나간다 */
.dock-out{display:none}
@media (min-width:1020px){
  .dock-in{display:none}
  .dock-out{display:flex}
  .dock{position:fixed;right:20px;top:50%;transform:translateY(-50%);flex-direction:column;z-index:20;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:16px;padding:10px}
}
html.ovopen,html.ovopen body{overflow:hidden}
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.ovbg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet{position:relative;width:min(640px,100%);max-height:88vh;overflow-y:auto;overscroll-behavior:contain;background:var(--panel);border:1px solid var(--line2);border-bottom:0;border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.sheet.offer{border-color:var(--gold)}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:16px;border-bottom:1px solid var(--line2)}}
@keyframes bagopen{0%{transform:translateY(40px) scale(.92);opacity:0}60%{transform:translateY(-4px) scale(1.01);opacity:1}100%{transform:none}}
.bagopen{animation:bagopen .38s cubic-bezier(.2,.8,.3,1)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* 카드 종류 표시 */
.kb{font:600 11px/1 var(--mono);padding:3px 6px;border-radius:3px;color:var(--kc);border:1px solid var(--kc);background:color-mix(in srgb,var(--kc) 14%,transparent);white-space:nowrap}
.invc{grid-template-columns:auto 1fr auto;border-left:3px solid var(--kc,var(--line))}
.invc .acts{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.invc .acts .chip{cursor:pointer;background:var(--panel2);white-space:nowrap}
.chip.warn{border-color:var(--bleed);color:var(--bleed)}
.chip.on{background:color-mix(in srgb,currentColor 18%,transparent)}
button.chip{cursor:pointer;background:transparent}
.seg.kinds{flex-wrap:wrap}.seg.kinds button{flex:1 1 auto;font-size:12px;padding:8px 6px;min-height:36px}
.seg.kinds button.on{background:var(--kc,var(--gold));color:var(--gold-ink)}
.invr.stash{grid-template-columns:auto 1fr auto;align-items:center}
.invr.stash>span:last-child{grid-column:auto}
.card .nm .kb{font-size:10px;padding:2px 4px;vertical-align:1px}
/* 굴림: 이름이 돌아가는 동안은 설명을 가린다 */
.cycling [data-cyc]{color:var(--dim)}
.cycling .n>span,.cycling.grow>span.mono{visibility:hidden}
@media (max-width:899px){.dock{flex-wrap:nowrap;gap:6px}.dock .tile{width:60px;height:60px;border-radius:11px}.dock .tile span{font-size:11px}}
.endgrp{padding:8px 10px;border-left:3px solid var(--kc);background:var(--panel2)}
.endgrp summary{cursor:pointer;display:flex;align-items:center;gap:8px;list-style:none}
.endgrp summary::-webkit-details-marker{display:none}
.endgrp summary::after{content:'▾';margin-left:auto;color:var(--dim);font-size:12px}
.endgrp:not([open]) summary::after{content:'▸'}
.endgrp .chips{margin-top:8px}
.bhelp summary{cursor:pointer;color:var(--gold)}
.trow{display:grid;grid-template-columns:52px minmax(0,auto) 1fr;gap:8px;align-items:baseline;padding:4px 6px;border-radius:3px;font-size:13px}
.trow .mono{color:var(--dim)}
.trow.hit{background:color-mix(in srgb,var(--gold) 16%,transparent);outline:1px solid var(--gold)}
.trow.hit .mono{color:var(--gold)}
.invr.rel{grid-template-columns:1fr;gap:2px}.invr.rel>b{font-size:13px;font-weight:500}
.passives{display:grid;gap:2px;padding:6px 8px;border-left:2px solid var(--gold);background:color-mix(in srgb,var(--gold) 6%,transparent)}
.card.presc{border:2px solid var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--panel2));padding-top:32px;box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.card.presc .cost{top:32px}
.prescTag{position:absolute;left:0;right:0;top:0;padding:4px 8px;background:var(--gold);color:var(--gold-ink);font:700 12px/1.3 var(--mono);border-radius:3px 3px 0 0;text-align:center}
.prescBar{padding:8px 10px;border:1px solid var(--gold);border-radius:5px;background:color-mix(in srgb,var(--gold) 10%,transparent);font-size:13px;line-height:1.5}
.card.presc .ord{top:36px}
.ent.compact .entname b{white-space:normal;overflow:visible;text-overflow:clip;word-break:keep-all;font-size:13px}

/* 공방 거리: 스크롤해도 자산이 위에 붙어 보인다 */
.moneybar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;margin:0 0 4px;background:var(--bg,#0b0e14);border:1px solid var(--gold);border-radius:8px;font:500 13px/1 var(--mono);color:var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.45)}
.moneybar b{font-size:15px;letter-spacing:.02em}
html[data-skin="dante"] .moneybar,html[data-skin="terminal"] .moneybar,html[data-skin="ruina"] .moneybar{border-radius:0}
.triBar{display:grid;gap:6px;padding:8px 10px;border:1px solid var(--gold);border-radius:5px;background:color-mix(in srgb,var(--gold) 8%,transparent)}
.triBar .btn{line-height:1.3}

.cfgbtn{position:fixed;right:12px;top:10px;z-index:30;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);color:var(--dim);font-size:18px;line-height:1;cursor:pointer}
.cfgbtn:hover{color:var(--gold);border-color:var(--gold)}

/* ===== PC 보조 UI (1360px 이상): 왼쪽 수치판 + 양옆 은은한 장식. 모바일과 좁은 화면에는 나타나지 않는다 ===== */
.side-l{display:none}
@media (min-width:1360px){

  .side-l{display:flex;flex-direction:column;gap:5px;position:fixed;left:20px;top:50%;transform:translateY(-50%);width:176px;z-index:20;padding:12px 12px 10px;
    background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:14px;font:500 12px/1.4 var(--mono);color:var(--dim)}
  .side-l .stitle{font:700 13px/1.3 var(--serif);color:var(--fg);padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side-l .srow{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .side-l .srow b{color:var(--fg);font-weight:600;text-align:right;min-width:0}
  .side-l .srow b.gname{color:var(--gold);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:104px}
  .side-l .ssep{height:1px;background:var(--line);margin:3px 0}
  html body::before,html body::after{content:"";position:fixed;top:0;bottom:0;width:calc((100vw - 780px)/2 - 230px);min-width:30px;pointer-events:none;
    background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--gold) 10%,transparent) 30%,color-mix(in srgb,var(--gold) 10%,transparent) 70%,transparent);
    border-inline:1px dashed color-mix(in srgb,var(--gold) 24%,transparent)}
  html body::before{left:208px}html body::after{right:208px}
}

@media (min-width:1360px){ html body .side-l,html body .dock-out{z-index:60} }
.sheet .roll{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.sheet .roll .n{display:flex;flex-direction:column;gap:2px;min-width:0}
@media (min-width:1360px){ .hud-dup{display:none} }
.side-l .bufup{color:#7fd1a0;font-style:normal}
.bgmrow{display:flex;gap:8px;align-items:center}.bgmrow input[type=range]{flex:1;min-width:0;accent-color:var(--gold);height:28px}
.log .amp{font-weight:700;color:var(--bg,#0b0b0e);background:var(--gold);padding:3px 8px;border-radius:6px;margin:3px 0;display:block;box-shadow:0 0 0 1px var(--gold)}

.egobar{border-left:2px solid var(--gold);padding:4px 8px;margin:4px 0;background:rgba(201,162,74,.07);display:flex;flex-direction:column;gap:4px}
  .ctitle{color:var(--gold);font-weight:600}

/* 시작 화면 일대기 버튼: 좁은 화면은 틀 안 맨 위(chron-in), 넓은 화면은 틀 바깥 왼쪽 위 고정(chron-out) */
.chronbtn{border-color:var(--gold);text-align:left}
.chronbtn b{color:var(--gold)}
.chron-out{display:none}
@media (min-width:1180px){.chron-in{display:none}.chron-out{display:flex;position:fixed;top:18px;left:18px;width:210px;z-index:5;background:var(--panel);box-shadow:0 2px 10px rgba(0,0,0,.4)}}

.helpbtn{top:52px;font:600 17px/1 var(--serif,serif)}
</style>
</head>
<body>
<div id="app"></div>
<script>
(()=>{
/* ---- src/config.js ---- */
/* 임시 수치: 밸런스는 여기만 바꾼다. `npm run sim`으로 확인한다. */
const LV_CURVE = {base: 4.5, every: 8};
const LEVELS = (() => {
  const {base, every} = LV_CURVE, out = [0];
  let acc = 0;
  for (let L = 2; L <= 120; L++) { acc += base * Math.pow(2, Math.floor(L / every)); out.push(Math.round(acc)); }
  return out;
})();
const CFG = {
  /* 피해 주사위 최소값: 장비(최댓값) + 재능·성장기의 '+1'(겹치면 더해짐), 합계는 dminCap까지 */
  dminCap: 4,
  /* 의견·버그 제보 구글 폼 (시작 화면 링크) */
  feedbackUrl: 'https://forms.gle/FYsYb2itq3LyUXrs9',
  /* 캐릭터 */
  baseHp: 60,
  /* 전투: 빛(코스트), 손패, 키워드 */
  light: 3, lightMax: 5, hand: 4, stackCap: 10,
  /* 이름 입력 칸(특이점·E.G.O·뒤틀림·사무소·날개·특색)의 최대 글자 수 (특색은 2글자부터) */
  nameMax: 12,
  breathCritPer: 5, critMult: 1.5,
  /* 호흡(v6.1): 최대 cap. 타격마다 소모되지 않고 라운드가 바뀔 때 decay씩 줄어든다.
     치명 확률: 호흡 sure 이상 100%, from~sure-1은 base%에서 step%씩 올라 90%, 1~evaMax는 치명 없이 회피 +eva. 환도 배수는 호흡 hwandoCap까지만 반영 */
  breath: {cap: 12, decay: 2, sure: 10, from: 4, base: 20, step: 14, evaMax: 3, eva: 5, hwandoCap: 10},

/* 엔진: 규칙·판정·전투·진행. DOM을 쓰지 않는다 (브라우저·Node 시뮬 공용).
   데이터(D)는 data/*.json을 합친 객체로 주입받는다. 세계관 고유명사는 데이터 문자열에만 있다. */

const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const sg = n => n>=0 ? '+'+n : '−'+Math.abs(n);
const STAT = {atk:'공격',eva:'회피',spd:'속도'};

/* 시드 고정 난수 (시뮬 재현용) */
function mulberry32(a){
  return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
}

/* 데이터 검사: 없는 카드·적·키워드를 가리키는 곳을 찾는다. 새 데이터를 넣은 뒤 `npm run check` */
function validateData(D){
  const err=[],card=(id,at)=>{if(!D.cards[id])err.push(`${at}: 없는 카드 "${id}"`)};
  for(const [id,c] of Object.entries(D.cards)){
    if(!['atk','def','buff'].includes(c.t))err.push(`카드 ${id}: t는 atk/def/buff 중 하나`);
    if(typeof c.c!=='number')err.push(`카드 ${id}: 코스트 c 없음`);
    if(c.t==='atk'&&!(c.hits>=1&&c.dice>=1))err.push(`카드 ${id}: 공격 카드는 hits, dice 필요`);
    for(const k of c.kw||[])if(!D.keywords[k[0]])err.push(`카드 ${id}: 없는 키워드 "${k[0]}"`);
  }
  for(const id of D.rewards)card(id,'보상 목록');
  for(const [id,e] of Object.entries(D.enemies))e.deck.forEach(c=>card(c,`적 ${id} 덱`));
  /* 전투 지정: 적 id 또는 "table:<조우 표>" */
  const spec=(s,at)=>{
    if(s.startsWith('table:')){if(!D.encounters.tables[s.slice(6)])err.push(`${at}: 없는 조우 표 "${s.slice(6)}"`)}
    else if(!D.enemies[s])err.push(`${at}: 없는 적 "${s}"`);
  };
  for(const [y,s] of Object.entries(D.fixedFights))spec(s,`고정 전투 ${y}년차`);
  for(const h of D.hiddenBosses||[])if(!D.enemies[h.id])err.push(`히든 보스: 없는 적 "${h.id}"`);
  for(const [k,t] of Object.entries(D.encounters.tables)){
    if(t.at(-1).max!==100)err.push(`조우 표 ${k}: 마지막 max가 100이 아님`);
    t.forEach(x=>{if(!D.enemies[x.enemy])err.push(`조우 표 ${k}: 없는 적 "${x.enemy}"`)});
  }
  for(const tbl of ['origins','talents','flaws','weapons','growth'])
    if(D[tbl].at(-1).max!==100)err.push(`${tbl}: 마지막 max가 100이 아님`);
  if(D.childhood.table.at(-1).max!==100)err.push('childhood.table: 마지막 max가 100이 아님');
  for(const [id,it] of Object.entries(D.items)){
    if(!D.slots[it.slot])err.push(`공방 물건 ${id}: 없는 칸 "${it.slot}"`);
    if(!D.workshops.some(w=>w.grade===it.grade))err.push(`공방 물건 ${id}: 없는 공방 등급 ${it.grade}`);
    if(it.card)card(it.card,`공방 물건 ${id}`);
  }
  for(const n of D.orgs.finger){
    const F=D.fingers[n];if(!F){err.push(`손가락 "${n}": fingers.json에 서열표 없음`);continue}
    for(const r of F.ranks)for(const x of r.branch||[r])if(x.card)card(x.card,`손가락 ${n} ${x.n}`);
  }
  for(const [k,C_] of Object.entries(D.careers||{}))for(const [n,rows] of Object.entries(C_.cards||{})){
    if(!(D.orgs[k]||[]).includes(n.split('/')[0]))err.push(`진로 ${k}: 전용 카드 소속 "${n}"이 orgs에 없음`);
    if(rows.length!==C_.ranks.length+1)err.push(`진로 ${k} ${n}: 전용 카드 줄 수가 직급 수 + 본부(${C_.ranks.length+1})와 다름`);
    for(const ids of rows)for(const id of ids)card(id,`진로 ${k} ${n}`);
  }
  for(const o of D.origins)if(D.money.start[o.n]==null)err.push(`출신 ${o.n}: 시작 자산(money.start) 없음`);
  for(const [id,e] of Object.entries(D.enemies))if(!e.tier||D.money.bounty[e.tier]==null)err.push(`적 ${id}: tier 없음 또는 현상금 없음`);
  D.origins.forEach(o=>{card(o.card,`출신 ${o.n}`);for(const k in o.paths||{})if(!D.text.paths[k])err.push(`출신 ${o.n}: 없는 진로 "${k}"`)});
  for(const ev of D.events)if(ev.tag&&!D.text.paths[ev.tag])err.push(`사건 "${ev.t}": 없는 진로 태그 "${ev.tag}"`);
  const evs=[...D.events,D.affiliation,D.promotionExam,D.colorExam,D.redBook,...Object.values(D.corp||{})].filter(Boolean);
  for(const ev of evs)for(const c of ev.c)for(const r of [c.ok,c.fail].filter(Boolean)){
    if(!r.fx)continue;
    if(r.fx.card)card(r.fx.card,`사건 "${ev.t}"`);
    if(r.fx.combat)spec(r.fx.combat,`사건 "${ev.t}"`);
    if(r.fx.join&&r.fx.join.from&&!(D.orgs[r.fx.join.from]||[]).length)err.push(`사건 "${ev.t}": 소속 목록 orgs.${r.fx.join.from} 없음`);
    if(r.fx.join&&!r.fx.join.from&&!r.fx.join.name)err.push(`사건 "${ev.t}": join에 name 또는 from 필요`);
    if(c.check&&c.check.path&&!D.text.paths[c.check.path])err.push(`사건 "${ev.t}": 없는 진로 "${c.check.path}"`);
    if(c.check&&!c.fail)err.push(`사건 "${ev.t}" / "${c.l}": 판정이 있으면 fail 필요`);
  }
  return err;
}

function createEngine(D,{rng:rng0=Math.random}={}){
  /* 난수: 기본은 주입된 것. reseed(시드)로 한 판 전체를 그 시드로 굴린다(같은 시드 + 같은 선택 = 같은 결과) */
  let rng=rng0;
  const reseed=seed=>{rng=mulberry32(seed>>>0)};
  const d=n=>1+Math.floor(rng()*n);

  /* 일상: 사건이 있는 해 일부에 온다. 안정적으로 능력치를 조금 올려 주는 사건이고, 인연이 없는 캐릭터는 일부가 인연(조우자)을 만나는 사건이 된다 */

  /* 조직 루트 사건: 엄지 전향 제안(흑운회·송곳) → 숙청 소문 → 반역 / 검계 역적 낙인 */

  /* ===== H사 홍원 가주 후보 루트 =====

  function hwYear(G){

  /* 루트 전용 무기 강화: kind rb|hw, key = 단계 인덱스 또는 'host'|'free'. 끼고 있거나 보관함에 있는 같은 id의 무기를 새 단계로 바꾼다 */

/* 배경음악: 외부 음원 없이 Web Audio로 합성한다 (저작권 문제 없음). 직접 만든 곡이다.

  function bagTabs(ch){return [['stat','출생',''],['pack','카드팩',(ch.packs||[]).length?'보관 '+ch.packs.length:''],['gear','장비',(ch.stash||[]).length?'보관 '+ch.stash.length:''],['card','카드',ch.deck.length+'/'+E.deckMax(ch)],['relic','전리품',(ch.relics||[]).length?String(ch.relics.length):'']].concat([['title','칭호',titleList(ch).length?String(titleList(ch).length):'']]).concat(ch.bond&&['met','married','lost'].includes(ch.bond.st)?[['family','가족',ch.bond.st==='married'?'♥':'']]:[])}

  const FXN={maxHp:'최대 HP',atk:'공격',eva:'회피',spd:'속도',check:'판정',dmin:'피해 최소',dr:'피해 감소(%)',regen:'라운드마다 HP 회복',die:'피해 주사위',dmgB:'피해',burnHit:'붉은 화염',startBleed:'시작 출혈',startBreath:'시작 호흡',defUp:'방어 회피',extraD2:'추가 피해'};
  function fxDiff(nw,old){

  function cardGuide(){

      ['6d8 · 3d6 표기','"6d8"은 8면체 주사위 6개를 굴려 합친다는 뜻이다. "3d6"은 6면체 3개. 앞 숫자가 개수, 뒤 숫자가 면 수다. 개수가 많을수록 결과가 평균 근처로 모이고, 면 수가 클수록 눈의 폭이 커진다. 면 수를 적지 않은 카드는 6면체다.'],
      ['+N (피해 뒤 고정값)','"2d4+2"의 +2는 주사위를 합친 값에 더하는 고정 피해다.'],
      ['피해 주사위 최소 (D6≥N)',`장비·타고난 것에 쓰인 표기다. 주사위 눈이 N보다 작게 나오면 N으로 친다. 여러 곳에서 오는 보정을 합쳐도 최대 ${CFG.dminCap}까지다.`],
      ['명중 +N / 명중 2회 굴림','카드의 "명중 +N"은 그 카드의 명중 굴림에만 더해지는 값이다(마이너스면 빗나가기 쉽다). "명중 2회 굴림"은 명중 굴림을 두 번 해서 높은 쪽을 쓴다.'],
      ['적중 시 ○○','명중 굴림에 이겼을 때만 일어나는 효과다. 색이 있는 칩이 키워드이고, "출혈 +2"처럼 상대에게 쌓이는 것이 기본이다. 칩 끝에 "자신"이 붙은 것(예: 호흡 +3 자신)은 나에게 쌓인다.'],
      ['보호막 · 회피 · 방어 카드','방어 카드의 "회피 +N"은 이번 라운드 상대의 명중 굴림에 맞서는 내 수치에 더해진다. 보호막은 체력 앞에서 피해를 대신 맞아 주는 수치다. 버프 카드는 피해를 주지 않고 나에게 효과를 건다.'],
      ['카드 종류 배지','카드 이름 앞의 작은 표시다. 공격은 피해 주사위를 굴리는 카드, 회피는 이번 라운드 회피를 올리는 카드, 방어는 보호막을 세우는 카드, 버프는 나에게 효과를 거는 카드, 디버프는 상대에게 키워드를 거는 카드다.'],

      ['1d4~10 같은 범위 표기','주사위 면이 아니라 4부터 10 사이의 값 중 하나가 같은 확률로 나온다는 뜻이다.'],
      ['사용 제한','"연속 사용 불가"는 바로 다음 라운드에 다시 낼 수 없는 카드다. "전투당 1회"는 한 전투에서 한 번만 낸다. "사용 후 다음 라운드 ○○"는 그 카드를 낸 다음 라운드에 ○○ 카드가 손패로 들어온다.'],
      ['빛 외의 비용','"정신력 N 소모"나 "HP N을 바쳐"가 적힌 카드는 빛과 함께 그 비용을 낸다.'],
      ['이름 옆 +1 · +2 · +3 (등급)','공격 카드에 연차가 지나며 붙는 강화다. '+G_+'. 보호막이 있는 카드도 등급이 오르면 보호막이 늘어난다.']
    ];
    return `<div class="panel stack" style="gap:8px"><b style="color:var(--gold)">카드 읽는 법</b>${rows.map(([n,x])=>`<div class="stack" style="gap:2px"><b class="small">${esc(n)}</b><span class="small dim">${esc(x)}</span></div>`).join('')}</div>`;

  /* 카드팩 보관함: 덱이 통째로 바뀐 적이 있으면 이전 팩이 여기에 남는다. 해마다 한 번 바꿔 끼운다 */
  function vPacks(){

    const chips=ids=>{const cnt={};ids.forEach(id=>{if(D.cards[id])cnt[id]=(cnt[id]||0)+1});return `<div class="chips">${Object.keys(cnt).map(id=>`<span class="chip">${esc(D.cards[id].n)}${cnt[id]>1?' ×'+cnt[id]:''}</span>`).join('')}</div>`};
    const flag=(l,c)=>l?`<span class="mono small dim">${c?'덱 고정 · ':''}${c?'새 카드는 돈으로 받는다':'카드를 지우고 옮길 수 있다'}</span>`:'';
    const rn=(i,nm)=>`<div class="row" style="gap:6px;flex-wrap:nowrap"><input id="pkn${i<0?'a':i}" value="${esc(nm)}" maxlength="10" autocomplete="off" aria-label="카드팩 이름" style="flex:1;min-width:0;background:var(--panel2);color:var(--fg);border:1px solid var(--line2);border-radius:5px;padding:8px 10px;font:inherit"><button class="chip" data-a="packrn" data-i="${i}">이름 저장</button></div>`;

    return `<p class="small dim">기본 카드팩 3개(기본 4장으로 시작, 이름을 바꿀 수 있다)와 출신 카드팩이 여기 보관된다. 덱이 통째로 바뀌는 전용 카드팩을 받으면 이전 덱도 여기에 남는다. 보상으로 얻은 카드는 편집할 수 있는 모든 팩에 복사되고, 출신·소속 전용 카드는 그 전용 팩에만 들어간다. E.G.O 같은 고정 카드는 모든 팩에 자동으로 들어간다. 전투 밖에서는 횟수 제한 없이 바꿔 끼울 수 있다. 전투 중에는 가방이 열리지 않아 바꿀 수 없다.</p>
      ${msg?`<p class="small bad">${esc(msg)}</p>`:''}
      <div class="panel stack" style="gap:6px;border-color:var(--gold)"><div class="row between"><b style="color:var(--gold)">지금 쓰는 팩 · ${esc(ch.packName||'출신 카드팩')}</b><span class="mono small dim">덱 ${ch.deck.length}장</span></div>${flag(1,ch.deckLocked||ch.cardMoney)}${chips(ch.deck)}${ch.packKind==='basic'?rn(-1,ch.packName):''}</div>
      ${ps.length?ps.map((t,i)=>{const can=E.packCan(ch,i),ask=UI.packSwAsk===i;return `<div class="panel stack" style="gap:6px"><div class="row between"><b>${esc(t.n)}</b><span class="mono small dim">덱 ${t.deck.length}장${t.side.length?' · 카드함 '+t.side.length+'장':''}</span></div>${flag(1,t.deckLocked||t.cardMoney)}${chips(t.deck)}${t.k==='basic'?rn(i,t.n):''}
        ${can==='ok'?`<button class="btn${ask?' primary':''}" data-a="packsw" data-i="${i}"><b>${ask?'정말 바꾼다 · 한 번 더 누른다':'이 팩으로 바꾼다'}</b><span class="dim small">지금 팩은 보관함으로 간다</span></button>`:`<p class="small dim">${why[can]||''}</p>`}</div>`}).join(''):'<div class="panel"><p class="small dim">보관한 팩이 없다. 전용 카드팩을 받아 덱이 통째로 바뀌면 이전 덱이 여기에 남는다.</p></div>'}`;

      <div class="bagtabs">${bagTabs(ch).map(([k,n,b])=>`<button class="tile sm${t===k?' on':''}" data-a="bag" data-i="${k}">${icon(k)}<span>${n}</span>${b?`<em>${b}</em>`:''}</button>`).join('')}</div>

  /* 카드 보상: 이미 가진 장수(덱+카드함)와 지금 덱을 같이 보여 준다 */
  const ownN=(ch,id)=>ch.deck.filter(x=>x===id).length+(ch.side||[]).filter(x=>x===id).length;
  const ownTag=(ch,id)=>{const n=ownN(ch,id);return n?`<span class="mono small" style="color:var(--gold)">보유 ×${n}</span>`:'<span class="mono small dim">새 카드</span>'};
  const myDeck=ch=>{const cnt={};ch.deck.forEach(id=>cnt[id]=(cnt[id]||0)+1);const sd={};(ch.side||[]).forEach(id=>sd[id]=(sd[id]||0)+1);
    const ch_=o=>Object.keys(o).map(id=>`<span class="chip">${esc(D.cards[id].n)}${o[id]>1?' ×'+o[id]:''}</span>`).join('');
    return `<details class="panel"><summary class="small">지금 덱 ${ch.deck.length}/${E.deckMax(ch)}장${(ch.side||[]).length?` · 카드함 ${ch.side.length}장`:''} 보기</summary><div class="chips" style="margin-top:6px">${ch_(cnt)}</div>${(ch.side||[]).length?`<span class="eyebrow" style="margin-top:6px">카드함</span><div class="chips">${ch_(sd)}</div>`:''}</details>`};
  /* 새 장비·새 카드: 받기 전에 고른다 (장비가 몰래 바뀌지 않게) */
  function vOffer(){

    if((ch.gearOffers||[]).length&&!ch.packOffer){
      const it=ch.gearOffers[0],cur=ch.gear[it.slot],df=fxDiff(it,cur);
      return sheet(`<span class="eyebrow">새 장비 · ${D.slots[it.slot]}${ch.gearOffers.length>1?` · 남은 ${ch.gearOffers.length}개`:''}</span><h2>${esc(it.n)}</h2>
        <div class="cmp"><div class="panel stack" style="gap:4px"><span class="eyebrow">지금 장착 중</span><b>${cur?esc(cur.n):'없음'}</b><span class="mono small dim">${cur?esc(cur.e||''):''}</span></div>
          <div class="panel stack" style="gap:4px;border-color:var(--gold)"><span class="eyebrow">새 장비</span><b>${esc(it.n)}</b><span class="mono small" style="color:var(--gold)">${esc(it.e||'')}</span>${it.t?`<span class="small dim" style="line-height:1.55">${esc(it.t)}</span>`:''}</div></div>
        <div class="mono small">바꾸면 · ${df||'능력치 변화 없음'}</div>
        <button class="btn primary" data-a="gwear">장착한다${cur?` · ${esc(cur.n)}은(는) 보관함으로`:''}</button>
        <button class="btn" data-a="gkeep">보관함에 넣어 둔다</button>
        <p class="small dim">보관함의 장비는 전투 밖이면 언제든 가방 → 장비에서 바꿔 낄 수 있다.</p>`,'offer',false);
    }
    if(ch.packOffer){const P=ch.packOffer,cnt={};P.cards.forEach(id=>cnt[id]=(cnt[id]||0)+1);
      return sheet(`<span class="eyebrow">전용 책장 · ${P.cards.length}장</span><h2>${esc(P.n)}으로 덱을 바꿀까</h2>
        <div class="check" style="border-color:var(--bleed)"><b class="bad">주의 · 덱이 통째로 바뀐다</b><br>바꾸면 지금 덱 ${ch.deck.length}장과 카드함 ${(ch.side||[]).length}장이 '${esc(ch.packName||'기본 카드팩')}'으로 가방의 카드팩 보관함에 남는다. 새 팩은 덱이 고정되고 새 카드는 돈으로 받는다. 보관한 팩은 가방의 카드팩 탭에서 전투 밖이면 언제든 바꿔 끼울 수 있다.</div>
        ${P.e?`<div class="check"><b>패시브</b> · ${esc(P.e)}</div>`:''}
        <div class="invcards">${Object.keys(cnt).map(id=>cardRow(id,cnt[id]>1?`<span class="mono small dim">×${cnt[id]}</span>`:'')).join('')}</div>
        <button class="btn${UI.packAsk?' primary':''}" data-a="packyes">${UI.packAsk?'정말 바꾼다 (이전 덱은 보관된다)':'이 책장으로 바꾼다'}</button>
        <button class="btn primary" data-a="packno">지금 덱을 지킨다</button>
        <p class="small dim">지금 덱을 지키면 이 책장은 사라진다. 다른 전리품은 그대로 받는다.</p>`,'offer',false)}
    if((ch.picks||[]).length&&!(ch.offers||[]).length){const g=ch.picks[0];
      return sheet(`<span class="eyebrow">카드 발견 · ${g.length}장 가운데 하나${ch.picks.length>1?` · 남은 묶음 ${ch.picks.length}`:''}</span><h2>하나를 고른다</h2>
        <div class="invcards">${g.map((id,j)=>cardRow(id,`${ownTag(ch,id)}<button class="chip" data-a="pkpick" data-i="${j}">이 카드를 고른다</button>`)).join('')}</div>
        ${myDeck(ch)}
        <button class="btn quiet" data-a="pkskip">모두 버린다</button>
        <p class="small dim">고른 카드는 다음 화면에서 덱에 넣거나 카드함에 둘 수 있다.</p>`,'offer',false)}

      <div class="invcards">${ch.deck.map((id,j)=>cardRow(id,D.cards[id].fixed?'<span class="small dim">전용 · 바꿀 수 없다</span>':`<button class="chip" data-a="oswap" data-i="${j}">이 카드와 바꾼다</button>`)).join('')}</div>

      <button class="btn" data-a="otake" data-i="side">카드함에 넣어 둔다</button>
      <button class="btn quiet" data-a="odrop">버린다</button>`,'offer',false);
  }
  /* 공방: 등급별 목록. 들어갈 수 없는 등급은 조건을 보여 준다 */

  /* 공방 치유소 · 암시장 K사 엠플 */

    return `<div class="panel stack" style="gap:8px"><div class="row between"><b class="serif">치유소</b><span class="mono" style="color:var(--gold)">${E.money(cp)} · 이번 방문 ${n}/${K.max}</span></div>
      <p class="small dim">돈을 내고 상처를 치료한다. 한 번에 HP ${K.hp} 회복. 치료를 받을 때마다 값이 ${E.money(K.step)}씩 오른다 (이번 판 ${ch.healBought||0}번 받음).</p>
      ${UI.healMsg?`<p class="good small">${esc(UI.healMsg)}</p>`:''}
      <button class="btn" data-a="heal" ${ok?'':'disabled'}><b>치료 받는다</b><span class="mono small dim">HP ${ch.hp}/${ch.stats.maxHp}${full?' · 이미 멀쩡하다':left<=0?' · 오늘은 더 받을 수 없다':ch.money<cp?' · 돈이 모자란다':''}</span></button></div>
    ${hwHome()?'':`<div class="panel stack" style="gap:8px;border-color:var(--bleed)"><div class="row between"><b class="serif">${A.name}</b><span class="mono" style="color:var(--gold)">${E.money(ap)}</span></div>
      <p class="small dim">암시장에서 도는 전리품. 전투 중 HP가 최대 HP의 ${Math.round(A.belowPct*100)}% 이하가 되면 자동으로 쓰여 최대 HP의 ${Math.round(A.healPct*100)}%를 회복한다. 한 번에 쓰러질 만한 피해를 받으면 쓰러지기 전에 먼저 쓰이고(받은 피해만큼 회복이 줄어든다), 전투 중 횟수 제한 없이 한 번에 1개씩 쓰이고, 최대 ${A.carry}개까지 지닌다. 쓰고 나면 다음 공방에서 다시 살 수 있다. ${ch.infinite?`2막 무한 모드에서는 구매 횟수 제한이 없고 값이 ${E.money(A.priceInf)}이다.`:`한 판에 모두 ${A.limit}개까지만 살 수 있다 (2막 무한 모드에 들어서면 제한이 없어지고 값이 ${E.money(A.priceInf)}이 된다).`}</p>
      <button class="btn" data-a="ample" ${aok?'':'disabled'}><b>${A.name} 구입</b><span class="mono small dim">지닌 수 ${have}/${A.carry} · 산 수 ${bought}${ch.infinite?' (제한 없음)':'/'+A.limit}${bought>=A.limit&&!ch.infinite?' · 더는 살 수 없다':have>=A.carry?' · 더는 지닐 수 없다':ch.money<ap?' · 돈이 모자란다':''}</span></button></div>`}`;
  }
  function vShop(){
    const ch=G.ch,acc=E.shopAccess(ch),A=D.access;
    /* 입장 조건 문구: 그 등급을 주는 소속 / (한 등급 낮은 소속 또는 무소속) + 해결사 급수 보너스 */
    const need=g=>{
      const nm=f=>Object.entries(A.aff).filter(([,v])=>f(v)).map(([k])=>T.affTypes[k]);
      const direct=nm(v=>v>=g),low=nm(v=>v<g&&v+A.rankBonus.plus>=g),rk=`${T.licensed} ${A.rankBonus.rank}${T.rankUnit} 이상`;
      const parts=[];if(direct.length)parts.push(direct.join('·')+' 소속');
      if(A.base+A.rankBonus.plus>=g)parts.push(rk);else if(low.length)parts.push(`${low.join('·')} 소속이면서 ${rk}`);
      return parts.join(', 또는 ');
    };
    const shops=D.workshops.map(w=>{
      const open=w.grade<=acc;
      const items=Object.entries(D.items).filter(([,it])=>it.grade===w.grade).filter(([id,it],_i,all)=>!hwHome()||all.filter(([,x])=>x.slot===it.slot).sort((a,b)=>a[1].price-b[1].price)[0][0]===id).map(([id,it])=>{
        const st=E.canBuy(ch,id),cur=ch.gear[it.slot];
        const note=st==='owned'?'장착 중':st==='stash'?'보관 중':st==='money'?'돈이 모자란다':st==='distort'?'뒤틀린 몸 · 장비를 쥘 수 없다':st==='nwing'?'N사 날개 · 의체를 쓰지 않는다':st==='locked'?'잠김':`${D.slots[it.slot]} 교체${cur?' · 지금 '+esc(cur.n):''}`;
        if(UI.buyAsk===id&&st==='ok')return `<div class="panel stack" style="gap:8px;border-color:var(--gold)"><div class="row between"><b>${it.n}</b><span class="mono" style="color:var(--gold)">${E.money(E.priceOf(ch,id))}</span></div><span class="mono" style="color:var(--gold)">${it.e}</span><span class="small dim">${D.slots[it.slot]}${cur?' · 지금 '+esc(cur.n)+'은(는) 보관함으로 간다':''} · 이 장비를 맞출까?</span><div class="row" style="gap:8px"><button class="btn primary" data-a="buyok" data-i="${id}">맞춘다</button><button class="btn quiet" data-a="buyno">취소</button></div></div>`;
        return `<button class="btn" data-a="buy" data-i="${id}" ${st==='ok'?'':'disabled'}><span class="row between"><b>${it.n}</b><span class="mono" style="color:var(--gold)">${E.isWs(ch)?`<s class="dim">${E.money(it.price)}</s> `:''}${E.money(E.priceOf(ch,id))}</span></span>
          <span class="mono" style="color:var(--gold)">${it.e}</span><span class="mono small dim">${D.slots[it.slot]} · ${note}</span></button>`;
      }).join('');
      return `<div class="panel stack" style="gap:8px${open?'':';opacity:.6'}"><div class="row between"><b class="serif">${hwHome()?HWSHOP[w.grade-1][0]:w.n}</b><span class="chip${open?'':' dim'}">${w.grade}등급${open?'':' · 잠김'}</span></div>
        <p class="small dim">${hwHome()?HWSHOP[w.grade-1][1]:w.t}${open?'':' 들어가려면 '+need(w.grade)+'.'}</p>${open?`<div class="stack">${items}</div>`:''}</div>`;
    }).join('');
    const gear=Object.entries(D.slots).map(([k,n])=>`<span class="chip">${n} · ${ch.gear[k]?esc(ch.gear[k].n):'없음'}</span>`).join('');
    return `${vHud()}<div class="moneybar"><span>자산</span><b class="mono">${E.money(ch.money)}</b></div><div class="stack" style="gap:6px"><div class="eyebrow">${hwHome()?'홍원의 저잣거리':'공방'} · 내 등급 ${acc}</div><h2>무엇을 맞출까</h2>
      <div class="chips">${gear}</div>${UI.bought?`<p class="good small">${esc(UI.bought)}을(를) 맞췄다.</p>`:''}</div>${shops}${vClinic()}${vBlack()}${vSell()}${vSwapCard()}${vTune()}
      <button class="btn primary" data-a="unshop">${hwHome()?'저잣거리를 나간다':'공방을 나간다'}</button>`;
  }
  /* 공방 해결사: 보관함 장비 판매 */
  function vSell(){
    const ch=G.ch;if(!E.isWs(ch))return '';const st=ch.stash||[];
    return `<div class="panel stack" style="gap:8px"><div class="row between"><b class="serif">보관함 팔기</b><span class="chip">공방 해결사</span></div>
      <p class="small dim">보관함에 있는 장비를 공방에 넘긴다. 장착 중인 장비는 팔 수 없다.</p>
      ${UI.sold?`<p class="good small">${esc(UI.sold)}</p>`:''}
      ${st.length?st.map((g,i)=>`<button class="btn" data-a="sell" data-i="${i}"><span class="row between"><b>${esc(g.n)}</b><span class="mono" style="color:var(--gold)">+${E.money(E.sellValue(g))}</span></span><span class="mono small dim">${D.slots[g.slot]} · ${esc(g.e||'')}</span></button>`).join(''):'<p class="small dim">보관함이 비어 있다.</p>'}</div>`;
  }
  /* 공방: 카드 교환 (방문마다 swapMax장까지, 일반 보상 카드 무작위로) */
  function vSwapCard(){
    if(G.ch.deckLocked||G.ch.cardMoney)return `<div class="panel stack" style="gap:6px"><b class="serif">카드 교환</b><p class="small dim">${G.ch.deckLocked?'덱이 고정되었다':'전용 검술을 익힌 몸이다'}. 카드를 바꿀 수 없다.</p></div>`;
    const ch=G.ch,S=CFG.shop,sw=UI.swapped||[],left=S.swapMax-sw.length,can=left>0&&ch.money>=S.swapCost;
    return `<div class="panel stack" style="gap:8px"><div class="row between"><b class="serif">카드 교환</b><span class="mono" style="color:var(--gold)">${E.money(S.swapCost)} · 이번 방문 ${sw.length}/${S.swapMax}</span></div>
      <p class="small dim">덱의 카드 한 장을 일반 전투에서 얻을 수 있는 카드 중 무작위 한 장으로 바꾼다. 무엇이 나올지는 모른다. 공방에 들를 때마다 ${S.swapMax}장까지.</p>
      ${sw.length?`<p class="good small">${sw.map(([a,b])=>`${esc(a)} → ${esc(b)}`).join(' · ')}</p>`:''}
      ${left>0?`<div class="chips">${ch.deck.map((id,i)=>D.cards[id].fixed?'':`<button class="chip" data-a="swapcard" data-i="${i}" ${can?'':'disabled'}>${D.cards[id].n} ⇄</button>`).join('')}</div>`:''}
      ${left>0&&!can?'<p class="small dim">돈이 모자란다.</p>':''}${left<=0?'<p class="small dim">이번 방문에는 더 바꿀 수 없다.</p>':''}</div>`;
  }
  /* 공방: 장비 정비 (장착 장비마다 최대 tune.max번, chance% 확률로 공격 또는 회피 +1) */
  function vTune(){
    const ch=G.ch,T=Object.assign({},CFG.shop.tune,{max:E.tuneMax(G.ch)}),slots=Object.keys(ch.gear).filter(k=>ch.gear[k]);
    const rows=slots.map(k=>{const g=ch.gear[k],n=g.tries||0,mx=E.tuneMax(ch,g),full=n>=mx,cost=E.tuneCost(g),tn=g.tune||{},ok=!full&&ch.money>=cost&&(!ch.distForm||ch.distStable);
      return `<div class="stack" style="gap:4px;border-top:1px solid var(--line,#2a2f3a);padding-top:6px"><div class="row between"><b>${esc(g.n)}</b><span class="mono small dim">정비 ${n}/${mx}${tn.atk||tn.eva?` · 공격+${tn.atk||0} 회피+${tn.eva||0}`:''}</span></div>
        ${full?'<p class="small dim">더는 정비할 수 없다.</p>':`<div class="row" style="gap:8px"><button class="btn" style="flex:1" data-a="tune" data-i="${k}" data-s="atk" ${ok?'':'disabled'}><b>공격 +1 시도</b><span class="mono small" style="color:var(--gold)">${E.money(cost)}</span></button><button class="btn" style="flex:1" data-a="tune" data-i="${k}" data-s="eva" ${ok?'':'disabled'}><b>회피 +1 시도</b><span class="mono small" style="color:var(--gold)">${E.money(cost)}</span></button></div>`}</div>`}).join('');
    return `<div class="panel stack" style="gap:8px"><div class="row between"><b class="serif">장비 정비</b><span class="chip">${T.chance}% 성공</span></div>
      <p class="small dim">장착한 장비 하나에 공격 또는 회피 +1을 시도한다. 성공하면 고른 쪽만 오르고, 실패해도 시도 횟수는 소모된다. 장비마다 ${T.max}번까지.${ch.flags&&ch.flags.beatZena?` 제나를 쓰러뜨린 뒤로는 장비마다 ${CFG.shop.tune.zenaPlus}번씩 더 늘어난다. 바랄·제나의 장비는 기본 횟수만 정비할 수 있다.`:''}</p>
      ${UI.tuneMsg?`<p class="${UI.tuneMsg.ok?'good':'bad'} small">${esc(UI.tuneMsg.t)}</p>`:''}
      ${ch.distForm&&!ch.distStable?'<p class="small dim">뒤틀린 몸은 장비를 쥘 수 없다.</p>':rows||'<p class="small dim">장착한 장비가 없다.</p>'}</div>`;
  }
  function vRules(){
    return `<details><summary>규칙 요약</summary><ul>
      <li><b>출생</b> 출신·재능·결점·무기·색을 1d100으로 정한다. 색은 직접 바꿀 수 있다.</li>
      <li><b>성장기</b> ${D.childhood.stages.map(s=>s.age+'세').join('·')}에 1d100으로 성장표를 굴려 능력치가 하나씩 자란다. ${CFG.startAge}세부터 직접 산다.</li>
      <li><b>사건</b> 해마다 사건 하나. 주사위 판정(1d100 + 능력치 + 판정 보정 ≥ 난이도)이 있는 선택과 결과가 정해진 선택이 있다.</li>
      <li><b>출신 진로</b> 어떤 출신은 특정 진로(${Object.values(T.paths).join('·')})에 보정이 붙는다. 그 진로에 들어가는 판정에 보정값을 더하고, 그 진로의 권유 사건이 더 자주 찾아온다.</li>
      <li><b>소속</b> 권유 사건으로 일찍 들어가거나, ${CFG.affiliationYear}년차 갈림길에서 고른다. ${T.licensed}면 ${T.affTypes.office}에 바로 들어가거나 ${T.affTypes.assoc} 심사를 볼 수 있고, ${T.affTypes.wing} 입사 시험과 ${T.affTypes.finger}의 문은 누구에게나 열려 있다. 소속에 따라 전용 사건이 생긴다.</li>
      <li><b>명중</b> 1d100 + 공격 + 카드 보정 &gt; 상대 1d100 + 회피면 명중, 동점은 방어 성공. 일부 카드·무기는 명중을 두 번 굴려 높은 값을 쓴다.</li>
      <li><b>피해</b> 카드의 d6 개수만큼 굴려 합산. 코스트가 높은 카드는 주사위가 많다.</li>
      <li><b>순서</b> 라운드마다 1d100 + 속도. 1등은 빛 +${CFG.orderBonusLight}, 격차 ${CFG.gapFirst} 이상이면 첫 공격 명중 +${CFG.firstHit}. 뒤처지면 다음 라운드 순서 +${CFG.catchupBonus}.</li>
      <li><b>방어 자세</b> 카드를 하나도 내지 않으면 그 라운드는 회피 대신 방어로 받는다. 막으면 피해 ${CFG.guard.guardHit}, 못 막으면 피해 ×${CFG.guard.guardFailMul}. 다음 라운드 명중 +${CFG.guard.nextHit}${CFG.guard.lightUp?`, 그 전투 동안 빛과 빛 최대치 +${CFG.guard.lightUp}(최대 +${CFG.guard.lightUpMax})`:''}${CFG.guard.lightNext?`, 다음 라운드 빛 +${CFG.guard.lightNext}`:''}.</li>
      <li><b>빛</b> 라운드마다 ${CFG.light}. 남은 빛으로 손패 카드를 원하는 순서로 낸다. 남긴 빛은 사라진다.</li>
      <li><b>${D.keywords.bleed.n}</b> 공격할 때마다(빗나가도) 스택만큼 피해, 그 뒤 1 감소. 내가 방어 자세면 절반으로 지혈. <b>${D.keywords.rupture.n}</b> 피격 시 스택만큼 추가 피해, 피격마다 1 감소. <b>${D.keywords.ink.n}</b> 라운드가 끝날 때 스택당 ${CFG.ink.dmg} 피해(내가 받으면 ${CFG.ink.dmgMe}), 그 뒤 스택이 절반으로 줄어든다. 최대 ${CFG.ink.cap}스택. <b>${D.keywords.burn.n}</b> 라운드가 끝날 때 스택당 ${CFG.burn.dmg} 피해(내가 받으면 ${CFG.burn.dmgMe}), 그 뒤 스택이 절반으로 줄어든다. 최대 ${CFG.burn.max}스택이고, 적이 거는 화상은 쌓이는 양이 절반이다. <b>${D.keywords.flame.n}</b>(레바테인 전용) 받는 피해 ×1.5, 라운드 끝에 1 감소. ${CFG.laev.blueAt}스택 이상이면 <b>푸른 화염</b>이 되어 받는 피해 ×${CFG.laev.blueMul}, 라운드 끝에 스택당 ${CFG.laev.blueDot} 피해를 주고 1 감소한다. 일반 디버프 스택의 최대치는 ${CFG.stackCap}이다. <b>${D.keywords.breath.n}</b> 최대 ${CFG.breath.cap}, 라운드마다 ${CFG.breath.decay} 줄어든다. 4~9는 치명 ${CFG.breath.base}%에서 90%까지(×${CFG.critMult}), ${CFG.breath.sure} 이상은 확정 치명, 1~${CFG.breath.evaMax}는 회피 +${CFG.breath.eva}. 방어 카드를 내면 내 출혈·파열이 1/4 줄어든다(적도 같다).</li>
      <li><b>성장</b> 판정 성공 ${CFG.xp.ok}, 실패 ${CFG.xp.fail}, 판정 없는 선택 ${CFG.xp.plain}, 전투 승리 ${CFG.xp.win} 경험치. 레벨이 오르면 성장표를 1d100으로 세 번 굴려 하나를 고른다.</li>
      <li><b>${T.licensed}</b> 자격 시험, 계약, 견습으로 ${T.rankStart}${T.rankUnit}에 등록된다. 소속이 없거나 ${T.affTypes.office} 소속이면 전투에서 이긴 뒤 소문 판정(1d100 + ${T.paths.fixer} 진로 보정 ≥ ${CFG.winLicenseDc})으로도 등록된다. 고정 전투(${Object.keys(D.fixedFights).join('·')}년차)에서 이기면 2${T.rankUnit}씩 ${T.promote}한다.</li>
      <li><b>손가락 서열</b> ${Object.entries(D.fingers).map(([n,F])=>`${n}: ${F.ranks.map(r=>r.branch?r.branch.map(b=>b.n).join('/'):r.n).join(' → ')}`).join(' · ')}. 고정 전투 승리나 승급 사건으로 오르고, 오를 때마다 보정을 받는다. 서열 ${D.fingerRules.shopTier}단계 이상이면 공방 등급 +1.</li>
      <li><b>인연 · 가족</b> ${CFG.bond.from}년차부터 일상 속에서 인연을 만난다. 결혼하면 최대 HP·정신력·판정이 오르고 아이가 생길 수 있다. 결혼한 뒤에는 <b>금기 실험이나 금기 사건을 한 번이라도 저지르면</b> 그 다음 해부터 해마다 ${CFG.bond.dieChance}% 확률로 배우자가 세상을 떠난다(최대 정신력 −${CFG.bond.lossMind}, 영구). 결혼한 채 히든 보스를 이길 때마다 이 확률이 +${CFG.bond.riskStep}%p 쌓인다. 배우자가 죽어도 아이는 남는다. 히든 보스의 전리품 「엘레나의 처방전」을 가지면 이 확률이 절반이 된다.</li>
      <li><b>특이점 강화 · 금기 실험</b> 특이점은 강화를 ${CFG.corp.upMax}번까지만 할 수 있다. 그보다 더 오르지 않는다. 금기 실험은 별개로 ${CFG.corp.forbMax}번까지 할 수 있고, 큰 강화를 주는 대신 정신력이 깎이고 결혼 중이면 위의 배우자 사망 위험이 붙는다. 금기 실험을 ${CFG.corp.forbMax}번 채우면 머리가 ${D.enemies.claw.n}과 ${D.enemies.arbiter.n}를 보낸다. 둘을 이기면 보상을 한 번 받고, 그 뒤로 더 일어나는 일은 없다.</li>
      <li><b>${D.pinky.n}</b> 어느 소속에도 겹쳐 붙는 표식. ${D.pinky.e}.</li>
      <li><b>돈과 공방</b> 해마다 소속 봉급(${T.licensed}는 급수 수당 추가), 전투 현상금, 일부 사건으로 ${D.money.unit}을 번다. 공방은 ${D.workshops.map(w=>w.n).join(' · ')} 3등급이고, 소속과 급수에 따라 들어갈 수 있는 등급이 정해진다. 무기·방어구·의수 칸마다 하나씩 맞춘다.</li>
      <li><b>장비 표기</b> 공+N 공격(명중 보정) · HP+N 최대 HP · 회피·속도·판정+N 그 능력치 · D6≥N 피해 주사위 d6을 굴려 N보다 작게 나오면 N으로 친다 · 방어 카드 회피+N 방어 카드를 쓸 때 회피 추가.</li>
      <li><b>승급</b> 전투 승리(초반 ${CFG.promo.gain.early} · 중반 ${CFG.promo.gain.mid} · 보스 ${CFG.promo.gain.boss} · 히든 ${CFG.promo.gain.hidden})와 판정 성공(+${CFG.promo.gain.check})으로 진로의 포인트를 모은다(해결사 ${T.promoPoints} · 협회 ${D.careers.assoc.pts} · 날개 ${D.careers.wing.pts} · 손가락 ${D.careers.finger.pts}). 필요량에 닿으면 다음 해에 심사가 열리고, 성공하면 한 단계 오른다. 필요량은 단계마다 ×${CFG.promo.mult.join(' → ×')}씩 늘어난다. 실패하면 해결사·협회는 포인트 1/4, 날개·손가락은 1/3을 잃고, 날개는 두 번 연속 실패 시 해고, 손가락은 숙청 전투. 맨 위 단계에 오르면 특수 심사(해결사는 특색)가 한 번 열리고, 실패하면 다시 기회가 없다.</li>
      <li><b>${T.hiddenBoss}</b> 조건을 채우면 고정 전투 대신 나타난다. 금기를 어기면 머리의 집행자가, 초대장을 두 번 받아들이면 도서관이, 지령을 거역하면 대행자가 찾아온다. 특색은 ${D.hiddenBosses.find(h=>h.id==='blue').req.replace('rank<=','')}${T.rankUnit} 이상 해결사만 드물게 마주치며, ${D.hiddenBosses.find(h=>h.id==='blue').penalty.fullRank}${T.rankUnit} 미만이면 급수 부족 보정(명중·회피 ${sg(D.hiddenBosses.find(h=>h.id==='blue').penalty.atk)})을 받는다.</li>
      <li><b>${T.titleLabel}</b> ${CFG.colorRank}${T.rankUnit} ${T.licensed} 가운데 특출난 자만 받는다. ${CFG.colorRank}${T.rankUnit}에 오를 때 1d100 + 판정 보정 ≥ ${CFG.colorDc}이면 내 색과 가장 높은 능력치로 이름이 붙는다.</li>
    </ul></details>`;

  /* 플레이테스트 빌드: 종료 시각이 지나면 새 판을 시작할 수 없다 (진행 중인 판은 끝까지) */

      ${UI.confirmNew?`<p class="small bad">저장된 판이 지워진다. 정말 새로 시작하려면 ${UI.confirmNew==='daily'?'오늘의 시드':'새로 시작하기'}를 한 번 더 누른다.</p>`:''}

      <button class="btn quiet" data-a="records"><b>기록실</b><span class="dim small">만난 적 · 본 엔딩 · 해금 · 최고 기록</span></button>

      <a class="btn quiet" href="${CFG.feedbackUrl}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:inherit"><b>의견·버그 제보</b><span class="dim small">구글 폼이 새 탭에서 열린다 · 게임 버전(${UPDATES.v})을 함께 적어 주세요</span></a>

  /* 일대기: 클리어·쓰러짐 결과 화면을 판마다 자동 저장(최대 10개). 명예의 전당은 직접 고른 판만(최대 5개). 둘 다 직접 삭제할 수 있다 */
  const CHRON='cityYearChron',CHRON_LIFE=10,CHRON_FAME=5;
  const loadChron=()=>{try{const o=JSON.parse(store.get(CHRON)||'{}');return{life:Array.isArray(o.life)?o.life:[],fame:Array.isArray(o.fame)?o.fame:[]}}catch(e){return{life:[],fame:[]}}};
  const saveChron=o=>store.set(CHRON,JSON.stringify(o));
  function chronSnap(){

      ['⚡ 속도',['속도의 영향이 커졌습니다. 선공 판정이 "1d100 + 속도"에서 "1d100 + 속도×2"로 바뀌었습니다.','선공을 놓친 쪽이 받는 추격 보정은 +10에서 +5로 줄었습니다.','공격하는 쪽의 속도가 상대보다 5 높을 때마다 명중이 +1 오릅니다. 최대 +4이고, 적에게도 같은 규칙이 적용됩니다.']],

      ['🩹 K사 엠플 조정',['전투 중 자동으로 HP를 크게 회복하는 효과가 너무 강하다는 의견이 있어 조정했습니다.','가격은 5,000안으로 통일했습니다. 무한 모드 이후에도 같은 값입니다.','지닐 수 있는 수는 그대로 최대 3개입니다. 한 판에 살 수 있는 수는 모두 5개로 제한됩니다.','자동으로 회복하는 양이 60에서 50으로 줄었습니다.']],
      ['🔧 버그 수정',['날개에서 해고되어도 날개를 세우는 길(특이점 개발)이 이어지던 문제를 고쳤습니다. 날개를 잃으면 개발이 중단됩니다.','직접 세운 날개의 대표가 소속이 비어 있으면 공방이 1등급으로 잠기고 해결사로 등록되던 문제를 고쳤습니다. 대표는 날개 임원과 같은 공방 등급을 받고 해결사를 겸할 수 없습니다. 이미 등록된 저장본은 다음 해로 넘어갈 때 정리됩니다.','일부 숨은 길에서 직급과 해결사 급수가 맞지 않던 문제를 고쳤습니다.']],

  const NOTICE={id:'v9.3.4-4',t:'도시의 한 해 '+VERSION+' · 새 소식',
    note:'이 공지는 업데이트 이후 처음 새로 고침한 분께 한 번만 표시됩니다. 확인을 누르면 다시 뜨지 않고, 첫 화면의 "이번 업데이트"에서 다시 볼 수 있습니다.',
    sec:[['⚔ 지구전 압박',['서로 못 쓰러뜨려 싸움이 끝없이 이어지던 문제를 막기 위해 생겼습니다. 모든 전투에 적용됩니다.','전투가 50라운드째에 들어서면 "싸움이 길어진다"는 안내가 뜹니다. 그 라운드부터 라운드가 끝날 때마다, 그 라운드에 상대에게 피해를 한 번도 주지 못한 쪽이 최대 HP의 일부를 고정 피해로 잃습니다.','피해는 50라운드째 최대 HP의 1%, 51라운드째 2%, 52라운드째 3%처럼 한 라운드마다 1%p씩 늘고 최대 25%에서 멈춥니다. 회피·방어·보호막으로 막을 수 없습니다.','그래서 회피와 방어, 회복만 쌓고 때리지 않는 쪽은 버틸 수 없고, 매 라운드 한 번이라도 맞히는 쪽이 이깁니다. 양쪽 모두 못 맞히면 둘 다 잃고, 동시에 쓰러지면 패배로 칩니다. 평소 전투는 50라운드 근처까지 가지 않아 영향이 없고, 6라운드를 버티면 이기는 시험 전투는 제외입니다.']],
    ['⚔ 후반 보스 · 무기',['일부 후반 히든 보스의 능력치와 그 전리품 무기를 조정했습니다.','검은 침묵의 장갑이 주는 카드 Furioso가 크게 강해졌습니다. 주사위 9개가 모두 3~14로 고정되고 명중 +30이 붙습니다.']],
    ['🔬 특이점 · 금기 설명',['특이점 강화는 최대 3번까지이고, 다 채우면 더 오르지 않습니다.','금기 실험은 강화와 따로 최대 8번까지 할 수 있습니다. 8번을 채우면 머리가 발톱과 조율자를 보내고, 둘을 이기면 보상을 한 번 받습니다. 이미 둘을 이긴 사람은 금기 실험마다 가끔 장비 없이 돈과 경험치를 주는 더 단단한 시험이 찾아오고, 8번째에는 확정입니다. 8번을 채우면 특이점이 2단계 더 강해집니다(2차 강화). 결혼 중에 금기를 저지르면 배우자가 죽을 위험이 붙습니다.']],
    ['🔧 수정',['엄지의 "상납 마감"이 상석 대부에게도 나오던 문제를 고쳤습니다. 이제 솔다토에게만 나오고, 카포 이상에게는 아랫사람의 몫을 두고 책임을 정하는 사건이 나옵니다.','홍원 가주의 자리에서 얻는 흑수 재갈이 카드와 전리품으로 지급되지 않던 문제를 고쳤습니다. 새로 잡는 판부터 적용됩니다.']]]};
  const V933SEC=[['🔧 버그 수정',['특이점 루트에서 금기 실험 8/8을 채워도 아무 일도 일어나지 않던 문제를 고쳤습니다. 이미 그 상태로 멈춘 저장도 다음 해로 넘어갈 때 이어집니다.','일부 출생에서 소지와의 거래 사건이 잘못 뜨던 문제를 고쳤습니다.','배경음악에서 "타탁" 하는 잡음과 이어폰에서 들리던 떨림을 줄였습니다.']]];
  const V932SEC=[['🔀 출생 변경',['이번 업데이트에 H사 루트와 R사 전용 루트가 히든 출생으로 이전됩니다. "아무것도 없는 존재"로 시작하면 100% 나오던 운명 선택이 출생으로 넘어갑니다. 이제 출생 굴림에서 직접 나오며, 재능·결점·성장기도 그 출생에 맞는 것으로 정해집니다.','"어떤 출생 보정도 없이 시작한다"를 고르면 운명 선택 없이 아무것도 없는 존재로 시작합니다. 대신 빈손 보정(히든 보스 전리품 장비 확률 +25%p, 정신이 꺾일 때 E.G.O 형상이 보일 확률 25%)을 받습니다.','출생이 추가되었습니다.']],
    ['🔧 그 밖의 변경',['카드 보상 화면에서 카드마다 이미 가진 장수(보유 ×N)나 새 카드 표시가 나오고, 지금 덱과 카드함을 펼쳐 볼 수 있습니다.','가방의 카드 목록에서 키워드 필터를 누르면 그 색으로 채워지고 ✓가 붙어, 켜져 있는지 바로 보입니다.','2막·무한 모드에서 공방 거리의 "다음 기회"가 55년차로 잘못 나오던 문제를 고쳤습니다.','R사 밸런스 패치: R사 부화장 출생도 이제 공방을 쓸 수 있습니다. 부화장을 나온 뒤에는 R사 보급 구역, 탈주한 뒤에는 뒷골목 공방이 열립니다.']]];
  const V910SEC=[['🌀 뒤틀림 안정화',['뒤틀리면 장비는 보관함으로 가고 카드팩은 뒤틀린 카드팩으로 고정됩니다. 정신력은 "???"로 바뀌어 이점도 불이익도 없고, E.G.O 장비는 얻을 수 없습니다.','뒤틀린 뒤 2년마다 40% 확률로 "뒤틀림이 가라앉는다"가 나옵니다. 안정화되면 장비와 카드팩을 다시 쓸 수 있고, 뒤틀림을 다루는 더 강한 카드로 이루어진 "더 강해진 뒤틀린 카드팩"을 얻습니다. 부풀려진 능력치는 그대로입니다.','선택지 이름이 "정신을 붙잡는다" · "나는 나로서 새로운 모습을 받아들인다"로 바뀌었습니다.']],
    ['🔧 그 밖의 변경',['엄지의 서열 이름 "소토카포"를 "언더보스"로 바꿨습니다. 솔다토 → 카포 → 언더보스 → 대부 순서입니다. 카포의 바로 윗서열입니다.','후반의 어떤 보스를 쓰러뜨린 뒤에는 공방 장비 정비 횟수가 장비마다 10번 늘어납니다. 그 보스들이 주는 장비는 기본 횟수만 정비할 수 있습니다. 일부 후반 보스의 능력치를 올렸습니다.']]];
  const V900SEC=[['🆕 v9.0.0 카드팩 시스템',['가방에 "카드팩" 탭이 생겼습니다. 기본 4장으로 시작하는 기본 카드팩 3개(이름을 바꿀 수 있습니다)와 출신 카드팩이 보관됩니다. 전투 밖에서는 횟수 제한 없이 바꿔 끼울 수 있고, 전투 중에는 바꿀 수 없습니다.','전용 카드팩을 받아 덱이 통째로 바뀌어도 이전 덱이 보관함에 남아, 실수로 바꿨어도 되돌릴 수 있습니다.','출신 보정 카드는 출신 카드팩에만, 의수·승진·궁니르 같은 소속 카드는 그 소속의 팩에만 들어갑니다. E.G.O 같은 고정 카드는 모든 팩에 따라갑니다.','보상 카드는 편집할 수 있는 모든 팩(기본 카드팩 3개, 고정 없는 출신 팩)에 복사됩니다. 전용 카드팩이나 덱 고정 중에는 돈과 함께 카드도 받아 기본 카드팩에 보관합니다.']],
    ['🆕 그 밖에 새로 들어온 것',['"?" 설명 창: 전투 중에도 카드 읽는 법, 키워드(최대 스택 포함), 규칙을 볼 수 있습니다.','일대기·명예의 전당, 기록실 판 통계, 오늘의 시드 도전 기록, 첫 화면으로 가는 버튼이 생겼습니다.','홍원: 재갈로 얻은 흑수도 카드를 주고, 흑수 카드가 크게 강해졌습니다. 소지의 도 "성도"는 무기가 아닌 전리품(패시브)입니다. 개화 · 일격의 주사위가 6개로 늘었습니다.']],
    ['🔧 수정',['같은 시드면 해금 상태와 상관없이 같은 타고난 것이 나옵니다. 지난 날 오늘의 시드를 번호로 입력해도 그날 지정이 적용됩니다.','"균열이 닫혔다" 엔딩 뒤에는 균열 고정 피해가 없고 적 공격 상한이 높아집니다. 최고 서열 엄지에게 "윗선의 시험"이 나오지 않고, 하인의 방패 보호막은 6에서 3으로 낮췄습니다.']]];
  const V731SEC=[['🩹 치유소와 K사 엠플',['공방 거리에 치유소가 생겼습니다. 500안을 내면 HP 30을 회복합니다. 한 번 들를 때 3번까지 받을 수 있습니다.','K사 엠플을 공방에서 살 수 있습니다. 3,500안, 최대 3개까지 지닙니다.','전투 중 HP가 30 이하가 되면 자동으로 쓰여 HP를 60 회복합니다. 전투마다 1개까지 쓰이고, 쓰고 나면 다음 공방에서 다시 살 수 있습니다. 무한 모드 이후에는 값이 20,000안으로 오릅니다.']],
      ['🏢 소속 직접 선택',['날개 입사와 협회 입회 때 들어갈 곳을 직접 고릅니다. 날개 6곳, 협회 8곳 중에서 고를 수 있습니다.','사무소 견습에 성공하면 초반 사무소 4곳(윤 · 가로등 · 갈고리 · 새벽) 중에서 고릅니다. 실패해도 윤 사무소나 가로등 사무소 중 한 곳에 무작위로 들어갑니다.','초반 사무소 4곳은 해결사 급수와 상관없이 갈림길과 "사무소 문을 두드린다"에서 고를 수 있습니다.','전용 책장이 없는 K사 · J사 · G사 날개는 카드팩 대신 입사 때 보정치를 더 받습니다. 덱은 일반 카드로 꾸립니다.']],
      ['⚙ 설정과 자동 전투',['타이틀과 출생을 제외한 모든 화면의 오른쪽 위에 설정 버튼(⚙)이 생겼습니다. 어느 화면에서든 연출과 전투 간격을 바꿀 수 있습니다. 자동 전투 중에 열면 전투가 멈추고, 닫으면 이어집니다.','자동 전투 간격이 느림 · 보통 · 조금 빠름 · 빠름 네 단계가 되었습니다. 보통을 이전보다 느리게 했습니다.']],
      ['🩸 파열 · 화상',['파열의 최대 스택이 10에서 20으로 늘었습니다. 출혈은 그대로입니다.','리우 협회 전용 카드에 화상 카드 5장을 추가했습니다.']],
      ['💍 인연 · 가족',['8년차부터 일상 속에서 인연을 만날 수 있습니다. 이름은 직접 정합니다. 만났을 때 지나치면 그 판에서는 인연이 오지 않습니다.','인연이 이어지면 청혼까지 사건이 오고, 결혼하면 보정을 받습니다. 결혼 전에 놓치면 상대가 떠납니다.','결혼 뒤에는 배우자의 죽음이 올 수 있습니다. 금기를 저지르면 그다음 해부터 해마다 2%의 위험이 생기고, 히든 보스를 이길 때마다 위험이 0.1%씩 쌓입니다.','결혼 뒤에는 아이가 태어납니다. 아이는 함께 나이를 먹다가 20세에 사무소, 해결사, 협회 중 한 곳에 들어갑니다. 배우자도 결혼한 햇수에 따라 급수가 오르고, 내가 특색 심사나 최고 직급 심사에 실패하면 배우자가 대신 승급합니다.','뒤틀린 뒤에는 가장 강한 가족(배우자 또는 아이)이 토벌 의뢰로 찾아옵니다. 가족은 내 카드를 그대로 쓰고, 능력치는 내 능력치의 1.1배, 최고 급수는 1.5배로 맞서 옵니다.','아이가 있으면 엔딩마다 추가 문구가 붙습니다.']],
      ['🌤 일상 사건',['3년차부터 능력치가 오르는 안정적인 일상 사건이 열립니다. 한 판에 최대 10번입니다.']],
      ['⚡ 충전 · W사 날개 / R사 날개',['입사하면 충전 전용 책장 8장을 받고, 최고 직급에 오르면 4코스트 카드 2장을 얻어 10장이 됩니다.','충전은 쌓아 두었다가 카드로 소모하면 고정 피해가 붙는 자원입니다.','W사 날개는 라운드마다 충전이 쌓이는 저장형입니다. 맞아도 충전이 줄지 않습니다.','R사 날개는 입사 때 1d3으로 토끼팀, 순록팀, 코뿔소팀이 정해지고, 팀마다 전용 책장과 패시브가 다릅니다.']],
      ['🔨 N사 날개 · 못과 흐트러짐',['N사 날개는 적중할 때마다 상대에게 못이 쌓입니다. 3코스트·4코스트 망치 카드는 쌓인 못을 흐트러짐으로 바꿉니다.','흐트러짐이 쌓일수록 상대가 약해집니다. 3 · 6 · 10에서 단계가 오르고, 상대의 명중이 −8 · −15 · −20 줄며 주는 피해는 줄고 받는 피해는 늘어납니다.','흐트러짐이 상대 등급별 한계에 닿으면 다음 라운드에 기절합니다.','N사 날개는 의체를 쓰지 않습니다.']],
      ['🌊 침잠 · 일반 카드',['상대에게 쌓으면 3스택마다 상대의 명중과 주는 피해가 줄어듭니다. 라운드가 끝나면 1씩 줄어듭니다. 일반 보상 카드 8장이 추가되었습니다.']],
      ['🖐 손가락 개편',['중지: 되갚음 스택 1당 받는 피해가 2 줄어들고, 다음 적중에서 스택을 쓰면 소모한 스택 1당 HP를 1 회복합니다. 대신 되갚음의 추가 피해는 스택당 1로 줄었습니다.','약지: 적중할 때마다 "작품"이 쌓여 명중이 오르고, 가득 차면 다음 적중이 강해집니다. 예술적 감각은 확률이 아니라 적을 3번 쓰러뜨릴 때마다 오릅니다.','소지: 표식을 가진 사람에게 5년마다 사건이 열립니다.']],
      ['🎭 출생',['출생 화면의 출신 · 재능 줄과 성장기 사이에 "다시 태어난다" 버튼이 하나 더 생겼습니다.','출생 화면 맨 아래의 "어떤 출생 보정도 없이 시작한다"를 누르면 출신 · 재능 · 결점 · 무기 · 타고난 것 없이 시작합니다. 성장기 보정만 남고, 맨손에 기본 덱 4장으로 출발합니다.','이 상태로 제 1막을 넘기면 전용 엔딩이 있습니다.']],
      ['📖 기록실',['각 칭호의 최고 등급에 오를 때마다 횟수가 쌓입니다. 기록실에서 "본부 직속 ×44"처럼 몇 번 도달했는지 볼 수 있습니다. 아직 얻지 못한 칭호는 ???로 표시됩니다.','엔딩이 4종 늘어 기록실의 엔딩이 7종에서 11종이 되었습니다. 인연 · 가족과 출생 보정 없이 시작하는 길에서 볼 수 있습니다.']],
      ['🔧 그 밖',['오늘의 시드를 날짜마다 다른 출생으로 정할 수 있게 되었습니다.','히든 요소가 몇 가지 더 늘었습니다.','첫 화면의 "지금 고민 중인 방향"을 최신 내용으로 고쳤습니다.']],
      ['🙏 감사합니다',['의견을 주신 모든 분들께 감사드립니다.']]];

      ['🏢 날개',['전용 책장이 없는 K사 · J사 · G사 날개는 카드팩 대신 입사 때 보정치를 더 받습니다. 덱은 일반 카드로 꾸립니다.','날개를 세우면 직급 표시가 "날개 대표"로 바뀝니다.']],

  const V721SEC=[['🩹 치유소와 K사 엠플',['공방 거리에 치유소가 생겼습니다. 500안을 내면 HP 30을 회복합니다. 한 번 들를 때 3번까지 받을 수 있습니다.','K사 엠플을 공방에서 살 수 있습니다. 3,500안, 최대 3개까지 지닙니다.','전투 중 HP가 30 이하가 되면 자동으로 쓰여 HP를 60 회복합니다. 전투마다 1개까지 쓰이고, 쓰고 나면 다음 공방에서 다시 살 수 있습니다.','무한 모드 이후에는 값이 20,000안으로 오릅니다.']],
      ['🖐 손가락 직접 선택',['손가락에 들어갈 때 소지를 뺀 네 손가락(엄지·검지·중지·약지) 중에서 직접 고릅니다.','선택 화면에 각 손가락의 서열과 패시브가 표시됩니다. 검지의 마지막 서열은 "대행자 / 전령"으로 표기합니다. 약지의 첫 서열은 "스튜던트"입니다.']],
      ['🏢 날개·협회 직접 선택',['날개 입사와 협회 입회 때 들어갈 곳을 직접 고릅니다. 날개 6곳, 협회 8곳 중에서 고를 수 있습니다.','날개 임원(최고 직급)에 오르면 공방 3등급(명장)이 열립니다. 이전에는 해결사 급수가 오르지 않아 열리지 않았습니다.','직접 세운 날개가 승진·엔딩에서 입사한 회사 이름으로 보이던 문제를 고쳤습니다.']],
      ['🔥 화상 개편',['화상: 라운드가 끝날 때 스택당 3 피해(내가 받으면 2), 최대 15스택, 그 뒤 스택은 절반이 남습니다. 적이 거는 화상 스택은 절반으로 들어옵니다.','이전의 "화상 대상 추가 피해 ×1.5"는 사라졌습니다. 호흡과 효과가 겹쳤기 때문입니다.','레바테인의 붉은 화염과 푸른 화염은 화상과 별개로 분리했습니다. 레바테인 전용입니다.','카드의 화상이 걸리지 않던 문제를 고쳤습니다.','리우 협회 전용 카드에 화상 카드 5장을 추가했습니다.']],
      ['🩸 파열·보호막',['파열의 최대 스택이 10에서 20으로 늘었습니다. 출혈은 그대로입니다.','보호막은 최대 150까지만 쌓입니다. 최대 체력보다 훨씬 많아지던 문제를 막았습니다.']],
      ['⚙ 설정과 자동 전투',['타이틀과 출생을 제외한 모든 화면의 오른쪽 위에 설정 버튼(⚙)이 생겼습니다. 어느 화면에서든 연출과 전투 간격을 바꿀 수 있습니다. 자동 전투 중에 열면 전투가 멈추고, 닫으면 이어집니다.','자동 전투 간격이 느림 · 보통 · 조금 빠름 · 빠름 네 단계가 되었습니다. 보통을 이전보다 느리게 했습니다.']],
      ['🔧 개선과 수정',['공지 확인 버튼이 눌리지 않던 문제를 고쳤습니다.','혈귀 카드 몇 가지를 조정했습니다.']],

  const V720SEC=[['🌑 제 1막과 제 2막',['55년을 살아내면 제 1막 종료입니다. 여기서 끝내도 되고, 제 2막 시작을 눌러 계속 살아갈 수도 있습니다.','제 2막은 3년마다 위협 등급이 오르는 구간이고, 마지막 등급인 불순물을 넘기면 진짜 결말입니다.']],
      ['♾ 무한 모드 (74년 이후)',['불순물을 넘긴 뒤에도 "무한 모드로 계속한다"를 고르면, 쓰러질 때까지 이어집니다. 여기서 끝낼 수도 있습니다.','위협 보정이 끝없이 오르고, 8년마다 더 강해진 불순물이 나타납니다. 이길 때마다 다음은 더 단단해집니다.','세계에 균열이 갑니다. 루트와 상관없이 아직 이기지 못한 히든 보스 중 무엇이든 불쑥 나타날 수 있습니다.','90년차부터는 전투 라운드마다 침식이 시작됩니다. 회피와 보호막으로도 막을 수 없는 고정 피해이고, 연차가 오를수록 커집니다. 스탯만으로는 버틸 수 없습니다.','결국 누구도 끝까지 버틸 수 없습니다. 얼마나 오래 살았는지가 기록입니다.']],
      ['🕰 오래 산 사람에게',['아주 오래 살아남으면, 무언가 일어납니다.','타고난 것이 하나 늘었습니다. 아주 드물게 만날 수 있습니다.']],

      ${b.fated?`<div class="panel stack" style="gap:6px"><span class="mono small" style="color:var(--gold)">재능 · 결점 · 무기 · 타고난 것 없음 · 출신과 성장기 보정만 가진다</span></div>`:b.blank?`<div class="panel stack" style="gap:6px;border-color:var(--gold)"><span class="eyebrow" style="color:var(--gold)">출생 보정 없음</span><b class="serif">${esc(b.o.n)}</b><span class="small">${esc(b.o.t)}</span><span class="mono small" style="color:var(--gold)">출신 · 재능 · 결점 · 무기 · 타고난 것 없음 · 맨손 · 성장기 보정만 가진다</span><span class="mono small">빈손 · 히든 보스 전리품 장비 확률 +25%p · 정신이 꺾일 때 E.G.O 형상이 보일 확률 25%</span></div>`:`<div class="panel">${row('출신',b.r.o,b.o,UI.job?null:D.origins)}${row('재능',b.r.t,b.t,D.talents)}${row('결점',b.r.f,b.f,D.flaws)}${row('무기',b.r.w,b.w,D.weapons)}</div>`}
      ${b.innate?`<div class="panel stack" style="gap:6px;border-color:var(--gold)"><span class="eyebrow" style="color:var(--gold)">타고난 것 · 1%${b.innate2?' · 둘이 함께':''}</span>${[b.innate,b.innate2].filter(Boolean).map(k=>`<b class="serif">${esc(D.innate[k].n)}</b><span class="mono small" style="color:var(--gold)">${esc(D.innate[k].e)}</span>`).join('')}</div>`:''}
