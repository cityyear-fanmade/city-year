<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>도시의 한 해</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;900&display=swap">
<style>
/* 레이아웃: 한 열짜리 텍스트 어드벤처. 전투는 적 / 주사위 무대 / 파티 / 순서 / 기록 / 손패 순서. 각자의 색으로 구분한다. */
:root{
  --bg:#0c0e13; --panel:#131722; --panel2:#1a1f2d; --line:#262c3b; --line2:#3a4256;
  --fg:#e7e2d7; --dim:#8d93a3; --gold:#c8a35a; --gold-ink:#1a1405;
  --bleed:#d1686b; --rupture:#7ba6dc; --breath:#79c2b3; --good:#8fbf7a;
  --serif:"Noto Serif KR","Nanum Myeongjo",serif;
  --sans:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.65 var(--sans);padding-inline:16px;padding-block:20px 40px}
/* 프레임 크기는 모든 테마가 같다: 테두리 두께(--bw)가 달라도 테두리+여백 합은 고정 → 테마를 바꿔도 내용이 밀리지 않는다 */
.wrap{--bw:0px;position:relative;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  border:var(--bw) solid transparent;padding:calc(18px - var(--bw)) calc(14px - var(--bw)) calc(16px - var(--bw))}
h1,h2,h3,p{margin:0}
h1{font:900 clamp(34px,10vw,48px)/1.1 var(--serif);letter-spacing:-.01em;text-wrap:balance}
h2{font:600 22px/1.35 var(--serif);text-wrap:balance}
.serif{font-family:var(--serif)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.small{font-size:12.5px}
.eyebrow{font:500 11.5px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:12px 14px;min-height:46px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;width:100%}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700;align-items:center;justify-content:center;text-align:center}
.btn.quiet{background:transparent}
.btn b{font-weight:700}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bar{height:8px;background:#222836;border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12px/1.35 var(--mono);padding:5px 7px;border:1px solid var(--line2);border-radius:3px;color:var(--fg);white-space:normal;max-width:100%;overflow-wrap:anywhere;word-break:keep-all}
.swatch{width:12px;height:12px;border-radius:2px;flex:none}
.lead{color:var(--dim);text-wrap:pretty}
.roll{display:grid;grid-template-columns:64px 44px minmax(0,1fr);gap:10px;align-items:baseline;padding-block:10px;border-top:1px solid var(--line)}
.roll:first-of-type{border-top:0}
.roll .v{font:500 20px/1 var(--mono);color:var(--gold)}
.roll .n{display:flex;flex-direction:column;gap:2px}
.roll .n span{color:var(--dim);font-size:13px}
.log{font:400 12.5px/1.7 var(--mono);max-height:200px;overflow-y:auto;background:#0f1219;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.log div{padding-block:1px;overflow-wrap:anywhere}
.log .head{color:var(--gold);padding-top:6px}
.log .sys{color:var(--dim)}
.log .hit{color:var(--fg)}
.log .miss{color:var(--dim)}
.log .dmg{color:var(--bleed)}
.log .kw{color:var(--rupture)}
.hand{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{position:relative;font:inherit;color:var(--fg);text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:10px 10px 10px 42px;min-height:84px;display:flex;flex-direction:column;gap:5px;cursor:pointer}
.card:disabled{opacity:.38;cursor:default}
.card.sel{border-color:var(--gold);background:#231f15}
.card .cost{position:absolute;left:9px;top:10px;width:24px;height:24px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font:500 13px/1 var(--mono)}
.card .ord{position:absolute;right:8px;top:8px;font:500 12px/1 var(--mono);color:var(--gold-ink);background:var(--gold);border-radius:3px;padding:3px 5px;font-style:normal}
.card .nm{font-weight:700;font-size:14px;line-height:1.3;padding-right:20px}
.card .cd{font:400 11.5px/1.5 var(--mono);color:var(--dim)}
.card .chips{gap:4px}
.card .chip{font-size:11px;padding:3px 5px}
.stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.stat div{background:var(--panel2);border-radius:4px;padding:8px 4px}
.stat b{display:block;font:500 17px/1.2 var(--mono);color:var(--gold)}
.stat span{font-size:11.5px;color:var(--dim)}
details{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--panel)}
summary{cursor:pointer;font-weight:700}
details ul{margin:10px 0 0;padding-left:18px;color:var(--dim);font-size:13.5px}
details li{margin-block:3px}
table{width:100%;border-collapse:collapse;font:400 13px/1.5 var(--mono)}
th,td{padding:8px 6px;border-top:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left;font-family:var(--sans)}
th{color:var(--dim);font-weight:400;border-top:0}
.tbl{overflow-x:auto}
.check{font:400 13px/1.6 var(--mono);color:var(--dim);border-left:2px solid var(--gold);padding-left:10px}
.good{color:var(--good)}.bad{color:var(--bleed)}

/* 색 고르기 / 연출 설정 */
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--fg);outline:2px solid var(--bg);outline-offset:-4px}
.seg{display:flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:13px;padding:10px 6px;background:transparent;color:var(--dim);border:0;border-left:1px solid var(--line2);cursor:pointer;min-height:42px}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--gold);color:var(--gold-ink);font-weight:700}

/* 전투 무대 */
.ent{position:relative}
.arena{background:#0f1219;border:1px solid var(--line);border-radius:6px;padding:12px;min-height:76px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}
.alabel{font:500 13px/1.4 var(--mono);color:var(--dim);text-align:center;min-height:18px}
.dice{display:flex;gap:12px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.dwrap{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:76px}
.dcap{font:500 11px/1 var(--mono);letter-spacing:.1em;color:var(--dim)}
.die{width:64px;height:64px;border:2px solid var(--line2);border-radius:12px;display:grid;place-items:center;background:var(--panel2)}
.die.big{width:72px;height:72px}
.die b{font:500 26px/1 var(--mono);font-variant-numeric:tabular-nums}
.die.rolling{animation:wob .24s linear infinite}
.die.win{box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 55%,transparent)}
.die.lose{opacity:.6}
.dsum{font:400 12px/1.4 var(--mono);color:var(--dim);min-height:17px;text-align:center;max-width:150px}
.vs{align-self:center;font:500 12px/1 var(--mono);color:var(--dim);padding-top:14px}
.d6s{display:flex;gap:6px;min-height:64px;align-items:center}
.d6{width:42px;height:42px;border-radius:9px;border:2px solid var(--gold);display:grid;place-items:center;background:var(--panel2)}
.d6 b{font:500 20px/1 var(--mono)}
.float{position:absolute;right:14px;top:8px;font:700 22px/1 var(--mono);pointer-events:none;animation:flt .95s ease-out forwards;text-shadow:0 1px 6px #000}
@keyframes wob{0%{transform:rotate(-8deg) translateY(0)}25%{transform:rotate(6deg) translateY(-4px)}50%{transform:rotate(-5deg)}75%{transform:rotate(8deg) translateY(-3px)}100%{transform:rotate(-8deg)}}
@keyframes settle{0%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes lungeUp{0%{transform:translateY(0)}35%{transform:translateY(-18px)}100%{transform:translateY(0)}}
@keyframes lungeDown{0%{transform:translateY(0)}35%{transform:translateY(18px)}100%{transform:translateY(0)}}
@keyframes hurt{0%{transform:translateX(0);box-shadow:inset 0 0 0 0 transparent}15%{transform:translateX(-9px);box-shadow:inset 0 0 0 2px var(--bleed)}35%{transform:translateX(8px)}55%{transform:translateX(-5px);box-shadow:inset 0 0 0 2px var(--bleed)}80%{transform:translateX(3px)}100%{transform:translateX(0);box-shadow:inset 0 0 0 0 transparent}}
@keyframes dodge{0%{transform:translateX(0);opacity:1}35%{transform:translateX(24px) skewX(-8deg);opacity:.5}100%{transform:translateX(0);opacity:1}}
@keyframes guard{0%{box-shadow:0 0 0 0 var(--rupture)}50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--rupture) 70%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes flt{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-36px)}}
.settle{animation:settle .3s ease-out}
.lunge-up{animation:lungeUp .45s ease-out}
.lunge-down{animation:lungeDown .45s ease-out}
.hurt{animation:hurt .5s ease-out}
.dodge{animation:dodge .55s ease-out}
.guard{animation:guard .7s ease-out}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}


/* ===== 배경 테마: html[data-skin] = base | dante | library =====
   단테의 노트: 녹슨 적갈색 금속 프레임, 깎인 모서리, 주황 탭 제목.
   도서관: 오래된 종이와 나무 서가 색, 금박 제목. 둘 다 이미지 없이 CSS로만 그린다. */
html{background:var(--bg)}
.skin-tab{display:inline-flex;align-items:center;align-self:center;height:26px;padding:0 18px;font:500 11.5px/1 var(--mono);letter-spacing:.14em;color:var(--dim);border:1px solid var(--line)}
html[data-skin="dante"]{
  --bg:#0d0807; --panel:#1a100d; --panel2:#24150f; --line:#4a2418; --line2:#7a3a22;
  --fg:#efe1cf; --dim:#a68b78; --gold:#f0a23b; --gold-ink:#1d0d04;
  --frame:#5b2618; --frame2:#8e4325; --rivet:#c8743a;
}
html[data-skin="dante"] body{
  background:
    radial-gradient(ellipse at 50% 0%,rgba(142,67,37,.18),transparent 60%),
    repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 2px,transparent 2px 9px),
    var(--bg);
  background-attachment:fixed;
}
html[data-skin="dante"] .wrap{
  --bw:3px;
  background:linear-gradient(180deg,#160c09,#100806);
  border-color:var(--frame);
  box-shadow:inset 0 0 0 1px #2a120b,inset 0 0 0 4px #120806,inset 0 0 0 5px var(--frame2),0 10px 30px rgba(0,0,0,.6);
  clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px);
}
html[data-skin="dante"] .wrap::before,html[data-skin="dante"] .wrap::after{
  content:"";position:absolute;top:8px;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#f3b27a,var(--rivet) 45%,#4d1d0f);
}
html[data-skin="dante"] .wrap::before{left:22px}
html[data-skin="dante"] .wrap::after{right:22px}
html[data-skin="dante"] .skin-tab{
  font-family:var(--sans);font-weight:700;letter-spacing:.08em;color:var(--fg);padding:0 26px;
  background:linear-gradient(180deg,#3a1a10,#24110a);border-color:var(--frame2);
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%);
}
html[data-skin="dante"] .panel,html[data-skin="dante"] details,html[data-skin="dante"] .log,html[data-skin="dante"] .arena{
  border:1px solid var(--line2);border-radius:0;
  box-shadow:inset 0 0 0 1px #0c0504,inset 0 0 0 3px var(--line);
  clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 9px,100% calc(100% - 9px),calc(100% - 9px) 100%,9px 100%,0 calc(100% - 9px),0 9px);
}
html[data-skin="dante"] .btn,html[data-skin="dante"] .card{border-radius:0;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
html[data-skin="dante"] .btn.primary{background:linear-gradient(180deg,#f3b04d,#d9822a);border-color:#ffcf7a;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
html[data-skin="dante"] .eyebrow{color:var(--gold)}
html[data-skin="dante"] h1,html[data-skin="dante"] h2{text-shadow:0 1px 0 #000,0 0 14px rgba(240,162,59,.18)}
html[data-skin="dante"] .chip{border-radius:0}
html[data-skin="dante"] .card.sel{background:#3a1d0e}
html[data-skin="dante"] .arena,html[data-skin="dante"] .log{background:#110907}
html[data-skin="dante"] .die,html[data-skin="dante"] .d6{border-radius:4px}

html[data-skin="terminal"]{
  --bg:#050607; --panel:#04080c; --panel2:#071019; --line:#12324a; --line2:#1d5a82;
  --fg:#c9e4f1; --dim:#7fa3b8; --gold:#5cc3f2; --gold-ink:#02121c;
  --bleed:#ff6b7a; --rupture:#8fb4ff; --breath:#6ff0d2; --good:#7dffb0;
  --shell:#e9edf0; --shell2:#aeb6bd; --shell3:#6d767e;
}
html[data-skin="terminal"] body{background:radial-gradient(ellipse at 50% 30%,#0b1117,#020304 70%);background-attachment:fixed}
/* 흰 금속 외곽(단말기 몸체) + 안쪽 검은 화면 */
html[data-skin="terminal"] .wrap{
  --bw:8px;
  background:linear-gradient(180deg,#03070b,#010304);
  border-color:var(--shell);
  border-image:linear-gradient(160deg,#ffffff,var(--shell) 30%,var(--shell2) 60%,var(--shell3)) 1;
  box-shadow:0 0 0 2px #2a2f34,0 0 0 4px var(--shell2),0 14px 40px rgba(0,0,0,.8),inset 0 0 40px rgba(89,200,255,.07);
  clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 22px,100% calc(100% - 22px),calc(100% - 22px) 100%,22px 100%,0 calc(100% - 22px),0 22px);
}
/* 화면 주사선 */
html[data-skin="terminal"] .wrap::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(127,214,255,.018) 0 1px,transparent 1px 4px)}
html[data-skin="terminal"] .skin-tab{align-self:flex-start;letter-spacing:.2em;color:var(--gold-ink);background:var(--shell);border-color:var(--shell);padding:0 12px}
/* 빛 번짐은 제목과 큰 숫자에만 약하게. 본문은 번짐 없이 또렷하게 */
html[data-skin="terminal"] h1,html[data-skin="terminal"] h2,html[data-skin="terminal"] .roll .v,html[data-skin="terminal"] .stat b{
  text-shadow:0 0 8px rgba(92,195,242,.28)}
html[data-skin="terminal"] .panel,html[data-skin="terminal"] details,html[data-skin="terminal"] .log,html[data-skin="terminal"] .arena{background:rgba(5,14,22,.85);border-color:var(--line2);border-radius:2px}
html[data-skin="terminal"] .btn,html[data-skin="terminal"] .card,html[data-skin="terminal"] .die,html[data-skin="terminal"] .d6{border-radius:2px;background:#061220}
html[data-skin="terminal"] .btn.primary{background:var(--gold);color:var(--gold-ink);text-shadow:none}
html[data-skin="terminal"] .btn.primary b{text-shadow:none}
html[data-skin="terminal"] .bar{background:#0a1a26}

/* 행동 순서표, 성장 */
.ent.down{opacity:.45;filter:grayscale(.7)}
.ent.turn{outline:2px solid var(--gold);outline-offset:2px}
.order{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.order li{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px}
.order li .mono{margin-left:auto}
.grow .v{font:500 18px/1 var(--mono);color:var(--gold);min-width:34px}
/* 칩 모양 버튼(공방에 들른다 등): 브라우저 기본 회색 대신 테마 색 */
button.chip{background:transparent;color:var(--gold);border-color:var(--gold);cursor:pointer}
button.chip:hover{background:color-mix(in srgb,var(--gold) 14%,transparent)}
/* 전투: 행동 순서표, 공격하는 쪽/맞는 쪽, 판정 결과 */
.queue{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.queue li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:baseline;font-size:13.5px;padding:5px 6px;border-radius:4px;border-left:3px solid transparent}
.queue li.foe{background:color-mix(in srgb,var(--bleed) 7%,transparent)}
.queue li.now{border-left-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent)}
.queue li.done{opacity:.45}
.queue .qn{font:500 12px/1.4 var(--mono);color:var(--dim);text-align:right}
.ent.acting{box-shadow:0 0 0 2px var(--gold)}
.ent.target{box-shadow:0 0 0 2px var(--bleed)}
.alabel b{font-weight:700}
.verdict{font:700 16px/1.3 var(--sans);min-height:21px;text-align:center}
.verdict.bad{color:var(--bleed)}.verdict.miss{color:var(--rupture)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,#seedIn,#tw{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:10px 12px;min-height:44px;width:100%}
.dfinal{font:700 22px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--fg);min-height:22px}
.dfinal.good{color:var(--good)}.dfinal.bad{color:var(--bleed)}
/* hidden 속성은 항상 숨김 (.btn·.dwrap의 display보다 우선) */
[hidden]{display:none!important}
/* 피해 주사위는 명중·회피 아래 줄에 따로: 나타날 때 줄이 접히며 흔들리지 않게 */
#dmgw{flex-basis:100%}
/* 휴대폰 전투(폭 600px 이하에서만 쓰는 배치): 적·나 HP를 나란히 작게, 기록·설정은 접어 둔다 */
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ent.compact{padding:8px 10px;gap:5px}
.ent.compact .entname{display:flex;align-items:center;gap:6px;min-width:0}
.ent.compact .entname b{font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent.compact .bar{height:6px}
.ent.compact .chip{font-size:10.5px;padding:3px 5px}
.ordline{font-size:13.5px;line-height:1.7}
.logbox{padding:10px 12px}.logbox summary{font-size:13.5px}.logbox .log{margin-top:8px}
/* 주사위 무대: 명중·회피 주사위를 항상 한 줄에 나란히, 피해는 아래 줄 (이름이 길어도 세로로 접히지 않게) */
.dice{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;justify-items:center;gap:8px 6px}
.dice .dwrap{min-width:0;width:100%}
.dice .dcap{white-space:normal;text-align:center;line-height:1.35;font-size:11px;letter-spacing:.04em}
#dmgw{grid-column:1/-1}

@media (min-width:900px){.wrap{max-width:780px}.hand{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* 걸려 있는 키워드 칩: 색을 채우고 다음 효과를 작게 붙인다 */
.chip.stk{display:inline-flex;align-items:baseline;gap:6px;color:var(--kc);border-color:var(--kc);background:color-mix(in srgb,var(--kc) 16%,transparent);font-size:13px;padding:5px 8px}
.chip.stk small{font-size:11px;opacity:.8}
.float.kwf{top:auto;bottom:10px;left:14px;right:auto;font-size:16px}
.chip.stk{flex-wrap:wrap;white-space:normal;max-width:100%}

/* 소지품 칸 */
.inv summary{cursor:pointer;font:600 13px/1.4 var(--sans,inherit);color:var(--gold)}
.invr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:5px 0;border-bottom:1px solid var(--line)}
.invr>span:last-child{grid-column:1/-1}
.invr>span:last-child:empty{display:none}
.invcards{display:grid;gap:6px;margin-top:6px}

/* 도서관 초대장: 검은 바탕 + 옅은 금빛. 단테(붉은 갈색·잘린 모서리)와 달리 둥근 아치·모서리 꺾쇠·금빛 번짐 */

<script>
(()=>{
/* ---- src/config.js ---- */
/* 임시 수치: 밸런스는 여기만 바꾼다. `npm run sim`으로 확인한다. */
const CFG = {
  /* 캐릭터 */
  baseHp: 60,
  /* 전투: 빛(코스트), 손패, 키워드 */
  light: 3, lightMax: 5, hand: 4, stackCap: 10,
  breathCritPer: 5, critMult: 1.5,
  /* 순서: 1등 빛 보너스, 꼴등 추격 보정, 선제 격차와 명중 보너스 */
  orderBonusLight: 1, catchupBonus: 10, gapFirst: 30, firstHit: 10,

  defBonus: 15,
  /* 방어 자세(아무 카드도 내지 않은 라운드): 적 공격을 방어로 받는다.
     막으면 피해 guardHit, 못 막으면 피해 × guardFailMul(올림).
     다음 라운드 내 카드 명중 +nextHit, 그 전투 동안 빛과 빛 최대치 +lightUp (최대 lightUpMax) */
  /* lightNext: 다음 1라운드만 받는 빛 (lightUp 대신 쓰면 덜 강하다: 다음 라운드만 +2면 보스 승률 47% vs 안 넘김 51%) */
  guard: {bleedCut: 0.5, guardHit: 1, guardFailMul: 0.5, nextHit: 5, lightUp: 0, lightUpMax: 1, lightNext: 2},
  /* 적 방어 카드: 손에 남길 확률(%). 직전 라운드에 썼으면 이번 라운드는 쓰지 않는다 (100이면 예전처럼 거의 매번) */
  enemyGuard: {chance: 40},
  /* 적의 회피 주사위 크기(단계별). 초반 전투를 짧게: 초반 1d50, 중반 1d75, 보스·히든은 1d100 */
  enemyEvadeDie: {early: 50, mid: 75},
  /* 진행: 연수, 시작 나이, 해마다·승리 후·연속 전투 시뮬 회복량 */
  years: 55, startAge: 17, yearHeal: 9, winHeal: 11, chainHeal: 14,
  /* 특색: 이 급수에 오르면 특색 심사 사건이 한 번 열린다. 1d100 + 판정 보정 ≥ colorDc면 특색, 실패하면 그 판에서는 다시 기회가 없다 */
  colorRank: 1, colorDc: 90, topDc: 90,
  /* 승급 포인트와 승급 심사. 필요량: base, 그다음 단계마다 이전 필요량 × mult[i] (마지막 값이 계속 쓰인다).
     심사 실패 시 포인트의 loseFrac를 잃는다. 심사 난이도 = examDc + examDcStep × 지금까지 승급 횟수 */
  promo: {total: 192, fixerMul: 0.93, mult: [2, 1.4, 1.2, 1.1], loseFrac: 0.25, gain: {early: 3, mid: 4, late: 5, boss: 6, hidden: 10, check: 2, year: 2}, examDc: 40, examDcSpan: 15},
  /* 연차가 쌓일수록 일반 적이 강해진다: from년차 뒤 해마다 HP +hpPerYear 배, atkEvery년마다 공격·회피 +1 */
  enemyScale: {hpMul: 0.78, from: 8, hpPerYear: 0.035, atkEvery: 2},
  /* 히든 보스(발톱·조율자·도서관 등): 데이터 수치에 체력 배수와 공격·회피 가산 */
  hidden: {hpMul: 2.7, atk: 2, minHp: 30, winHeal: 15},
  /* minHp: 히든 보스 전투를 시작할 때 체력이 이보다 낮으면 여기까지 채운다. winHeal: 히든 보스를 이기면 평소 승리 회복에 더해 회복 */
  /* 히든 보스 후반 보정: from년차부터 해마다 체력 +hpPerYear, atkEvery년마다 공격 +1 (40년차 +30 · +5) */
  hiddenLate: {from: 25, hpPerYear: 3.6, atkEvery: 3},
  /* 무한런: years년 엔딩 뒤 이어서 산다. span년마다 위협 등급이 하나 오르고 그 끝에 등급 전투.
     등급 g(0부터)의 적: 체력 ×(1 + hpMul×(g+1)), 공격 +atk×(g+1). 마지막 등급 전투를 이기면 진엔딩 */
  endless: {span: 3, grades: ['도시 괴담', '도시 전설', '도시 질병', '도시 악몽', '도시의 별', '불순물'], hpMul: 0.08, atk: 1, star: 'pianist', final: 'impurity'},
  /* 정신력: 최대 max. healEvery년마다 +yearHeal. 선택지·환상체 조우 2d3 감소, 회피 실패 시 1d evadeDie에서 1이면 1 감소(E.G.O 장비 1개당 +1).
     voiceAt 이하에서 한 번 "들리는 목소리": 1d voiceDie를 voiceRolls번, 모두 voiceDc 이상이면 개화, 실패하면 1d failLoss 감소.
     0이면 사망, 1이면 뒤틀림 판정 1d2 (1이면 개화하고 가득 회복, 2면 뒤틀림 엔딩). tiers: 전투 시작 때 호흡·회피 보정 */
  mind: {max: 45, yearHeal: 1, healEvery: 2, voiceAt: 10, voiceDie: 50, voiceDc: 25, voiceRolls: 3, failLoss: 9, evadeDie: 5,
    tiers: [{at: 45, breath: 5, eva: 5}, {at: 30, breath: 3, eva: 3}, {at: 20, breath: 1, eva: 0}],
    ego: {atk: {n: '공격용', hit: 10, floor: 20}, def: {n: '방어용', hp: 30, floor: 11}}},
  /* 공방 거리: 1년차부터 every년마다 들를지 묻는다(해는 넘어가지 않음). blackFrom년차부터 암시장 물건 blackStock개 진열 */
  shop: {every: 3, blackFrom: 12, blackStock: 3, delCost: 500, delMax: 3, minDeck: 4, restMind: 5},
  /* 타고난 것: 출생 굴림과 별개로 1/chanceDiv 확률. 시드 재현을 위해 출생 굴림 값에서 파생 (새 주사위를 쓰지 않는다) */
  innate: {chanceDiv: 100, growMul: 1.2, money: 1.2, intuitionDie: 20, psycho: 2, markYear: 30, markMul: 1.6},
  /* 카드 등급: 연차가 쌓이면 내 공격 카드가 강해진다 (from년차부터). 적중마다 피해 +b, 명중 +hit, 주사위 +dice개 */
  cardGrade: [{from: 1, n: '', b: 0, hit: 0, dice: 0}, {from: 16, n: '+1', b: 2, hit: 5, dice: 0}, {from: 31, n: '+2', b: 3, hit: 10, dice: 1}, {from: 46, n: '+3', b: 5, hit: 15, dice: 1}],
  /* 잊힌 유물: year년차가 시작될 때 반드시 나오는 사건. 1d100에서 chance 이하면 유물 선택 */
  relicEvent: {year: 15, chance: 1},
  /* 레바테인: 봉인 상태에서 화상을 unlock번 걸면 해방. 해방 후 자신은 전투 시작 화상 1, selfEvery라운드마다 +1, blueAt 이상이면 자신도 푸른 화염(명중 −selfBlueHit) */
  laev: {unlock: 30, selfEvery: 1, blueAt: 5, blueDot: 2, selfBlueHit: 30},
  /* 엄지 검술(덱 고정): 카드를 얻는 자리마다 대신 받는 돈 */
  lockedCardMoney: 150,
  /* 공방 해결사: 4년차 갈림길에 chance% 확률로 제안. 1d die에서 minRoll 이상이면 성공. 공방 물건 할인율, 보관함 판매 비율 */
  workshopFixer: {chance: 20, die: 5, minRoll: 4, discount: 0.2, sell: 0.5, sellBase: 100},
  /* 출신 진로 보정: 그 진로의 권유 사건이 (보정값 × 이 값)% 확률로 먼저 나온다 */
  pathEventMul: 2,
  /* 전투 승리 후 해결사 등록 판정 난이도 (1d100 + 해결사 진로 보정) */
  winLicenseDc: 60,
  /* 소속 선택이 열리는 해 */
  affiliationYear: 4,
  /* 성장: 판정 성공/실패/판정 없음/전투 승리 경험치, 레벨별 누적 경험치 */
  xp: {ok: 2, fail: 1, plain: 1, win: 4},
  levels: [0, 4, 9, 15, 22, 30, 40, 52, 66, 82, 100, 120, 145, 175],
  /* 시뮬: 고정 전투 직전마다 쌓인다고 보는 레벨 업 수 (경험치 표 기준 추정) */
  simGrowth: [0, 2, 1]
};

/* ---- src/engine.js ---- */
/* 엔진: 규칙·판정·전투·진행. DOM을 쓰지 않는다 (브라우저·Node 시뮬 공용).
   데이터(D)는 data/*.json을 합친 객체로 주입받는다. 세계관 고유명사는 데이터 문자열에만 있다. */

const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const sg = n => n>=0 ? '+'+n : '−'+Math.abs(n);
const STAT = {atk:'공격',eva:'회피',spd:'속도'};

/* 시드 고정 난수 (시뮬 재현용) */
function mulberry32(a){
  return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
}

/* 데이터 검사: 없는 카드·적·키워드를 가리키는 곳을 찾는다. 새 데이터를 넣은 뒤 `npm run check` */
function validateData(D){
  const err=[],card=(id,at)=>{if(!D.cards[id])err.push(`${at}: 없는 카드 "${id}"`)};
  for(const [id,c] of Object.entries(D.cards)){
    if(!['atk','def','buff'].includes(c.t))err.push(`카드 ${id}: t는 atk/def/buff 중 하나`);
    if(typeof c.c!=='number')err.push(`카드 ${id}: 코스트 c 없음`);
    if(c.t==='atk'&&!(c.hits>=1&&c.dice>=1))err.push(`카드 ${id}: 공격 카드는 hits, dice 필요`);
    for(const k of c.kw||[])if(!D.keywords[k[0]])err.push(`카드 ${id}: 없는 키워드 "${k[0]}"`);
  }
  for(const id of D.rewards)card(id,'보상 목록');
  for(const [id,e] of Object.entries(D.enemies))e.deck.forEach(c=>card(c,`적 ${id} 덱`));
  /* 전투 지정: 적 id 또는 "table:<조우 표>" */
  const spec=(s,at)=>{
    if(s.startsWith('table:')){if(!D.encounters.tables[s.slice(6)])err.push(`${at}: 없는 조우 표 "${s.slice(6)}"`)}
    else if(!D.enemies[s])err.push(`${at}: 없는 적 "${s}"`);
  };
  for(const [y,s] of Object.entries(D.fixedFights))spec(s,`고정 전투 ${y}년차`);
  for(const h of D.hiddenBosses||[])if(!D.enemies[h.id])err.push(`히든 보스: 없는 적 "${h.id}"`);
  for(const [k,t] of Object.entries(D.encounters.tables)){
    if(t.at(-1).max!==100)err.push(`조우 표 ${k}: 마지막 max가 100이 아님`);
    t.forEach(x=>{if(!D.enemies[x.enemy])err.push(`조우 표 ${k}: 없는 적 "${x.enemy}"`)});
  }
  for(const tbl of ['origins','talents','flaws','weapons','growth'])
    if(D[tbl].at(-1).max!==100)err.push(`${tbl}: 마지막 max가 100이 아님`);
  if(D.childhood.table.at(-1).max!==100)err.push('childhood.table: 마지막 max가 100이 아님');
  for(const [id,it] of Object.entries(D.items)){
    if(!D.slots[it.slot])err.push(`공방 물건 ${id}: 없는 칸 "${it.slot}"`);
    if(!D.workshops.some(w=>w.grade===it.grade))err.push(`공방 물건 ${id}: 없는 공방 등급 ${it.grade}`);
    if(it.card)card(it.card,`공방 물건 ${id}`);
  }
  for(const n of D.orgs.finger){
    const F=D.fingers[n];if(!F){err.push(`손가락 "${n}": fingers.json에 서열표 없음`);continue}
    for(const r of F.ranks)for(const x of r.branch||[r])if(x.card)card(x.card,`손가락 ${n} ${x.n}`);
  }
  for(const o of D.origins)if(D.money.start[o.n]==null)err.push(`출신 ${o.n}: 시작 자산(money.start) 없음`);
  for(const [id,e] of Object.entries(D.enemies))if(!e.tier||D.money.bounty[e.tier]==null)err.push(`적 ${id}: tier 없음 또는 현상금 없음`);
  D.origins.forEach(o=>{card(o.card,`출신 ${o.n}`);for(const k in o.paths||{})if(!D.text.paths[k])err.push(`출신 ${o.n}: 없는 진로 "${k}"`)});
  for(const ev of D.events)if(ev.tag&&!D.text.paths[ev.tag])err.push(`사건 "${ev.t}": 없는 진로 태그 "${ev.tag}"`);
  const evs=[...D.events,D.affiliation,D.promotionExam,D.colorExam].filter(Boolean);
  for(const ev of evs)for(const c of ev.c)for(const r of [c.ok,c.fail].filter(Boolean)){
    if(!r.fx)continue;
    if(r.fx.card)card(r.fx.card,`사건 "${ev.t}"`);
    if(r.fx.combat)spec(r.fx.combat,`사건 "${ev.t}"`);
    if(r.fx.join&&r.fx.join.from&&!(D.orgs[r.fx.join.from]||[]).length)err.push(`사건 "${ev.t}": 소속 목록 orgs.${r.fx.join.from} 없음`);
    if(r.fx.join&&!r.fx.join.from&&!r.fx.join.name)err.push(`사건 "${ev.t}": join에 name 또는 from 필요`);
    if(c.check&&c.check.path&&!D.text.paths[c.check.path])err.push(`사건 "${ev.t}": 없는 진로 "${c.check.path}"`);
    if(c.check&&!c.fail)err.push(`사건 "${ev.t}" / "${c.l}": 판정이 있으면 fail 필요`);
  }
  return err;
}

function createEngine(D,{rng:rng0=Math.random}={}){
  /* 난수: 기본은 주입된 것. reseed(시드)로 한 판 전체를 그 시드로 굴린다(같은 시드 + 같은 선택 = 같은 결과) */
  let rng=rng0;
  const reseed=seed=>{rng=mulberry32(seed>>>0)};
  const d=n=>1+Math.floor(rng()*n);
  const T=D.text;
  function sample(arr,k){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,k)}
  const pick=(tbl,r)=>tbl.find(x=>r<=x.max);
  const one=arr=>arr[Math.floor(rng()*arr.length)];
  /* 덱보다 손패가 많으면 남는 칸은 덱에서 다시 뽑는다 */
  function drawHand(deck,k){const h=sample(deck,k);while(h.length<k)h.push(one(deck));return h}

  /* ===== 캐릭터 ===== */
  function addStats(s,fx){for(const k in fx){if(k==='dmin')s.dmin=Math.max(s.dmin,fx[k]);else if(k in s)s[k]+=fx[k]}}
  /* 성장기: 단계마다 1d100으로 표를 굴려 능력치 하나가 오른다 */
  function childhood(s){
    return D.childhood.stages.map(st=>{const r=d(100),x=pick(D.childhood.table,r);addStats(s,x.fx);return {age:st.age,r,x}});
  }
  /* job: 히든 직업으로 태어나면 출신 칸이 그 직업으로 바뀐다 (발톱 1, 조율자 100). 나머지 굴림은 같은 시드 그대로 */
  function newChar(job){
    const r={o:d(100),t:d(100),f:d(100),w:d(100),n:d(100)},J=job&&D.hiddenJobs[job];
    if(J)r.o=J.roll;
    const o=J?{n:J.n,t:J.t,e:J.e,fx:J.fx,card:J.cards[0],paths:{},flags:{}}:pick(D.origins,r.o),t=pick(D.talents,r.t),f=pick(D.flaws,r.f),w=pick(D.weapons,r.w),ci=Math.floor((r.n-1)/10);
    const s={maxHp:CFG.baseHp,atk:0,eva:0,spd:0,check:0,startBleed:0,startBreath:0,enemyHp:0,dmin:1,defUp:0,adv:0,extraD2:0,dmgB:0,burnHit:0,pdie:6};
    for(const x of [o,t,f])addStats(s,x.fx);
    const kid=childhood(s);
    const ch={r,o,t,f,w,kid,ci,color:D.colors[ci].hex,licensed:false,title:null,aff:null,paths:Object.assign({},o.paths),
      flags:Object.assign({},o.flags),beaten:[],unlocks:[],mind:CFG.mind.max,stats:s,hp:s.maxHp,gear:{},money:D.money.start[o.n]||0,
      deck:['slash','thrust','smash','guard',o.card],xp:0,lv:1,lvPend:0,lvOpts:null};
    if(o.race)ch.race=o.race;if(o.relicPick)ch.relicPick=true;
    /* 타고난 것 (히든): 출생 굴림 값의 해시로 정한다 */
    const IN=CFG.innate,h=(r.o*7919+r.t*104729+r.f*1299709+r.w*15485863+r.n*32452843+ch.kid.reduce((a,k)=>a*31+k.r,7))%1000003;
    if(h%IN.chanceDiv===0){const ks=Object.keys(D.innate||{});if(ks.length)ch.innate=ks[Math.floor(h/IN.chanceDiv)%ks.length]}
    if(J){ch.job=job;ch.aff={type:'head',name:'머리'};for(const c of J.cards.slice(1))ch.deck.push(c);ch.money=J.money||0;ch.relics=[J.n]}
    /* 출생 때 굴린 무기는 무기 칸의 첫 장비 */
    equip(ch,{id:'birth',slot:'weapon',n:w.n,e:w.e,fx:w.fx});
    /* 히든 직업 전용 무기: 출생 무기는 보관함으로 */
    if(J&&J.weapon)equip(ch,Object.assign({grade:5},J.weapon));
    return ch;
  }
  /* 유물 적성자: 출생 때 고른 유물 지급 */
  function giveRelic(ch,id,late){
    const R=D.relics[id];if(!R)return;
    (ch.relics=ch.relics||[]).push(R.n);(ch.relicIds=ch.relicIds||[]).push(id);ch.relicPick=false;ch.relicPickLate=false;
    if(R.odin)ch.odin=true;
    if(R.gear){equip(ch,Object.assign({id:R.gear.id||id,grade:5},R.gear));if(!late)ch.stash=(ch.stash||[]).filter(x=>x.id!=='birth')}
  }
  /* 이미 가진 유물은 다시 고를 수 없다 */
  const relicChoices=ch=>Object.keys(D.relics).filter(k=>!(ch.relicIds||[]).includes(k)&&!(ch.relics||[]).includes(D.relics[k].n)&&!(k==='laev'&&(ch.relics||[]).includes(D.relics.laev.open.n)));
  /* ===== 장비·돈·공방 ===== */
  /* 장비 칸마다 하나. 바꾸면 이전 장비 효과를 빼고 새 장비 효과를 더한다. 피해 최소값은 장비 중 가장 큰 값 */
  function equip(ch,item){
    const s=ch.stats,old=ch.gear[item.slot];
    if(old)for(const [k,v] of Object.entries(old.fx))if(k!=='dmin'&&k in s){s[k]-=v;if(k==='maxHp')ch.hp=Math.min(ch.hp,s.maxHp)}
    for(const [k,v] of Object.entries(item.fx))if(k!=='dmin'&&k in s){s[k]+=v;if(k==='maxHp')ch.hp+=v}
    ch.gear[item.slot]=item;
    /* 빼낸 장비는 버리지 않고 보관함으로 */
    if(old)(ch.stash=ch.stash||[]).push(old);
    s.dmin=Math.max(1,...Object.values(ch.gear).map(g=>g.fx.dmin||1));
    /* 무기 피해 주사위 면 수 (궁니르 d10). 장비 중 가장 큰 값, 기본 d6 */
    s.pdie=Math.max(6,...Object.values(ch.gear).map(g=>g.fx.die||6));
    if(item.card&&!ch.deck.includes(item.card)&&!ch.deckLocked)ch.deck.push(item.card);
  }
  /* 보관함의 장비를 꺼내 장착 (지금 장비는 보관함으로) */
  function equipStash(ch,i){const st=ch.stash||[];if(!st[i])return false;equip(ch,st.splice(i,1)[0]);return true}
  const inStash=(ch,id)=>(ch.stash||[]).some(x=>x.id===id);
  /* 공방 등급: 기본 → 소속 → 해결사 급수 보너스 */
  function shopAccess(ch){
    const A=D.access;let g=A.base;
    if(ch.aff&&A.aff[ch.aff.type])g=Math.max(g,A.aff[ch.aff.type]);
    const fingerUp=isFinger(ch)&&ch.fr&&ch.fr.tier>=D.fingerRules.shopTier;
    if((ch.licensed&&ch.rank<=A.rankBonus.rank)||fingerUp)g=Math.min(A.max,g+A.rankBonus.plus);
    return g;
  }
  /* 살 수 있는지: 'ok' / 'locked'(등급) / 'money' / 'owned' */
  function canBuy(ch,id){
    const it=D.items[id];
    if(ch.gear[it.slot]&&ch.gear[it.slot].id===id)return 'owned';
    if(inStash(ch,id))return 'stash';
    if(it.grade>shopAccess(ch))return 'locked';
    if(ch.money<priceOf(ch,id))return 'money';
    return 'ok';
  }
  /* 공방 해결사: 공방 물건 할인, 보관함 장비 판매 */
  const WF=CFG.workshopFixer;
  const isWs=ch=>!!ch.aff&&ch.aff.type==='workshop';
  const priceOf=(ch,id)=>{const p=D.items[id].price;return isWs(ch)?Math.round(p*(1-WF.discount)):p};
  const sellValue=it=>Math.floor((it.price||(D.items[it.id]&&D.items[it.id].price)||(D.special[it.id]&&D.special[it.id].price)||WF.sellBase)*WF.sell);
  function sellStash(ch,i){const st=ch.stash||[];if(!isWs(ch)||!st[i])return 0;const v=sellValue(st[i]);st.splice(i,1);ch.money+=v;return v}
  /* 암시장: 영구 강화(한 번만)와 특수 장비 */
  function canBuySpecial(ch,id){
    const it=D.special[id];
    if(it.perm?(ch.perms||[]).includes(id):(ch.gear[it.slot]&&ch.gear[it.slot].id===id))return 'owned';
    if(!it.perm&&inStash(ch,id))return 'stash';
    if(ch.money<it.price)return 'money';
    return 'ok';
  }
  function buySpecial(ch,id){
    if(canBuySpecial(ch,id)!=='ok')return false;
    const it=D.special[id];ch.money-=it.price;
    if(it.perm){(ch.perms=ch.perms||[]).push(id);addStats(ch.stats,it.fx);if(it.fx.maxHp)ch.hp+=it.fx.maxHp}
    else equip(ch,Object.assign({id,grade:4},it));
    return true;
  }
  function buy(ch,id){
    if(canBuy(ch,id)!=='ok')return false;
    const it=D.items[id];ch.money-=priceOf(ch,id);equip(ch,Object.assign({id},it));return true;
  }
  /* 금전운: 버는 돈 +20% */
  const earn=(ch,n)=>n>0&&ch.innate==='fortune'?Math.round(n*CFG.innate.money):n;
  /* 성장력: 레벨 업 성장 능력치 1.2배 (소수점은 쌓아 두었다가 1이 되면 오른다) */
  function applyGrowth(ch,fx){
    const r=applyFx(ch,fx);
    if(ch.innate==='growth'){const acc=ch.growAcc=ch.growAcc||{},ex={};
      for(const [k,v] of Object.entries(fx))if(typeof v==='number'&&v>0&&k in ch.stats){acc[k]=(acc[k]||0)+v*(CFG.innate.growMul-1);const n=Math.floor(acc[k]+1e-9);if(n>0){acc[k]-=n;ex[k]=n}}
      if(Object.keys(ex).length){addStats(ch.stats,ex);if(ex.maxHp)ch.hp+=ex.maxHp;r.chips.push('성장력 · '+Object.entries(ex).map(([k,v])=>k+'+'+v).join(' '))}}
    return r;
  }
  /* 해마다 들어오는 돈: 소속 봉급 + 해결사 급수 수당 */
  const income=ch=>(D.money.salary[ch.aff?ch.aff.type:'none']||0)+(ch.licensed?(T.rankStart-ch.rank)*D.money.rankSalary:0)
    +(isFinger(ch)&&ch.fr?(ch.fr.tier-1)*D.fingerRules.salaryPerTier:0)+(ch.pinky?D.pinky.money:0);
  const money=n=>n.toLocaleString('ko-KR')+D.money.unit;
  function setColor(ch,ci){ch.ci=ci;ch.color=D.colors[ci].hex}
  /* 자격 등록: 가장 낮은 급수에서 시작한다. 특색은 여기서 주지 않는다 */
  const noFixer=ch=>isFinger(ch)||(!!ch.aff&&(ch.aff.type==='wing'||ch.aff.type==='head'));
  function license(ch){
    /* 손가락 조직원·날개 직원은 해결사로 등록될 수 없다 */
    if(ch.licensed||noFixer(ch))return false;
    const s=ch.stats;
    const c=sample([['atk',s.atk],['eva',s.eva],['spd',s.spd],['hp',(s.maxHp-CFG.baseHp)/4]],4);
    let best=c[0];for(const x of c)if(x[1]>best[1])best=x;
    ch.licensed=true;ch.rank=T.rankStart;ch.dom=best[0];
    return true;
  }
  /* 승급: 급수가 2 오르고 가장 높은 능력치가 한 단계 자란다.
     최고 급수(CFG.colorRank)에 오른 순간 특출 판정(1d100 + 판정 보정 ≥ CFG.colorDc)을 넘으면
     색 + 가장 높은 능력치의 단어로 특색을 받는다 */
  /* 승급: 한 번에 1급, 가장 높은 능력치가 한 단계 자란다. 특색은 1급에서 열리는 특색 심사로만 */
  function promote(ch){
    ch.rank=Math.max(T.rankTop,ch.rank-1);
    const k=ch.dom,s=ch.stats,chips=[T.promote+' · '+ch.rank+T.rankUnit];
    if(k==='hp'){s.maxHp+=4;ch.hp+=4;chips.push('최대 HP +4')}else{s[k]+=1;chips.push(STAT[k]+' +1')}
    return {chips};
  }
  /* ===== 승급 포인트와 심사 =====
     전투 승리·판정 성공으로 포인트가 쌓이고, 필요량에 닿으면 승급 심사 사건이 열린다 */
  /* 진로: 손가락 > 협회 > 날개 > 해결사(등록) 순으로 판단. 진로마다 단계 수가 달라도
     최고 단계까지 필요한 포인트 총량(CFG.promo.total)은 같게 기본값을 나눈다 */
  const CR=D.careers||{};
  function career(ch){
    if(isFinger(ch))return 'finger';
    if(ch.aff&&CR[ch.aff.type]&&CR[ch.aff.type].ranks)return ch.aff.type;
    return ch.licensed?'fixer':null;
  }
  function steps(k,ch){
    if(k==='fixer')return T.rankStart-T.rankTop;
    if(k==='finger')return D.fingers[ch.aff.name].ranks.length-1;
    return k?CR[k].ranks.length-1:0;
  }
  const multAt=i=>CFG.promo.mult[Math.min(i,CFG.promo.mult.length-1)];
  function promoNeed(ch){
    const k=career(ch),n=Math.max(1,steps(k,ch));let sum=0,m=1;
    for(let i=0;i<n;i++){sum+=m;m*=multAt(i)}
    let need=CFG.promo.total*(k==='fixer'?CFG.promo.fixerMul:(CR[k].totalMul||1))/sum;
    for(let i=0;i<(ch.promos||0);i++)need*=multAt(i);
    return Math.round(need);
  }
  const canPromote=ch=>{const k=career(ch);return !!k&&(ch.promos||0)<steps(k,ch)};
  const ptsName=ch=>{const k=career(ch);return k&&CR[k]?CR[k].pts:T.promoPoints};
  const examReady=ch=>canPromote(ch)&&(ch.pp||0)>=promoNeed(ch);
  const examDc=ch=>{const k=career(ch),n=Math.max(1,steps(k,ch));return Math.round(CFG.promo.examDc+CFG.promo.examDcSpan*(ch.promos||0)/n)};
  function addPts(ch,n,chips){
    const k=career(ch);if(!n||!k)return;
    n=Math.round(n*((CR[k]&&CR[k].gainMul)||1));ch.pp=(ch.pp||0)+n;
    if(canPromote(ch))chips.push(`${ptsName(ch)} +${n} (${ch.pp}/${promoNeed(ch)})`);
  }
  /* 협회·날개 직급: 단계마다 그 직급의 보정을 더한다 (손가락 fingerStep과 같은 방식) */
  function careerStep(ch){
    const C_=CR[ch.aff.type],r=C_.ranks[(ch.fi??-1)+1];if(!r)return null;
    ch.fi=(ch.fi??-1)+1;ch.fr=r;addStats(ch.stats,r.fx);if(r.fx.maxHp)ch.hp+=r.fx.maxHp;
    /* 협회 직급에 맞는 해결사 급수 (예: 지부장은 최소 4급) */
    if(r.minRank&&ch.licensed&&ch.rank>r.minRank)ch.rank=r.minRank;
    return [`${ch.aff.name} · ${r.n}`,...(r.e?[r.e]:[])];
  }
  /* 최고 단계의 특수 사건: 해결사는 특색 심사, 다른 진로는 careers.*.top */
  const topEvent=ch=>{const k=career(ch);return k==='fixer'?D.colorExam:CR[k]&&CR[k].top};
  const topReady=ch=>{const k=career(ch);return !!k&&!canPromote(ch)&&!ch.title&&!ch.colorFailed&&(ch.promos||0)>0}
  /* ===== 손가락 서열 =====
     손가락마다 서열표가 있고, 오를 때마다 그 서열의 보정을 더한다. branch면 1d100으로 갈래를 고른다 */
  const isFinger=ch=>!!ch.aff&&ch.aff.type==='finger'&&!!D.fingers[ch.aff.name];
  function fingerStep(ch){
    const F=D.fingers[ch.aff.name],next=F.ranks[(ch.fi??-1)+1];
    if(!next)return null;
    const r=next.branch?next.branch[d(100)<=50?0:1]:next;
    ch.fi=(ch.fi??-1)+1;ch.fr=r;
    addStats(ch.stats,r.fx);if(r.fx.maxHp)ch.hp+=r.fx.maxHp;
    if(r.card&&!ch.deck.includes(r.card))ch.deck.push(r.card);
    return [`${ch.aff.name} · ${r.n}`,...(r.e?[r.e]:[])];
  }
  const canFingerUp=ch=>isFinger(ch)&&!!D.fingers[ch.aff.name].ranks[(ch.fi??-1)+1];
  /* 승급 사건·고정 전투 승리: 손가락이면 서열, 아니면 해결사 급수 */
  function promoteAny(ch){
    if(canFingerUp(ch))return {chips:fingerStep(ch),finger:true};
    const k=career(ch);if(k&&k!=='fixer'){const c=careerStep(ch);return c?{chips:c}:null}
    if(ch.licensed&&ch.rank>T.rankTop)return promote(ch);
    return null;
  }
  /* 날개·손가락 진로면 해결사 급수 대신 그 진로의 직급을 보여 준다 (해결사 급수는 그 진로에서 오르지 않는다) */
  const rankLabel=ch=>{if(ch.job)return ch.title?`${ch.title} · ${T.jobs[ch.job]}`:T.jobs[ch.job];const k=career(ch);if((k==='wing'||k==='finger')&&ch.fr)return ch.title?`${ch.title} · ${ch.fr.n}`:ch.fr.n;return rankLabel0(ch)};
  const rankLabel0=ch=>!ch.licensed?T.unranked:ch.title?`${ch.title} · ${ch.rank}${T.rankUnit}`:`${ch.rank}${T.rankUnit} ${T.licensed}`;
  /* 카드 얻기: 덱이 고정(엄지 검술)이면 카드 대신 돈 */
  function addCard(ch,cid,chips,label){

  }
  function rewardCard(ch){const pool=D.rewards.filter(id=>!ch.deck.includes(id));return pool.length?one(pool):null}
  /* 사건·성장·보상 효과를 적용하고 화면용 칩을 돌려준다 */
  function applyFx(ch,fx){
    const s=ch.stats,chips=[];

    if(fx.money){const m=earn(ch,fx.money);ch.money=Math.max(0,ch.money+m);chips.push((m>0?'+':'−')+money(Math.abs(m))+(m!==fx.money?' (금전운)':''))}

    for(const f of [].concat(fx.flag||[]))ch.flags[f]=(ch.flags[f]||0)+1;
    if(fx.join){

      ch.fi=undefined;ch.fr=null;ch.pp=0;ch.promos=0;ch.strikes=0;
      if(noFixer(ch)&&ch.licensed){ch.licensed=false;ch.title=null;chips.push(`해결사 자격 반납 · ${T.affTypes[ch.aff.type]}은(는) 해결사를 겸할 수 없다`)}

    if(fx.promote)addPts(ch,CFG.promo.gain.mid,chips);
    if(fx.pinky&&!ch.pinky){ch.pinky=true;addStats(s,D.pinky.fx);chips.push(D.pinky.n+' 표식 · '+D.pinky.e)}
    if(fx.examPass){const need=promoNeed(ch),p=promoteAny(ch);if(p){chips.push(...p.chips);ch.pp=Math.max(0,(ch.pp||0)-need);ch.promos=(ch.promos||0)+1;ch.strikes=0}}

      ch.pp=(ch.pp||0)-lost;chips.push(`${ptsName(ch)} −${lost} (${ch.pp}/${promoNeed(ch)})`);
      if(C_.failHp){ch.hp=clamp(ch.hp+C_.failHp,1,s.maxHp);chips.push('HP '+sg(C_.failHp))}

      if(C_.strikes&&ch.strikes>=C_.strikes){
        ch.strikes=0;
        if(C_.strike==='fire'){chips.push(`${ch.aff.name} 해고 · 소속을 잃었다`);ch.aff=null;ch.fi=undefined;ch.fr=null;ch.pp=0;ch.promos=0}
        if(C_.strike==='purge'){ch.purge=C_.purgeFoe;chips.push('숙청 대상이 되었다')}
      }
    }
    if(fx.topPass){const C_=CR[career(ch)];ch.title=C_.topTitle;ch.titleKind='top';addStats(s,C_.topFx||{});if((C_.topFx||{}).maxHp)ch.hp+=C_.topFx.maxHp;chips.push('칭호 · '+ch.title)}
    if(fx.topFail){ch.colorFailed=true;chips.push('심사 실패 · 다시 기회 없음')}
    if(fx.examSkip)ch.examSkipYear=ch.year;
    if(fx.colorPass){ch.title=D.colors[ch.ci].adj+' '+one(D.titleWords[ch.dom||'atk']);ch.titleKind='color';ch.titlePick=true;chips.push(T.titleLabel+' · '+ch.title)}
    if(fx.colorFail){ch.colorFailed=true;chips.push(T.titleLabel+' 심사 실패 · 다시 기회 없음')}

  function lvOf(xp){let l=1;for(let i=1;i<CFG.levels.length;i++)if(xp>=CFG.levels[i])l=i+1;return l}
  const xpNext=ch=>CFG.levels[ch.lv];
  function gainXp(ch,n){const b=ch.lv;ch.xp+=n;ch.lv=lvOf(ch.xp);ch.lvPend+=ch.lv-b;return ch.lv-b}
  function rollGrowth(){
    const out=[];let g=0;
    while(out.length<3&&g++<40){const r=d(100),x=pick(D.growth,r);if(!out.some(o=>o.g===x))out.push({r,g:x})}
    return out;
  }

  /* ===== 조우 =====
     "table:<이름>"이면 1d100으로 조우 표를 굴린다. 소속 전용 표(<이름>@<소속 종류>)가 있으면 그것을 쓴다 */
  function encounter(ch,s){
    if(!s.startsWith('table:'))return {id:s,roll:null,table:null};
    const name=s.slice(6),T_=D.encounters.tables;
    const key=ch.aff&&T_[`${name}@${ch.aff.type}`]?`${name}@${ch.aff.type}`:name;
    const r=d(100);
    let id=pick(T_[key],r).enemy;
    /* once: 한 번 이긴 미니보스는 다시 나오지 않는다 (표의 첫 적으로 바뀜) */
    if(D.enemies[id].once&&(ch.minis||[]).includes(id))id=T_[key][0].enemy;
    return {id,roll:r,table:name,label:D.encounters.labels[name]||name};
  }

  /* ===== 진행 (7년) ===== */
  /* 조건: licensed / unlicensed / aff(소속 있음) / noaff / aff:<종류> / affname:<이름> / rank<=N /
     flag:<이름>[>=n]. 배열은 모두, {any:[...]}는 하나라도 */
  function meets(ch,req){
    if(!req)return true;
    if(Array.isArray(req))return req.every(r=>meets(ch,r));
    if(req.any)return req.any.some(r=>meets(ch,r));
    if(req.startsWith('flag:')){const [k,n]=req.slice(5).split('>=');return (ch.flags[k]||0)>=(+n||1)}
    if(req==='pinky')return !!ch.pinky;
    if(req==='nopinky')return !ch.pinky;
    /* beat:any = 히든 보스를 하나라도 이김, beat:a|b = 그중 하나를 이김 */
    if(req==='beat:any')return ch.beaten.length>0;
    if(req.startsWith('beat:'))return req.slice(5).split('|').some(id=>ch.beaten.includes(id));
    if(req.startsWith('affname:'))return !!ch.aff&&ch.aff.name===req.slice(8);
    if(req.startsWith('rank<='))return ch.licensed&&ch.rank<=+req.slice(6);
    if(req==='licensed')return ch.licensed;
    if(req==='unlicensed')return !ch.licensed;
    if(req.startsWith('noflag:'))return !ch.flags[req.slice(7)];
    if(req==='nofinger')return !isFinger(ch);
    if(req==='nojob')return !ch.job;
    if(req==='canfix')return !noFixer(ch);
    if(req==='aff')return !!ch.aff;
    if(req==='noaff')return !ch.aff;
    if(req.startsWith('aff:'))return !!ch.aff&&ch.aff.type===req.slice(4);
    return true;
  }
  /* ===== 정신력 ===== */
  const M=CFG.mind;
  const mindFloor=ch=>ch.ego?M.ego[ch.ego.type].floor:0;
  function loseMind(ch,n,out){
    if(n<=0)return;const m0=ch.mind;ch.mind=Math.max(mindFloor(ch),ch.mind-n);
    if(ch.mind<m0&&out)out(`정신력 −${m0-ch.mind} (${ch.mind}/${M.max})`);
    if(ch.ego)return;
    if(ch.mind<=0)ch.mindDead=true;
    else if(ch.mind===1&&!ch.distortDone)ch.distortPend=true;
    else if(ch.mind<=M.voiceAt&&!ch.voiceUsed)ch.voicePend=true;
  }
  const gainMind=(ch,n)=>{const m0=ch.mind;ch.mind=Math.min(M.max,ch.mind+n);return ch.mind-m0};
  const mindTier=ch=>M.tiers.find(t=>ch.mind>=t.at)||null;
  /* E.G.O 이름: 1~5글자, 게임에 있는 물건·전리품·유물·카드 이름과 같으면 안 된다 (띄어쓰기 무시) */
  function egoTaken(){
    const n=new Set(),add=x=>{if(x)n.add(String(x).replace(/\s/g,''))};
    for(const o of [D.items,D.special,D.cards])for(const v of Object.values(o||{}))add(v.n);
    for(const v of Object.values(D.relics||{})){add(v.n);if(v.open)add(v.open.n)}
    for(const v of Object.values(D.hiddenJobs||{})){add(v.n);if(v.weapon)add(v.weapon.n)}
    for(const e of Object.values(D.enemies)){if(e.drop){add(e.drop.n);if(e.drop.gear)add(e.drop.gear.n)}}
    return n;
  }
  function egoNameErr(name){
    const w=(name||'').trim();
    if(!/^[가-힣A-Za-z0-9 ]{1,5}$/.test(w)||!w.replace(/\s/g,''))return '1~5글자로 적어 주세요 (한글·영문·숫자)';
    if(egoTaken().has(w.replace(/\s/g,'')))return '이미 게임에 있는 물건·전리품·유물·카드 이름이다';
    return null;
  }
  function setEgo(ch,type,name){
    const e=M.ego[type];ch.ego={type,n:name.trim()};ch.egoPick=false;ch.voiceUsed=true;ch.voicePend=false;ch.distortPend=false;
    if(e.hit)ch.stats.atk+=e.hit;if(e.hp){ch.stats.maxHp+=e.hp;ch.hp+=e.hp}
    ch.mind=Math.max(ch.mind,e.floor);(ch.relics=ch.relics||[]).push(`E.G.O · ${ch.ego.n}`);
  }
  /* 무한런: 마지막 해, 지금 위협 등급(-1이면 아직 기본 연차) */
  const lastYear=G=>CFG.years+(G.endless?CFG.endless.span*CFG.endless.grades.length:0);
  const gradeAt=y=>y>CFG.years?Math.min(CFG.endless.grades.length-1,Math.floor((y-CFG.years-1)/CFG.endless.span)):-1;
  function delCard(ch,i){
    if(ch.deckLocked)return false;
    if(ch.money<CFG.shop.delCost||ch.deck.length<=CFG.shop.minDeck||!ch.deck[i])return false;
    ch.money-=CFG.shop.delCost;return ch.deck.splice(i,1)[0];
  }
  function newGame(ch){return {ch,year:0,pool:sample(D.events.map((_,i)=>i),D.events.length)}}
  const age=G=>CFG.startAge+G.year-1;
  /* 다음 해: 끝 / 고정 전투 / 사건 */
  /* 고정 전투 지정: fixedFights에 적힌 해, 그다음은 fixedRule(every년마다 단계별 표, final 연차는 보스) */
  function fixedSpec(year){
    if(D.fixedFights[year])return D.fixedFights[year];
    const R=D.fixedRule;if(!R)return null;
    if(R.final&&R.final[year])return R.final[year];
    if(year%R.every)return null;
    const t=R.tiers.find(t=>year<=t.until);return t?t.spec:null;
  }
  function advanceYear(G){
    const mc=G.ch;
    if(mc.mindDead)return {type:'end',win:false,cause:'mind'};
    if(mc.distorted)return {type:'end',win:false,cause:'distort'};
    if(mc.distortPend&&!mc.ego){mc.distortPend=false;mc.distortDone=true;return {type:'event',ev:D.mindEvents.distort}}
    if(mc.innate==='mark'&&!mc.markOn&&G.year>=CFG.innate.markYear-1)return {type:'event',ev:D.innateEvents.mark};
    if(D.relicEvent&&!mc.relicEvt&&G.year===CFG.relicEvent.year-1){mc.relicEvt=true;return {type:'event',ev:D.relicEvent}}
    if(mc.affRetry&&!mc.aff){mc.affRetry=false;return {type:'event',ev:D.affiliation}}

    G.year++;
    if(G.year>lastYear(G)){G.year=lastYear(G);return {type:'end',win:true,trueEnd:!!G.endless}}
    G.ch.year=G.year;
    if(G.year>1){G.ch.hp=Math.min(G.ch.stats.maxHp,G.ch.hp+CFG.yearHeal);if(G.year%(M.healEvery||1)===0)gainMind(G.ch,M.yearHeal);G.lastIncome=earn(G.ch,income(G.ch));G.ch.money+=G.lastIncome}
    /* 근속: 진로가 있으면 해마다 포인트가 조금씩 쌓인다 */
    if(G.year>1&&CFG.promo.gain.year&&canPromote(G.ch))G.ch.pp=(G.ch.pp||0)+CFG.promo.gain.year;
    let f=fixedSpec(G.year);
    /* 무한런 등급 전투: 등급 마지막 해. 도시의 별 등급은 피아니스트(이미 이겼으면 후반 조우), 마지막 등급은 최종 상대 */
    const X_=CFG.endless,k_=G.year-CFG.years;
    if(k_>0)f=k_%X_.span?null:gradeAt(G.year)===X_.grades.length-1?X_.final:gradeAt(G.year)===X_.grades.indexOf('도시의 별')&&!(G.ch.minis||[]).includes(X_.star)?X_.star:'table:late';
    if(f&&k_>0&&gradeAt(G.year)===X_.grades.length-1)return {type:'fight',enemy:f,enc:{label:X_.grades[gradeAt(G.year)]+' · 마지막 등급 전투'}};
    if(f){
      /* 히든 보스: 목록 위에서부터 조건(과 확률)이 맞는 첫 보스가 불길한 예감(omen)으로 먼저 나타난다.
         맞서면 그 보스와 싸우고(다시 나오지 않음), 돌아서면 평소 조우로 넘어간다(조건이 맞으면 다음에 또 나올 수 있다) */
      for(const h of D.hiddenBosses||[]){
        if(G.year<(h.from||1)||G.ch.beaten.includes(h.id)||(G.met||[]).includes(h.id)||!meets(G.ch,h.req))continue;
        /* chanceBonus: 조건이 맞으면 확률 가산 (예: 검지 소속은 대행자 +30%) */
        const ch_=h.chance?h.chance+(h.chanceBonus&&meets(G.ch,h.chanceBonus.req)?h.chanceBonus.add:0):0;
        if(ch_&&d(100)>ch_)continue;
        return {type:'omen',boss:h.id,omen:h.omen||{},escape:!h.noEscape,spec:f};
      }
      const e=encounter(G.ch,f);return {type:'fight',enemy:e.id,enc:e};
    }
    /* 갈림길: 공방 해결사 제안이 가끔(WF.chance%) 끼어든다 */
    if(G.year===CFG.affiliationYear&&!G.ch.aff){
      if(D.workshopChoice&&!noFixer(G.ch)&&d(100)<=WF.chance)return {type:'event',ev:Object.assign({},D.affiliation,{x:D.affiliation.x+(D.workshopIntro||''),c:[...D.affiliation.c,D.workshopChoice]})};
      return {type:'event',ev:D.affiliation};
    }
    /* 승급 심사·특색 심사는 조건이 되면 다른 사건보다 먼저 (심사를 미룬 해의 다음 해까지는 다시 묻지 않음) */
    const ch=G.ch;
    if(topReady(ch))return {type:'event',ev:topEvent(ch)};
    if(examReady(ch)&&ch.examSkipYear!==G.year-1){const k=career(ch);return {type:'event',ev:(CR[k]&&CR[k].exam)||D.promotionExam}}
    /* 사건을 다 쓰면 다시 섞는다 */
    if(!G.pool.length)G.pool=sample(D.events.map((_,i)=>i),D.events.length);
    /* first 표시가 있는 사건(소속 전용 등)은 조건이 맞으면 먼저 나온다 */
    const fi=G.pool.findIndex(i=>D.events[i].first&&meets(G.ch,D.events[i].req));
    if(fi>=0)return {type:'event',ev:D.events[G.pool.splice(fi,1)[0]]};
    /* 출신 진로 보정이 있으면 그 진로의 권유 사건(tag)이 보정값 × pathEventMul % 확률로 먼저 나온다 */
    const tagged=G.pool.filter(i=>{const e=D.events[i];return e.tag&&(G.ch.paths[e.tag]||0)>0&&meets(G.ch,e.req)});
    if(tagged.length){
      const ti=one(tagged);
      if(d(100)<=(G.ch.paths[D.events[ti].tag]||0)*CFG.pathEventMul){G.pool.splice(G.pool.indexOf(ti),1);return {type:'event',ev:D.events[ti]}}
    }

    return {type:'event',ev:D.events.find(e=>e.fallback)||D.events[0]};
  }
  /* 불길한 예감에 대한 답: go면 히든 보스, 아니면 원래 고정 전투 지정대로 조우 */
  function answerOmen(G,st,go){

    const e=encounter(G.ch,st.spec);return {type:'fight',enemy:e.id,enc:e,avoided:st.boss};
  }
  /* 고를 수 있는 선택지 (조건이 맞지 않는 선택지는 빠진다). i는 원래 번호 */
  const options=(G,ev)=>ev.c.map((c,i)=>({c,i})).filter(o=>meets(G.ch,o.c.req));
  /* 판정 보정 = 능력치 + 사건 판정 보정 + (그 진로 판정이면) 출신 진로 보정 */
  const pathMod=(ch,check)=>check.path?(ch.paths[check.path]||0):0;
  const checkDc=(ch,check)=>check.dc==='exam'?examDc(ch):check.dc==='color'?CFG.colorDc:check.dc==='top'?CFG.topDc:check.dc;
  function checkMod(ch,check){return (check.s?ch.stats[check.s]:0)+ch.stats.check+pathMod(ch,check)}
  /* 선택: 판정이 있으면 1d100 + 능력치 + 판정 보정 ≥ 난이도 */
  function choose(G,ev,i){
    const ch=G.ch,c=ev.c[i];let res=c.ok,roll=null,xp=CFG.xp.plain,xpNote=null;
    if(c.check){
      const ib=ch.innate==='intuition'?d(CFG.innate.intuitionDie):0;
      const dc=checkDc(ch,c.check),mod=checkMod(ch,c.check)+ib,r=d(100),tot=r+mod,ok=tot>=dc;
      if(ib)xpNote=`타고난 직감 +${ib}`;
      roll={r,mod,tot,dc,ok};res=ok?c.ok:c.fail;xp=ok?CFG.xp.ok:CFG.xp.fail;

    if(xpNote)chips.unshift(xpNote);
    if(fx.markAwake){const M_=CFG.innate.markMul,s0=ch.stats,b={};
      for(const k of ['atk','eva','spd','check'])if(s0[k]>0){const n=Math.floor(s0[k]*M_)-s0[k];if(n>0){s0[k]+=n;b[k]=n}}

  /* 전투 승리 보상: 회복, 카드, 경험치, 자격 등록 또는 (고정 전투) 승급 */

  /* 순서: 1d100 + 속도 (+ 지난 라운드에 뒤처졌으면 추격 보정).

  /* 이번 라운드 발동 순서: 방어 카드 먼저(순서대로), 그다음 공격·버프를 순서대로 한 장씩 번갈아 */

  function autoPlay(hand,light){

  /* 자동 전투용 카드 선택: 빛 안에서 점수 합이 가장 큰 조합(손패 4장이라 모든 조합을 본다).
     점수 = 기대 피해(타수 × (주사위 × 3.5 + 고정값)) + 키워드 스택 × 2. 방어 카드는 HP가 35% 미만일 때만 높게 친다.
     반환: 손패 번호 배열 (방어 → 점수 높은 순) */
  function autoPick(C){
    const P=C.P,low=P.hp/P.maxHp<0.35;
    const score=c=>c.t==='def'?(low?8:0.5):c.t==='buff'?(c.kw||[]).reduce((a,k)=>a+k[1]*1.5,0)

    return best.sort((a,b)=>(D.cards[P.hand[b]].t==='def')-(D.cards[P.hand[a]].t==='def')||score(D.cards[P.hand[b]])-score(D.cards[P.hand[a]]));

  /* 적의 카드 선택. 방어 카드는 CFG.enemyGuard.chance% 확률로만 손에 남기고, 직전 라운드에 썼으면 이번엔 쓰지 않는다 */

        /* 혈귀 패시브 혈찬: 상대의 출혈이 5번 발동할 때마다 HP 15 회복 */
        if(B.hyeolchan){B.hc=(B.hc||0)+1;if(B.hc%5===0&&B.hp>0){const h=Math.min(15,B.maxHp-B.hp);B.hp+=h;L('kw',`  ${B.name} · 혈찬 · HP +${h}`)}}
        if(A.hp<=0)return;
      }
      /* 명중: 1d100 + 공격 + 카드 보정 > 상대 1d100 + 회피 (동점은 방어 성공). 두 번 굴림이면 높은 값 */
      let ra=d(100),ra2=0,pnote='';
      /* 앙갚음 장부: 3스택이면 이번 명중 굴림은 1d110, 스택 소모 */
      if(A.passive&&A.passive.id==='ledger'&&(A.ledger||0)>=A.passive.need){ra=d(110);A.ledger=0;pnote=` ${A.passive.n}(1d110)`}
      /* 장비 두 번 굴림: adv 1 이상이면 라운드 첫 공격마다, 1 미만이면 그 확률로 */
      if(c.adv||(A.adv&&!A.advUsed&&(A.adv>=1||d(100)<=A.adv*100))){ra2=d(100);if(ra2>ra)[ra,ra2]=[ra2,ra]}
      A.advUsed=true;
      /* 회피 주사위: 적은 단계별 크기(CFG.enemyEvadeDie), 플레이어는 1d100 */
      const rdMax=B.isP?100:(D.enemies[C.id].evadeDie||CFG.enemyEvadeDie[D.enemies[C.id].tier]||100),rd=d(rdMax);
      const fsb=A.fs?CFG.firstHit:0;A.fs=false;
      /* 검은 침묵의 장갑: 공격마다 1d9로 무기가 바뀐다 */
      let sub=null;
      if(A.wx&&A.wx.arsenal){const i=d(A.wx.arsenal.length);sub=A.wx.arsenal[i-1];(C.ars=C.ars||[]);if(!C.ars.includes(i))C.ars.push(i);pnote+=` 장갑 1d9 ${i}·${sub.n}`}
      const gr=A.isP&&A.cg&&c.t==='atk'?A.cg:null;
      const am=A.atk+c.hit+(gr?gr.hit:0)+fsb+A.passHit+(sub?sub.atk:0)-3*(A.prescript||0)-(A.isP&&A.laev==='open'&&isBlue(A)?CFG.laev.selfBlueHit:0),dm=B.eva+B.evaB-3*(B.shock||0)+(B.maskOn?B.passive.eva:0)+(B.odin?(C.round===1?30:15):0);
      const sa=sub&&sub.sure?Math.max(ra+am,rd+dm+1):ra+am,sd=rd+dm,G_=CFG.guard;
      const base={k:'atk',att:A.uid,def:B.uid,card:c,ra,ra2,rd,rdMax,am,dm,sa,sd,b:c.b,guard:B.guarding};
      /* 방어 자세: 막아도 피해 guardHit는 받는다 (키워드는 붙지 않음) */
      if(B.guarding&&sa<=sd){
        const dmg=G_.guardHit;B.hp=Math.max(0,B.hp-dmg);
        L('miss',`${A.name} → ${B.name} · ${c.n} · 명중 ${sa} vs 방어 ${sd} · 막았다 · 피해 ${dmg}`);
        push(Object.assign(base,{hit:false,blocked:true,rolls:[],dmg,note:''}));
        continue;
      }
      if(sa<=sd){
        if(B.passive&&B.passive.id==='godfather'&&!B.gfBonus){B.gfBonus=true;L('kw',`  ${B.name} · ${B.passive.n} · 다음 적중 피해 +1d2`)}
        L('miss',`${A.name} → ${B.name} · ${c.n} · 명중 ${sa} vs 회피 ${sd}${B.maskOn?` (${B.passive.n} +${B.passive.eva})`:''} · 빗나감`);
        push(Object.assign(base,{hit:false,rolls:[],dmg:0,note:''}));
        continue;
      }
      /* 피해: d6 × 카드 주사위 수 + 고정값. 최소값·재굴림은 카드/무기 효과 */
      const lo=Math.max(A.dmin,c.min||1),rolls=[];
      /* 피해 주사위 면 수: 기본 d6, 카드에 die가 있으면 그 값 (예: Furioso 1d2 × 9). 최소값 보정은 면 수를 넘지 않는다 */
      const die=c.die||(A.isP?A.pdie:6)||6,lo2=Math.min(lo,die);
      /* 전용 무기 피해 주사위: 카드 주사위 대신 무기 주사위 (Furioso처럼 주사위가 정해진 카드는 그대로) */
      const wd=!c.die&&A.wx?(sub?sub.dice:A.wx.dice):null;
      if(sub&&sub.range&&!c.die)rolls.push(sub.range[0]-1+d(sub.range[1]-sub.range[0]+1));
      /* 무기 주사위: 면 수는 무기, 개수는 카드와 무기 중 많은 쪽 (+ 카드 등급) */
      else if(wd){const n=Math.max(wd[0],c.dice)+(gr?gr.dice:0);for(let i=0;i<n;i++)rolls.push(Math.max(Math.min(lo,wd[1]),d(wd[1])))}
      else for(let i=0;i<c.dice+(gr&&!c.die?gr.dice:0);i++)rolls.push(Math.max(lo2,d(die)));
      let note=fsb?' 선제':'';
      if(c.rr&&rolls.length){
        let mi=0;rolls.forEach((v,i)=>{if(v<rolls[mi])mi=i});
        const nv=Math.max(lo2,d(die));if(nv>rolls[mi]){note+=` 재굴림 ${rolls[mi]}→${nv}`;rolls[mi]=nv}
      }
      let dmg=rolls.reduce((a,b)=>a+b,0)+c.b+(gr?gr.b:0);
      if(gr&&gr.n)note+=` 등급${gr.n}(피해+${gr.b})`;
      note+=pnote;
      /* 장비 추가 주사위 (천퇴성도: 적중마다 1d2 × N) */
      if(A.extraD2){let x=0;for(let i=0;i<A.extraD2;i++)x+=d(2);dmg+=x;note+=` 추가 1d2×${A.extraD2}+${x}`}
      if(A.passive){
        if(A.passive.id==='godfather'&&A.gfBonus){const x=d(2);dmg+=x;A.gfBonus=false;note+=` ${A.passive.n}+${x}`}
        if(A.passive.id==='claw'){const x=d(4);dmg+=x;note+=` ${A.passive.n}+${x}`}
      }
      if(A.breath>0){
        if(d(100)<=A.breath*CFG.breathCritPer){dmg=Math.floor(dmg*CFG.critMult);note+=' 치명'}
        A.breath--;
      }
      if(B.rupture>0){dmg+=B.rupture;note+=` ${D.keywords.rupture.n}+${B.rupture}`;B.rupture--}
      if(A.dmgB){dmg+=A.dmgB;note+=` 무기+${A.dmgB}`}
      /* 화상: 받는 피해 ×1.5, 5스택 이상이면 푸른 화염 ×2 */
      if(isBlue(B)){dmg=dmg*2;note+=' 푸른 화염×2'}else if(B.burn>0){dmg=Math.floor(dmg*1.5);note+=' 화상×1.5'}
      if(A.mark){const x=d(3)+d(3);dmg+=x;note+=` 표지+${x}`}
      if(B.guarding){dmg=Math.floor(dmg*G_.guardFailMul);note+=` 방어 감소×${G_.guardFailMul}`}
      /* 무기 디버프: 왜곡(내가 주는 피해 감소), 표적(3스택이면 2배), 원한(쌓인 만큼 추가) */
      if(A.matBonus){dmg+=A.matBonus;note+=` 신체관극+${A.matBonus}`}
      if(c.reuse&&A.mat>0){let x=0;for(let i=0;i<A.mat;i++)x+=d(c.die||6);dmg+=x;note+=` 폐장 재사용 ${A.mat}회+${x}`;A.mat=0}
      if(A.warp){dmg=Math.max(1,dmg-A.warp);note+=` 왜곡−${A.warp}`}
      if(A.wx&&A.wx.mark){B.mk=(B.mk||0)+1;if(B.mk>=A.wx.mark.need){dmg*=2;B.mk=0;note+=' 표적×2'}}
      if(A.wx&&A.wx.grudge&&A.grudge>0){const x=A.grudge*A.wx.grudge;dmg+=x;note+=` 원한+${x}`;A.grudge=0}
      if(B.wx&&B.wx.ward){dmg=Math.max(1,dmg-B.wx.ward);note+=` 책장−${B.wx.ward}`}
      if(A.psycho||B.psycho){const m=(A.psycho?CFG.innate.psycho:1)*(B.psycho?CFG.innate.psycho:1);dmg*=m;note+=` 사이코패스×${m}`}
      if(B.shield>0){const ab=Math.min(B.shield,dmg);B.shield-=ab;dmg-=ab;note+=` 보호막−${ab}`}
      B.hp=Math.max(0,B.hp-dmg);
      L('hit',`${A.name} → ${B.name} · ${c.n} · 명중 ${sa} vs ${B.guarding?'방어':'회피'} ${sd} · 피해 [${rolls.join(',')}]${c.b?sg(c.b):''}${note} = ${dmg}`);
      applyKw(A,B,c,L);
      /* 마에스트로 책장: 재료 수집 부여 / 신체관극(상대 디버프 수만큼 재료) */
      if(c.mat&&B.hp>0){B.matc=(B.matc||0)+c.mat;L('kw',`  ${B.name}에게 재료 수집 ${B.matc}`)}
      if(c.harvest&&B.matc>0){const n=['bleed','rupture','burn','prescript','warp','shock','mk','matc'].reduce((a,k)=>a+(B[k]>0?B[k]:0),0);
        A.mat=(A.mat||0)+n;A.matNext=(A.matNext||0)+n;L('kw',`  ${A.name} · 신체관극 · 재료 +${n} (지금 ${A.mat}) · 다음 라운드 적중마다 피해 +${A.matNext}`)}
      /* 전용 무기 효과: 적중 시 키워드·잔향·호흡·조율, 피격 시 반격 */
      if(A.wx&&B.hp>0){const X=A.wx;
        if(X.debuff){const {k,n}=X.debuff,nm={prescript:'지령',warp:'왜곡',shock:'감전'}[k];B[k]=Math.min(5,(B[k]||0)+n);L('kw',`  ${B.name}에게 ${nm} ${B[k]}`)}
        if(X.hitKw)for(const [k,n] of X.hitKw){B[k]=Math.min(CFG.stackCap,(B[k]||0)+n);L('kw',`  ${B.name}에게 ${D.keywords[k].n} +${n} (무기)`)}
        if(X.echo){B.wecho=(B.wecho||0)+1;L('kw',`  ${B.name}에게 잔향 ${B.wecho}/${X.echo.need}`);if(B.wecho>=X.echo.need){B.hp=Math.max(0,B.hp-X.echo.dmg);B.wecho=0;L('dmg',`  잔향이 울린다 · ${B.name} 고정 피해 ${X.echo.dmg}`)}}
        if(X.breathHit){A.breath=Math.min(CFG.stackCap,A.breath+X.breathHit)}
        if(X.execute&&B.hp>0&&B.hp<=B.maxHp*X.execute.below){B.hp=Math.max(0,B.hp-X.execute.dmg);L('dmg',`  조율 · ${B.name} 고정 피해 ${X.execute.dmg}`)}}
      if(B.wx&&B.wx.grudge&&B.hp>0){B.grudge=Math.min(5,(B.grudge||0)+1)}
      if(B.wx&&B.wx.thorns&&A.hp>0){A.hp=Math.max(0,A.hp-B.wx.thorns);L('dmg',`  ${B.name}의 무기 반격 · ${A.name} 피해 ${B.wx.thorns}`)}
      /* 검은 침묵의 장갑: 서로 다른 무기 3종을 쓰면 이번 전투에 한 번, 다음 손패에 Furioso */
      if(A.wx&&A.wx.arsenal&&!C.furiosoGiven&&(C.ars||[]).length>=3){C.furiosoGiven=true;A.furiosoNext=true;L('sys',`  ${A.name} · 서로 다른 무기 3종 · 다음 손패에 Furioso`)}
      /* 회피 실패: 1d5에서 1이면 정신력 1 감소 (E.G.O 장비 1개당 +1) */
      if(B.isP&&d(M.evadeDie)===1)loseMind(C.ch,1+(C.ch.egoGear||0),t=>L('kw',`  ${B.name} · ${t}`));
      /* 레바테인 계열: 적중 시 화상 */
      if(A.burnHit&&B.hp>0){B.burn=Math.min(CFG.stackCap,(B.burn||0)+A.burnHit);if(A.laev==='open')B.blue=true;
        L('kw',`  ${B.name}에게 ${A.laev==='open'?'푸른 화염':'화상'} +${A.burnHit} (지금 ${B.burn})`);
        /* 봉인: 화상을 건 횟수가 쌓이면 해방 (전투가 끝나도 유지) */
        if(A.laev==='sealed'){const ch=C.ch;ch.laevN=(ch.laevN||0)+A.burnHit;
          if(ch.laevN>=CFG.laev.unlock){const L_=D.relics.laev.open;A.laev='open';A.atk+=L_.fx.atk-(ch.gear.weapon.fx.atk||0);A.wx=L_.wx;
            equip(ch,Object.assign({id:'laev',grade:5},L_));ch.stash=(ch.stash||[]).filter(x=>x.id!=='laev_sealed');
            L('sys',`  봉인이 풀렸다 · 레바테인 (공+${L_.fx.atk}, 피해 1d15, 상대의 화상은 푸른 화염으로)`)}
          else L('kw',`  레바테인 봉인 ${ch.laevN}/${CFG.laev.unlock}`)}}
      /* 주사위마다 무작위 디버프 1 (Furioso): 출혈 또는 파열 */
      if(c.rngDebuff&&B.hp>0){const got={};for(let i=0;i<c.dice;i++){const k=one(c.rngDebuff);B[k]=Math.min(CFG.stackCap,B[k]+1);got[k]=(got[k]||0)+1}
        L('kw',`  ${B.name}에게 ${Object.entries(got).map(([k,n])=>D.keywords[k].n+' +'+n).join(' · ')} (무작위)`)}
      if(B.passive&&B.passive.id==='ledger'&&B.hp>0){B.ledger=Math.min(B.passive.need,(B.ledger||0)+1);L('kw',`  ${B.name} · ${B.passive.n} ${B.ledger}/${B.passive.need}`)}
      if(A.passive&&A.passive.id==='echo'&&B.hp>0){
        B.echo=(B.echo||0)+1;L('kw',`  ${B.name}에게 ${A.passive.n} ${B.echo}/${A.passive.need}`);
        if(B.echo>=A.passive.need){B.hp=Math.max(0,B.hp-A.passive.dmg);B.echo=0;L('dmg',`  ${A.passive.n}이 울린다 · ${B.name} 고정 피해 ${A.passive.dmg}`)}
      }
      push(Object.assign(base,{hit:true,rolls,dmg,note}));
    }
  }
  /* pp, ep: 이번 라운드에 낼 카드 배열 */
  function resolveRound(C,pp,ep){
    const {P,E}=C;
    C.cur=[];C.evs=[];
    const L=(t,s)=>{if(C.quiet)return;C.log.push({t,s});C.cur.push({t,s})};
    const push=ev=>{if(C.quiet)return;ev.lines=C.cur;C.cur=[];ev.snap=snap(C);ev.step=C.step;C.evs.push(ev)};
    L('head',`— ${C.round}라운드 · ${C.order[0].name} 선공 —`);
    if(C.round===1&&C.mindNote&&C.mindNote.length)C.mindNote.forEach(t=>L('kw',t));
    if(C.jobNote)L('kw',C.jobNote);
    C.step=-1;push({k:'head'});
    P.evaB=E.evaB=0;
    if(P.laev==='open'&&C.round>1&&C.round%CFG.laev.selfEvery===0){P.burn=Math.min(CFG.stackCap,(P.burn||0)+1);L('kw',`${P.name} · 레바테인 · 자신에게 화상 1 (지금 ${P.burn})`)}
    /* 아무 카드도 내지 않으면 방어 자세 */
    for(const [X,plays] of [[P,pp],[E,ep]]){
      X.guarding=plays.length===0;
      if(X.guarding){
        X.passHitNext=CFG.guard.nextHit;X.lightNext=CFG.guard.lightNext||0;X.lightUp=Math.min(CFG.guard.lightUpMax,X.lightUp+CFG.guard.lightUp);
        L('sys',`${X.name} · 방어 자세 · 이번 라운드 방어 판정 · 다음 라운드 명중 +${CFG.guard.nextHit} · 빛 +${CFG.guard.lightUp} (전투 동안)`);
        /* 플레이어 방어 자세: 출혈을 지혈해 스택을 줄인다 */
        if(X.isP&&X.bleed>0&&CFG.guard.bleedCut){const b0=X.bleed;X.bleed=Math.floor(X.bleed*CFG.guard.bleedCut);L('kw',`  ${X.name} 지혈 · ${D.keywords.bleed.n} ${b0} → ${X.bleed}`)}
        push({k:'def',side:X.uid,card:{n:'방어 자세'}});
      }
    }
    queue(C,pp,ep).forEach((st,i)=>{
      C.step=i;const A=C[st.side],c=st.card;
      if(c.next&&!A.isP){A.forceNext=c.next;L('sys',`${A.name} · ${c.n} · 다음 라운드 ${D.cards[c.next].n} 준비`)}
      if(c.t==='def'){const ev=(c.eva||CFG.defBonus)+A.defUp;A.evaB+=ev;if(c.lightNext)A.lightNext=(A.lightNext||0)+c.lightNext;L('sys',`${A.name} · ${c.n} · 이번 라운드 회피 +${ev}${c.lightNext?` · 다음 라운드 빛 +${c.lightNext}`:''}`);push({k:'def',side:A.uid,card:c});return}
      if(P.hp<=0||E.hp<=0)return;
      act(C,A,c,L,push);
    });
    C.step=-1;
    /* 연주(피아니스트): 라운드마다 악장 1. every에 닿으면 고정 피해 dmg, 그 라운드에 방어 자세였으면 절반 */
    if(E.passive&&E.passive.id==='recital'&&E.hp>0&&P.hp>0){
      const R=E.passive;E.recital=(E.recital||0)+1;
      if(E.recital>=R.every){const x=P.guarding?Math.floor(R.dmg/2):R.dmg;P.hp=Math.max(0,P.hp-x);E.recital=0;L('dmg',`${E.name} · ${R.n} · 절정 · ${P.name} 고정 피해 ${x}${P.guarding?' (방어 자세로 절반)':''}`)}
      else L('kw',`${E.name} · ${R.n} ${E.recital}/${R.every}${E.recital===R.every-1?' · 다음 라운드 끝에 절정 (방어 자세면 절반)':''}`);
      push({k:'buff',side:'E',card:{n:R.n}});
    }
    /* 푸른 화염: 라운드 끝에 스택 × blueDot 피해, 그 뒤 1 감소. 해방 레바테인 소지자의 일반 화상은 줄지 않는다 */
    for(const X of [P,E]){
      if(isBlue(X)&&X.hp>0){const x=X.burn*CFG.laev.blueDot;X.hp=Math.max(0,X.hp-x);X.burn--;L('dmg',`${X.name} · 푸른 화염 ${x} 피해 (남은 ${X.burn})`)}
      else if(X.burn>0&&!(X.isP&&X.laev==='open'))X.burn--;
      for(const k of ['prescript','warp','shock'])if(X[k]>0)X[k]--}
    if(P.hp<=0||C.ch.mindDead)C.over='lose';else if(E.hp<=0)C.over='win';
  }
  /* 자동 전투 (시뮬): 카드 고르는 순서도 행동 순서를 따른다 */
  function fightAuto(ch,id){
    const C=mkCombat(ch,id,true);let g=0;
    while(!C.over&&g++<80){
      let pp,ep;
      pp=autoPlay(C.P.hand.filter((_,i)=>i!==C.P.locked),C.P.light);ep=C.ePlan;
      resolveRound(C,pp,ep);
      if(!C.over)newRound(C);
    }
    return C;
  }

  /* ===== 밸런스 측정 ===== */
  const chainIds=()=>Object.keys(D.fixedFights).sort((a,b)=>a-b).map(y=>D.fixedFights[y]);
  function chainSim(n,grow){
    let clear=0;
    for(let t=0;t<n;t++){
      const ch=newChar();let ok=true;
      for(const [fi,sp] of chainIds().entries()){
        const id=encounter(ch,sp).id;
        if(grow)for(let g=0;g<(CFG.simGrowth[fi]||0);g++)applyFx(ch,one(rollGrowth()).g.fx);
        const C=fightAuto(ch,id);
        if(C.over!=='win'){ok=false;break}
        ch.hp=Math.min(ch.stats.maxHp,C.P.hp+CFG.chainHeal);
        if(grow){const c=rewardCard(ch);if(c)ch.deck.push(c)}
      }
      if(ok)clear++;
    }
    return clear/n;
  }
  function simulate(n){
    const rows=Object.keys(D.enemies).map(id=>{
      let w=0,rs=0,hl=0;

  function vMind(ch){
    const m=ch.mind,mx=CFG.mind.max,t=E.mindTier(ch),low=m<=CFG.mind.voiceAt;
    return `<div class="row between small"><span class="mono" style="color:${low?'var(--bad,#c46a5a)':'var(--gold)'}">정신력 ${m}/${mx}</span><span class="mono dim">${ch.ego?`E.G.O ${esc(ch.ego.n)} · 하한 ${CFG.mind.ego[ch.ego.type].floor}`:t?`호흡 +${t.breath}${t.eva?` · 회피 +${t.eva}`:''}`:low?'목소리가 가깝다':'보정 없음'}${ch.egoGear?` · E.G.O 장비 ${ch.egoGear}`:''}${ch.innate?` · <span style="color:var(--gold)">${esc(innateName(ch))}</span>`:''}${E.cardGrade(ch.year).n?` · 카드 등급 <b style="color:var(--gold)">${E.cardGrade(ch.year).n}</b>`:''}</span></div>
      <div class="bar" style="height:4px"><span style="width:${Math.round(m/mx*100)}%;background:${low?'#c46a5a':'#8a7fb8'}"></span></div>`;
  }
  function vHud(){
    const ch=G.ch,s=ch.stats,nx=E.xpNext(ch);
    return `<div class="panel stack">
      <div class="row between"><div class="row"><span class="swatch" style="background:${ch.color}"></span><b class="serif" style="color:${ch.color}">${esc(ch.name||T.you)}</b><span class="small" style="color:${ch.color}">${E.rankLabel(ch)}</span>${affLabel(ch)}</div>
      <span class="mono small dim">${E.age(G)}세 · ${G.year>CFG.years?`${G.year}년차 · ${CFG.endless.grades[E.gradeAt(G.year)]}`:`${G.year}/${CFG.years}년차`}</span></div>
      ${bar(ch.hp,s.maxHp)}
      ${vMind(ch)}
      <div class="mono small dim">HP ${ch.hp}/${s.maxHp} · 공격 ${sg(s.atk)} · 회피 ${sg(s.eva)} · 속도 ${sg(s.spd)} · 판정 ${sg(s.check)} · 카드 ${ch.deck.length}장</div>
      <div class="mono small dim">Lv ${ch.lv} · 경험치 ${ch.xp}${nx!=null?'/'+nx:' (최고)'}${E.canPromote(ch)?` · ${E.ptsName(ch)} ${ch.pp||0}/${E.promoNeed(ch)}`:''} · ${Object.values(ch.gear).map(g=>esc(g.n)).join(' · ')}</div>
      <div class="row between"><span class="mono small" style="color:var(--gold)">자산 ${E.money(ch.money)}${G.lastIncome&&UI.showIncome?` <span class="dim">(올해 수입 +${E.money(G.lastIncome)})</span>`:''}</span>
        </div>
      ${vInv()}
    </div>`;
  }
  /* 소지품: 정확한 능력치(장비 몫 따로), 장비 효과, 덱 카드 목록 */
  function vInv(){
    const ch=G.ch,s=ch.stats,gear=Object.values(ch.gear);
    const gsum=k=>gear.reduce((a,g)=>a+((g.fx||{})[k]||0),0);
    const row=(l,v,k)=>{const g=k?gsum(k):0;return `<div class="invr"><span>${l}</span><b class="mono">${v}</b><span class="mono small dim">${g?'장비 '+sg(g):''}</span></div>`};
    const stats=[row('최대 HP',s.maxHp,'maxHp'),row('공격 (명중 보정)',sg(s.atk),'atk'),row('회피',sg(s.eva),'eva'),row('속도 (순서 보정)',sg(s.spd),'spd'),
      row('사건 판정',sg(s.check),'check'),row('피해 주사위 최소',s.dmin,null),row('전투 시작 출혈',s.startBleed,null),row('전투 시작 호흡',s.startBreath,null),
      ...(s.defUp?[row('방어 카드 회피 추가',sg(s.defUp),null)]:[]),...(s.adv?[row('첫 공격 명중 두 번 굴림',s.adv>=1?'있음':Math.round(s.adv*100)+'% 확률',null)]:[])].join('');
    const eq=Object.entries(D.slots).map(([k,n])=>{const g=ch.gear[k];return `<div class="invr"><span>${n}</span><b>${g?esc(g.n):'<span class="dim">없음</span>'}</b><span class="mono" style="color:var(--gold)">${g?esc(g.e||''):''}</span></div>`}).join('');
    const cnt={};ch.deck.forEach(id=>cnt[id]=(cnt[id]||0)+1);
    const g_=E.cardGrade(ch.year),wx_=ch.gear.weapon&&ch.gear.weapon.wx||null;
    const cards=Object.entries(cnt).map(([id,n])=>{const c=D.cards[id],ga=c.t==='atk'&&g_.n;return `<div class="invc"><span class="cost">${c.c}</span><div><b>${esc(c.n)}${ga?` <span style="color:var(--gold)">${g_.n}</span>`:''}${n>1?` <span class="dim">×${n}</span>`:''}</b><div class="small dim">${c.t==='def'?'방어 · ':c.t==='buff'?'버프 · ':''}${cardLine(c,c.t==='atk'?g_:null,wx_)||''}${c.shield&&CFG.cardGrade.indexOf(g_)>0?` (지금 보호막 ${c.shield+5*CFG.cardGrade.indexOf(g_)})`:''}</div>${c.kw?`<span class="chips">${kwChips(c)}</span>`:''}</div></div>`}).join('');
    const tabs=[['stat','능력치'],['gear','장비'+((ch.stash||[]).length?' '+ch.stash.length:'')],['card','카드 '+ch.deck.length],['relic','전리품'+((ch.relics||[]).length?' '+ch.relics.length:'')]];
    const tab=UI.invTab||'stat';
    const body={stat:`<div>${stats}</div><div class="small dim">${esc(ch.o.n)} · ${esc(ch.t.n)} · ${esc(ch.f.n)} · ${esc(ch.w.n)}</div>`,
      gear:`<div><span class="eyebrow">장착 중</span>${eq}</div>${(ch.stash||[]).length?'':'<p class="small dim">보관함이 비어 있다. 장비를 바꾸면 이전 장비가 여기에 남는다.</p>'}
        ${(ch.stash||[]).length?`<div><span class="eyebrow">보관함</span>${ch.stash.map((g,i)=>`<div class="invr"><span>${D.slots[g.slot]} · <b>${esc(g.n)}</b></span>${UI.screen==='combat'?'<span class="small dim">전투 중 교체 불가</span>':`<button class="chip" data-a="eqs" data-i="${i}" style="cursor:pointer">장착</button>`}<span class="mono" style="color:var(--gold)">${esc(g.e||'')}</span></div>`).join('')}</div>`:''}`,
      card:`<div class="invcards">${cards}</div>`,
      relic:(ch.relics||[]).length?`${(ch.relics||[]).length?`<div><span class="eyebrow">전리품</span>${ch.relics.map(n=>{const e=Object.values(D.enemies).find(x=>x.drop&&x.drop.n===n),r=Object.values(D.relics||{}).find(x=>x.n===n);return `<div class="invr"><span>${esc(n)}</span><b class="mono" style="color:var(--gold)">${e?esc(e.drop.e):r?esc(r.e):''}</b></div>`}).join('')}</div>`:''}`:'<p class="small dim">아직 전리품이 없다. 숨은 보스를 이기면 얻는다.</p>'}[tab];
    return `<details class="inv"${UI.invOpen?' open':''}><summary>소지품 · 능력치</summary>
      <div class="seg invtabs" style="margin-top:8px">${tabs.map(([k,n])=>`<button class="${tab===k?'on':''}" data-a="invtab" data-i="${k}">${n}</button>`).join('')}</div>
      <div class="stack" style="gap:10px;margin-top:8px">${body}</div></details>`;
  }
  /* 공방: 등급별 목록. 들어갈 수 없는 등급은 조건을 보여 준다 */
  function vBlack(){
    if(!(UI.stock||[]).length)return '';
    const ch=G.ch;
    const items=UI.stock.map(id=>{const it=D.special[id],st=E.canBuySpecial(ch,id);
      const note=st==='owned'?(it.perm?'이미 받음':'장착 중'):st==='stash'?'보관 중':st==='money'?'돈이 모자란다':it.perm?'영구 강화':`${D.slots[it.slot]} 교체${ch.gear[it.slot]?' · 지금 '+esc(ch.gear[it.slot].n):''}`;
      return `<button class="btn" data-a="bspecial" data-i="${id}" ${st==='ok'?'':'disabled'}><span class="row between"><b>${it.n}</b><span class="mono" style="color:var(--gold)">${E.money(it.price)}</span></span>
        <span class="mono" style="color:var(--gold)">${it.e}</span><span class="mono small dim">${note}</span></button>`}).join('');
    return `<div class="panel stack" style="gap:8px;border-color:var(--bleed)"><div class="row between"><b class="serif">암시장</b><span class="chip">이번 방문만</span></div>
      <p class="small dim">출처를 묻지 않는 물건들. 이번에 지나가면 다음엔 다른 물건이 나온다.</p><div class="stack">${items}</div></div>`;
  }
  function vShop(){
    const ch=G.ch,acc=E.shopAccess(ch),A=D.access;
    /* 입장 조건 문구: 그 등급을 주는 소속 / (한 등급 낮은 소속 또는 무소속) + 해결사 급수 보너스 */
    const need=g=>{
      const nm=f=>Object.entries(A.aff).filter(([,v])=>f(v)).map(([k])=>T.affTypes[k]);
      const direct=nm(v=>v>=g),low=nm(v=>v<g&&v+A.rankBonus.plus>=g),rk=`${T.licensed} ${A.rankBonus.rank}${T.rankUnit} 이상`;
      const parts=[];if(direct.length)parts.push(direct.join('·')+' 소속');
      if(A.base+A.rankBonus.plus>=g)parts.push(rk);else if(low.length)parts.push(`${low.join('·')} 소속이면서 ${rk}`);
      return parts.join(', 또는 ');
    };
    const shops=D.workshops.map(w=>{
      const open=w.grade<=acc;
      const items=Object.entries(D.items).filter(([,it])=>it.grade===w.grade).map(([id,it])=>{
        const st=E.canBuy(ch,id),cur=ch.gear[it.slot];
        const note=st==='owned'?'장착 중':st==='stash'?'보관 중':st==='money'?'돈이 모자란다':st==='locked'?'잠김':`${D.slots[it.slot]} 교체${cur?' · 지금 '+esc(cur.n):''}`;
        return `<button class="btn" data-a="buy" data-i="${id}" ${st==='ok'?'':'disabled'}><span class="row between"><b>${it.n}</b><span class="mono" style="color:var(--gold)">${E.isWs(ch)?`<s class="dim">${E.money(it.price)}</s> `:''}${E.money(E.priceOf(ch,id))}</span></span>
          <span class="mono" style="color:var(--gold)">${it.e}</span><span class="mono small dim">${D.slots[it.slot]} · ${note}</span></button>`;
      }).join('');
      return `<div class="panel stack" style="gap:8px${open?'':';opacity:.6'}"><div class="row between"><b class="serif">${w.n}</b><span class="chip${open?'':' dim'}">${w.grade}등급${open?'':' · 잠김'}</span></div>
        <p class="small dim">${w.t}${open?'':' 들어가려면 '+need(w.grade)+'.'}</p>${open?`<div class="stack">${items}</div>`:''}</div>`;
    }).join('');
    const gear=Object.entries(D.slots).map(([k,n])=>`<span class="chip">${n} · ${ch.gear[k]?esc(ch.gear[k].n):'없음'}</span>`).join('');
    return `${vHud()}<div class="stack" style="gap:6px"><div class="eyebrow">공방 · 내 등급 ${acc}</div><h2>무엇을 맞출까</h2>
      <div class="chips">${gear}</div>${UI.bought?`<p class="good small">${esc(UI.bought)}을(를) 맞췄다.</p>`:''}</div>${shops}${vBlack()}${vSell()}${vDelCard()}
      <button class="btn primary" data-a="unshop">공방을 나간다</button>`;
  }
  /* 공방 해결사: 보관함 장비 판매 */
  function vSell(){
    const ch=G.ch;if(!E.isWs(ch))return '';const st=ch.stash||[];
    return `<div class="panel stack" style="gap:8px"><div class="row between"><b class="serif">보관함 팔기</b><span class="chip">공방 해결사</span></div>
      <p class="small dim">보관함에 있는 장비를 공방에 넘긴다. 장착 중인 장비는 팔 수 없다.</p>
      ${UI.sold?`<p class="good small">${esc(UI.sold)}</p>`:''}
      ${st.length?st.map((g,i)=>`<button class="btn" data-a="sell" data-i="${i}"><span class="row between"><b>${esc(g.n)}</b><span class="mono" style="color:var(--gold)">+${E.money(E.sellValue(g))}</span></span><span class="mono small dim">${D.slots[g.slot]} · ${esc(g.e||'')}</span></button>`).join(''):'<p class="small dim">보관함이 비어 있다.</p>'}</div>`;
  }
  /* 공방: 카드 지우기 (방문 한 번에 1장, 덱 최소 장수 유지) */
  function vDelCard(){
    if(G.ch.deckLocked)return `<div class="panel stack" style="gap:6px"><b class="serif">카드 지우기</b><p class="small dim">엄지 검술을 익혀 덱이 고정되었다. 카드를 지울 수 없다.</p></div>`;
    const ch=G.ch,S=CFG.shop,del=UI.deleted||[],left=S.delMax-del.length,can=left>0&&ch.money>=S.delCost&&ch.deck.length>S.minDeck;
    return `<div class="panel stack" style="gap:8px"><div class="row between"><b class="serif">카드 지우기</b><span class="mono" style="color:var(--gold)">${E.money(S.delCost)} · 이번 방문 ${del.length}/${S.delMax}</span></div>
      <p class="small dim">덱에서 카드를 지운다. 공방에 들를 때마다 ${S.delMax}장까지, 덱은 ${S.minDeck}장 아래로 줄일 수 없다.</p>
      ${del.length?`<p class="good small">지운 카드 · ${del.map(esc).join(', ')}</p>`:''}
      ${left>0?`<div class="chips">${ch.deck.map((id,i)=>`<button class="chip" data-a="delcard" data-i="${i}" ${can?'':'disabled'}>${D.cards[id].n} ×</button>`).join('')}</div>`:''}
      ${left>0&&!can?`<p class="small dim">${ch.deck.length<=S.minDeck?'덱이 더 줄어들 수 없다.':'돈이 모자란다.'}</p>`:''}${left<=0?'<p class="small dim">이번 방문에는 더 지울 수 없다.</p>':''}</div>`;
  }
  function vRules(){
    return `<details><summary>규칙 요약</summary><ul>
      <li><b>출생</b> 출신·재능·결점·무기·색을 1d100으로 정한다. 색은 직접 바꿀 수 있다.</li>
      <li><b>성장기</b> ${D.childhood.stages.map(s=>s.age+'세').join('·')}에 1d100으로 성장표를 굴려 능력치가 하나씩 자란다. ${CFG.startAge}세부터 직접 산다.</li>
      <li><b>사건</b> 해마다 사건 하나. 주사위 판정(1d100 + 능력치 + 판정 보정 ≥ 난이도)이 있는 선택과 결과가 정해진 선택이 있다.</li>
      <li><b>출신 진로</b> 어떤 출신은 특정 진로(${Object.values(T.paths).join('·')})에 보정이 붙는다. 그 진로에 들어가는 판정에 보정값을 더하고, 그 진로의 권유 사건이 더 자주 찾아온다.</li>
      <li><b>소속</b> 권유 사건으로 일찍 들어가거나, ${CFG.affiliationYear}년차 갈림길에서 고른다. ${T.licensed}면 ${T.affTypes.office}에 바로 들어가거나 ${T.affTypes.assoc} 심사를 볼 수 있고, ${T.affTypes.wing} 입사 시험과 ${T.affTypes.finger}의 문은 누구에게나 열려 있다. 소속에 따라 전용 사건이 생긴다.</li>
      <li><b>명중</b> 1d100 + 공격 + 카드 보정 &gt; 상대 1d100 + 회피면 명중, 동점은 방어 성공. 일부 카드·무기는 명중을 두 번 굴려 높은 값을 쓴다.</li>
      <li><b>피해</b> 카드의 d6 개수만큼 굴려 합산. 코스트가 높은 카드는 주사위가 많다.</li>
      <li><b>순서</b> 라운드마다 1d100 + 속도. 1등은 빛 +${CFG.orderBonusLight}, 격차 ${CFG.gapFirst} 이상이면 첫 공격 명중 +${CFG.firstHit}. 뒤처지면 다음 라운드 순서 +${CFG.catchupBonus}.</li>
      <li><b>방어 자세</b> 카드를 하나도 내지 않으면 그 라운드는 회피 대신 방어로 받는다. 막으면 피해 ${CFG.guard.guardHit}, 못 막으면 피해 ×${CFG.guard.guardFailMul}. 다음 라운드 명중 +${CFG.guard.nextHit}${CFG.guard.lightUp?`, 그 전투 동안 빛과 빛 최대치 +${CFG.guard.lightUp}(최대 +${CFG.guard.lightUpMax})`:''}${CFG.guard.lightNext?`, 다음 라운드 빛 +${CFG.guard.lightNext}`:''}.</li>
      <li><b>빛</b> 라운드마다 ${CFG.light}. 남은 빛으로 손패 카드를 원하는 순서로 낸다. 남긴 빛은 사라진다.</li>
      <li><b>${D.keywords.bleed.n}</b> 공격할 때마다(빗나가도) 스택만큼 피해, 그 뒤 1 감소. 내가 방어 자세면 절반으로 지혈. <b>${D.keywords.rupture.n}</b> 피격 시 스택만큼 추가 피해, 피격마다 1 감소. <b>화상</b>(레바테인 전용) 받는 피해 ×1.5, 5스택 이상이면 <b>푸른 화염</b> ×2, 라운드 끝에 1 감소. <b>${D.keywords.breath.n}</b> 스택당 치명 ${CFG.breathCritPer}%(×${CFG.critMult}), 명중마다 1 소모.</li>
      <li><b>성장</b> 판정 성공 ${CFG.xp.ok}, 실패 ${CFG.xp.fail}, 판정 없는 선택 ${CFG.xp.plain}, 전투 승리 ${CFG.xp.win} 경험치. 레벨이 오르면 성장표를 1d100으로 세 번 굴려 하나를 고른다.</li>
      <li><b>${T.licensed}</b> 자격 시험, 계약, 견습으로 ${T.rankStart}${T.rankUnit}에 등록된다. 소속이 없거나 ${T.affTypes.office} 소속이면 전투에서 이긴 뒤 소문 판정(1d100 + ${T.paths.fixer} 진로 보정 ≥ ${CFG.winLicenseDc})으로도 등록된다. 고정 전투(${Object.keys(D.fixedFights).join('·')}년차)에서 이기면 2${T.rankUnit}씩 ${T.promote}한다.</li>
      <li><b>손가락 서열</b> ${Object.entries(D.fingers).map(([n,F])=>`${n}: ${F.ranks.map(r=>r.branch?r.branch.map(b=>b.n).join('/'):r.n).join(' → ')}`).join(' · ')}. 고정 전투 승리나 승급 사건으로 오르고, 오를 때마다 보정을 받는다. 서열 ${D.fingerRules.shopTier}단계 이상이면 공방 등급 +1.</li>
      <li><b>${D.pinky.n}</b> 어느 소속에도 겹쳐 붙는 표식. ${D.pinky.e}.</li>
      <li><b>돈과 공방</b> 해마다 소속 봉급(${T.licensed}는 급수 수당 추가), 전투 현상금, 일부 사건으로 ${D.money.unit}을 번다. 공방은 ${D.workshops.map(w=>w.n).join(' · ')} 3등급이고, 소속과 급수에 따라 들어갈 수 있는 등급이 정해진다. 무기·방어구·의수 칸마다 하나씩 맞춘다.</li>
